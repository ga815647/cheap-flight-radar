version: 0.1
status: experimental
project:
  name: cheap-flight-radar
  objective: Find real, abnormally cheap airfare Deals from Taiwan, ranked first by route-relative anomaly strength
    and then by current complete airfare, while retaining weaker promotional observations separately as Signals.
  currency: TWD
  timezone: Asia/Taipei
capability_state:
  ssot_semantics:
    product_intent_authority: PRODUCT_INTENT.md
    operational_policy_authority: flight-radar.yaml
    current_runtime_fields_do_not_define_product_ceiling: true
    accepted_target_capability_does_not_authorize_runtime_execution: true
    legacy_search_contracts_are_product_intent: false
    search_paths_and_provider_adapters_are_replaceable_implementation: true
  current_runtime:
    destination_scope: asia_oceania
    destination_scope_semantics: implemented_filter_preserved_until_separate_qualification
    destination_free_discovery_adapter: gflights_google_flight_deals
    exact_flexible_open_jaw_adapter: gflights_google_exact
    automatic_executable_fallback: none
  accepted_qualified_future:
    destination_scope: substrate_native_worldwide_non_exhaustive
    priority_markets:
    - JP
    - KR
    - CN
    commodity_search: borrow_qualified_external_substrate
    provider_access_adapters: replaceable_after_qualification
    current_runtime_expansion: forbidden_without_separate_qualification
  qualification_gates:
  - CFR-SR-B_gflights_qualification
  - CFR-SR-C_scoped_native_window_BORROW_bakeoff
  - CFR-SR-D_executable_TWD0_redundancy
  - CFR-SR-E_blind_spot_schema
  - CFR-SR-F_crawler_simplification
search:
  horizon_days: 120
  origin_country: TW
  origin_airports:
  - TPE
  - TSA
  - RMQ
  - KHH
  return_to_taiwan:
    completion_scope: any_public_passenger_airport_on_taiwan_main_island
    outbound_discovery_origin_scope_is_separate: true
    primary_return_search_airports:
    - TPE
    - TSA
    - RMQ
    - KHH
    primary_return_search_airports_are_bounded_pool_not_exhaustive_claim: true
    automatic_return_gateway_search_exhaustive: false
    opportunistic_main_island_return_airports_allowed: true
    live_route_evidence_required_for_non_primary_return_airport: true
    no_live_route_evidence_non_primary_semantics: not_searched_not_eligible_as_opportunistic_extra
    different_return_airport_allowed: true
    final_main_island_arrival_counts_as_trip_complete: true
    completion_validity_is_not_search_coverage: true
    post_arrival_main_island_ground_access_is_not_required_component: true
    coverage_gate_applies_to_outbound_origins_not_every_possible_return_airport: true
  destination_scope: asia_oceania
  weekday_restriction: none
  discovery_strategy: destination_free_deal_round_trip_or_one_way_sweep
  deep_search_candidate_limit: 20
  final_shortlist_limit: 10
  round_trip_benchmark: true
  outbound_first_contract:
    stage_a_request: OriginSweepRequest
    stage_a_destination_input: forbidden
    first_known_destination_record: OutboundSeed
    configured_origin_sweep_required: true
    caller_preselected_destination_invalidates_outbound_first_coverage_claim: true
    seed_evidence_kinds:
    - one_way_fare
    - round_trip_deal
    - destination_only
    round_trip_deal_must_not_be_divided_into_one_way_price: true
    serious_seed_requires_exact_outbound_one_way_probe: false
    exact_outbound_probe_requires:
    - exact_origin_airport
    - exact_destination_airport
    - exact_outbound_date
    - explicit_one_way_fare_scope
    - positive_current_price
    floor_windows_days:
      near_term: 30
      horizon_absolute: 120
    reserve_serious_candidate_breadth_across_markets:
    - japan
    - korea
    - china
    - world
    only_serious_outbounds_enter_return_expansion: false
    return_expansion_searches_multiple_reasonable_dates: true
    conventional_round_trip_benchmark_required: true
    usable_round_trip_may_complete_candidate_when_separate_return_one_way_does_not_converge: true
    open_jaw_and_mixed_taiwan_return_after_baseline_completion: true
    china_specialist_multimodal_expansion_after_baseline_completion: false
    status: legacy_compatibility_only
    round_trip_deal_may_be_formal_candidate_without_one_way_split: true
  price_time_views:
    near_term:
      enabled: true
      departure_within_days: 30
      purpose: actionable_low_price_for_travel_soon
    horizon_absolute:
      enabled: true
      departure_within_days: inherit_search_horizon
      purpose: lowest_usable_complete_trip_price_in_current_live_horizon
    do_not_treat_near_term_premium_as_horizon_floor: true
    do_not_stop_floor_search_after_coarse_target_band_hit: true
  coverage_gate:
    enabled: true
    require_attempt_for_each_origin_airport: true
    incomplete_origin_coverage_action: mark_missing_and_do_not_claim_full_radar
    report_origin_coverage: true
  display_policy:
    taiwan_airport_labels:
      TPE: 桃園
      TSA: 松山
      RMQ: 台中
      KHH: 高雄
    include_iata_with_airport_label: true
    require_airport_specific_taiwan_label: true
    forbid_taipei_alias_for_tpe_or_tsa: true
    forbidden_ambiguous_taiwan_origin_labels:
    - 台北
    - Taipei
    unresolved_metro_area_action: mark_airport_unknown_and_do_not_publish_as_airport_specific_deal
  daily_profiles:
    enabled: true
    shared_origin_coverage: true
    unified_final_ranking: true
    profiles:
      world:
        enabled: true
        destination_scope: asia_oceania
        mode: priority_coverage_with_shared_pipeline
        include_specialist_countries_in_discovery: true
        specialist_country_deep_expansion: false
        specialist_countries:
        - JP
        - KR
        - CN
        report_section: world_other_surprises
      japan:
        enabled: true
        destination_countries:
        - JP
        mode: priority_coverage_with_shared_pipeline
        allow_open_jaw: true
        onward_modes:
        - domestic_flight
        - rail
        - bus
      korea:
        enabled: true
        destination_countries:
        - KR
        mode: priority_coverage_with_shared_pipeline
        allow_open_jaw: true
        floor_scan_policy: all_relevant_korean_airports_not_only_seoul_or_busan
        floor_scan_seed_airports:
        - ICN
        - GMP
        - PUS
        - CJU
        - TAE
        - CJJ
        floor_scan_seed_list_exhaustive: false
        onward_modes:
        - domestic_flight
        - rail
        - bus
      china:
        enabled: true
        destination_countries:
        - CN
        mode: priority_coverage_with_shared_pipeline
        allow_open_jaw: true
        enable_multimodal_gateways: false
        onward_modes:
        - domestic_flight
        - rail
        - bus
  horizon_semantics: default_compute_budget_not_product_bound
  horizon_extension_allowed_when_provider_surface_is_cheap: true
  search_architecture:
    stage_a: destination_free_sweep_from_each_taiwan_origin
    accepted_seed_kinds:
    - qualified_round_trip_deal
    - round_trip_fare
    - one_way_fare
    - destination_only
    direct_qualified_round_trip_deal_can_skip_return_construction: true
    cheap_one_way_or_explore_seed_requires_endpoint_specific_completion: true
    expand_open_jaw_only_for_competitive_endpoints: true
    brute_force_city_date_city_matrix: forbidden_by_default
    market_specialist_pipeline_required: false
    market_priority_order:
    - japan
    - korea
    - china
    - other_asia_oceania
fare_policy:
  include_low_cost_carriers: true
  include_full_service_carriers: true
  allow_one_stop_international: true
  allow_self_transfer: true
  self_transfer_penalty: false
  allow_mixed_carriers: true
  allow_mixed_taiwan_airports: true
  baggage:
    normalization_mode: required_trip_baggage
    default_assumption: personal_item_or_cabin_bag_only
    add_checked_baggage_only_when_needed: true
  formal_deal_ranking_ignores_connection_brand_schedule_friction: true
routing:
  open_jaw: true
  allow_positioning_segments: true
  positioning_modes:
  - domestic_flight
  - rail
  - bus
  max_extra_flight_segments_default: 1
  prefer_domestic_positioning_over_cross_border_self_transfer: true
  reject_unverified_connections: true
  short_local_access:
    normalization: ignore_cost_and_comparative_time
    exact_fare_or_duration_required: false
    can_fail_closed: false
    practical_connection_feasibility_required_when_time_sensitive: true
    definition: Short local first/last-mile or intra-gateway-area movement that can normally be handled by taxi
      or ordinary local transit and is not itself the travel product being compared.
    examples:
    - airport_to_same_city_or_gateway_area
    - port_to_same_city_or_gateway_area
    - short_airport_to_port_or_port_to_airport
    does_not_apply_to:
    - intercity_or_cross_region_transfer
    - ferry_or_mainland_rail_or_domestic_flight
    - required_connection_wait_or_checkin
    - required_overnight_connection_wait
  ferry_in_product_scope: false
return_windows:
- max_one_way_hours: 2.5
  min_nights: 2
  max_nights: 6
  ideal_nights:
  - 2
  - 4
- max_one_way_hours: 4.0
  min_nights: 3
  max_nights: 8
  ideal_nights:
  - 3
  - 5
- max_one_way_hours: 6.0
  min_nights: 4
  max_nights: 10
  ideal_nights:
  - 4
  - 6
- max_one_way_hours: 9.0
  min_nights: 5
  max_nights: 12
  ideal_nights:
  - 6
  - 8
- max_one_way_hours: 12.0
  min_nights: 6
  max_nights: 14
  ideal_nights:
  - 7
  - 10
- max_one_way_hours: null
  min_nights: 8
  max_nights: 18
  ideal_nights:
  - 9
  - 14
usable_time:
  primary_measure: usable_destination_hours
  derive_usable_days_from_hours: true
  usable_day_hours: 12
  penalize_unusable_connection_time: true
  long_connection_duration_alone_is_not_penalty: true
  usable_stopover:
    enabled: true
    track_as_usable_stopover_hours: true
    qualifying_hours_count_as_usable_trip_time: true
    verified_excursion_hours_reduce_connection_penalty: true
    do_not_convert_entire_scheduled_layover_to_usable_time: true
    never_reward_transport_efficiency_above_practical_baseline: true
    qualification_requires:
    - entry_and_document_requirements_feasible
    - minimum_connection_and_recheck_buffers_preserved
    - local_access_practically_allows_excursion
    - baggage_and_recheck_constraints_compatible
    uncertainty_action: treat_unverified_portion_as_connection_time
  do_not_reward_excess_trip_length_beyond_ideal: true
  formal_deal_ranking_role: none
cost:
  effective_total_transport_price_includes:
  - international_airfare
  - required_domestic_airfare
  - required_baggage
  exclude_by_default:
  - short_local_taxi_or_equivalent_access_cost
  - normal_local_sightseeing_transport
  - lodging_including_transport_caused_overnight
  - meals
  formal_deal_price_semantics: complete_airfare_only
ranking:
  destination_airport_anomaly_normalization:
    enabled: true
    destination_key: exact_destination_airport
    taiwan_origin_scope: configured_origin_airports
    candidate_current_fare: lowest_complete_airfare_across_configured_taiwan_origins_for_destination
    external_typical_baseline: minimum_qualified_typical_price_for_same_destination_airport_across_configured_taiwan_origins_in_current_sweep
    exact_itinerary_retains_actual_origin: true
    origin_specific_typical_must_not_override_lower_same_destination_baseline: true
    city_grouping_role: secondary_presentation
  preserve_views:
  - near_term_cheapest
  - absolute_cheapest
  - best_short_break
  - unusual_long_haul_deal
  price_view_semantics:
    near_term_cheapest: lowest_usable_complete_trip_price_departing_within_30_days
    absolute_cheapest: lowest_usable_complete_trip_price_in_rolling_120_day_horizon
    historical_anomaly: separate_evidence_axis_not_a_synonym_for_absolute_cheapest
  composite_score:
    enabled: true
    role: internal_discovery_ordering_only_not_formal_deal_ranking
    publish_winner: false
    user_facing_view: false
  primary_recommendation_components:
    effective_total_price: 0.35
    route_value: 0.25
    trip_length_fit: 0.25
    transport_efficiency: 0.15
  weights_status: provisional_until_historical_calibration
  price_priority_rule: Absolute price and explicit user-facing views must never be hidden by the composite score.
    Composite scoring may order internal search candidates but must not publish a Best Value winner.
  formal_deal_order:
  - relative_anomaly_strength_desc
  - current_complete_airfare_twd_asc
  primary_user_facing_views:
  - deals
  - signals
  legacy_absolute_price_views_status: diagnostic_only_not_first_class_deal_views
  formal_deal_ignores:
  - trip_length_fit
  - transport_efficiency
  - connection_count
  - self_transfer
  - airline_brand
  - red_eye
  - visa_friction
  - lodging_cost
penalties:
  self_transfer:
    enabled: false
    severity: moderate
  excessive_connection_time:
    enabled: false
    applies_to: unusable_connection_time_after_verified_usable_stopover_hours
    severity: high
  usable_stopover:
    long_duration_alone_penalty: none
    self_transfer_and_reentry_risks_still_apply: true
    lodging_cost_is_not_transport_cost: true
    cannot_raise_transport_efficiency_above_practical_baseline: true
  insufficient_trip_length_for_route:
    enabled: false
    severity: high
  excessive_positioning_cost:
    enabled: true
    severity: high
  unverifiable_price_or_schedule:
    enabled: true
    severity: reject
  applies_to_formal_deal_ranking: false
china:
  enabled: true
  activation_profile: china
  destination_scope: any_province_or_municipality
  direct_air: true
  gateway_modes:
    kinmen:
      enabled: false
      taiwan_airport: KNH
      onward_mode: ferry
      mainland_gateway_area: Xiamen_Quanzhou
    matsu:
      enabled: false
      taiwan_airports:
      - MFK
      - LZN
      onward_mode: ferry
      mainland_gateway_area: Fuzhou
  coverage_gate:
    enabled: false
    applies_only_when_profile: china
    required_modes:
    - direct_air
    incomplete_mode_coverage_action: mark_missing_and_do_not_claim_full_china_radar
    report_mode_coverage: true
  ferry_data_policy:
    static_route_topology_allowed: true
    timetable_must_be_live: true
    fare_must_be_live: true
    operating_status_must_be_live: true
    passenger_eligibility_must_be_live: true
    document_requirements_must_be_live: true
    do_not_store_operational_timetable_as_constant: true
    status: retained_historical_reference_not_active_product_policy
  ferry_evaluation:
    compare_against_simplest_comparable_air_itinerary: true
    count_total_door_to_door_transport_time: true
    short_local_taxi_or_equivalent_transfer_time_excluded: true
    include_material_port_transfer_and_checkin_time: true
    connection_feasibility_still_required_for_excluded_local_access: true
    include_immigration_and_wait_time: true
    evaluate_savings_per_extra_transport_hour: true
    evaluate_extra_transport_time_share_of_usable_trip: true
    disruption_risk_model: qualitative_until_history_exists
    qualitative_levels:
    - low
    - medium
    - high
    penalize_missed_connection_cascade_risk: true
    never_invent_cancellation_probability: true
    status: retained_historical_reference_not_active_product_policy
  allow_mainland_domestic_flight: true
  allow_mainland_high_speed_rail: true
  allow_mainland_rail: true
  allow_open_jaw_exit: true
  mixed_routing:
    return_window_semantics: search_and_scoring_reference_not_hard_rejection
    gateway_expansion:
      trigger_when:
      - serious_gateway_seed_has_current_exact_fare_evidence
      - verified_practical_onward_or_open_jaw_edge_exists
      do_not_require_trip_within_default_return_window: true
    second_city_selection:
      require_verified_transport_edge: true
      geographic_proximity_alone_is_insufficient: true
      prefer_high_speed_rail_when: verified_rail_has_lower_required_transport_time_and_transfer_friction_than_domestic_flight
      use_domestic_flight_when: verified_rail_is_absent_or_materially_worse_for_total_required_transport_time
      consider_open_jaw_when: verified_exit_reduces_backtracking_or_complete_transport_cost_or_time
    stop_expansion_when:
    - next_required_component_cannot_be_currently_revalidated
    - complete_effective_cost_or_required_transport_time_cannot_be_normalized
    - candidate_no_longer_competes_with_round_trip_benchmark_or_existing_expansions
    - deep_search_candidate_limit_reached
    final_revalidation:
      round_trip_benchmark_required: true
      exact_airport_and_date_required_for_air_segments: true
      current_price_required_for_all_priced_segments: true
      live_schedule_required_for_time_sensitive_ground_or_ferry_segments: true
      excluded_short_local_access_is_not_an_essential_component: true
      essential_unknown_action: exploratory_not_verified
  document_requirements_must_be_verified_live: true
  ferry_schedule_must_be_verified_live: true
  ferry_in_product_scope: false
price_history:
  enabled: true
  persistence:
    observation_log_mode: immutable_run_snapshots
    durable_store: github_repository
    repository: self
    ref: history/price-observations
    snapshot_path_template: data/price-history/YYYY/MM/DD/{radar_run_id}.json
    immutable_run_snapshots: true
    baseline_state: derived_from_github_snapshots_each_run
    history_ref_absent_action: initialize_empty_history_without_backfill
    chatgpt_may_write_snapshot_directly_when_practical: true
    github_actions_may_write_validated_snapshot_when_delegated: true
    github_actions_is_not_durable_history_service: true
    artifact_role: transient_handoff_only
    data_snapshot_write_is_not_policy_or_code_merge: true
    canonical_daily_acquisition:
      local_day_timezone: Asia/Taipei
      max_automatic_attempts_per_local_day: 1
      scope: routine_automatic_control_only
      claim_path_template: data/production-attempts/YYYY/MM/DD/canonical.json
      claim_must_persist_before_live_provider_call: true
      prior_claim_without_snapshot_action: fail_closed_no_automatic_same_day_reacquisition
      run_recovery_path_template: data/run-evidence/YYYY/MM/DD/{radar_run_id}
      recovery_manifest_required_before_active_publication: true
    operator_requested_reacquisition:
      enabled: true
      requires_explicit_user_or_operator_request: true
      automatic_retry: false
      request_id_required: true
      request_id_must_be_unique_per_intentional_attempt: true
      claim_path_template: data/operator-attempts/YYYY/MM/DD/{request_id}.json
      claim_must_persist_before_live_provider_call: true
      duplicate_same_request_id_action: recovery_or_noop_never_reacquire
      run_id_prefix_template: operator-radar-{request_id}-
      snapshot_is_additional_immutable_price_history: true
      does_not_consume_or_replace_canonical_daily_claim: true
      does_not_overwrite_canonical_daily_snapshot: true
  backfill:
    synthetic_backfill: forbidden
    derive_only_from_observed_evidence: true
    unknown_when_evidence_absent: true
  observation_contract:
    require_radar_run_id: true
    retain_observation_timestamp: true
    retain_source: true
    retain_currency_and_original_price: true
    retain_normalized_twd_price: true
    distinguish_discovery_from_verified_price: true
    require_exact_origin_airport_for_route_baseline: true
    require_exact_destination_airport_for_route_baseline: true
    require_departure_date: true
    baseline_fare_scope: usable_complete_trip
    availability_states:
    - available
    - stale
    - disappeared
    current_floor_eligible_state: available
    historical_baseline_price_state: available
    stale_or_disappeared_retained_as_provenance: true
    prior_available_observation_remains_historical_evidence_after_disappearance: true
    current_live_views_use_current_radar_run_only: true
  departure_lead_time_buckets_days:
  - id: d0_14
    min_days: 0
    max_days: 14
  - id: d15_30
    min_days: 15
    max_days: 30
  - id: d31_60
    min_days: 31
    max_days: 60
  - id: d61_120
    min_days: 61
    max_days: 120
  comparison_origin_airports:
  - TPE
  - TSA
  - RMQ
  - KHH
  run_level_destination_sample: lowest_available_complete_airfare_across_comparison_origins
  comparison_dimensions:
  - exact_destination_airport_across_configured_taiwan_origins
  - trip_type
  - departure_lead_time_bucket
  - season_or_month_when_history_sufficient
  - comparable_trip_length
  baseline:
    statistic: median
    moving_windows_days:
    - 7
    - 30
    - 90
    primary_recent_window_days: 30
    fallback_window_order_days:
    - 90
    - 7
    minimum_samples_per_window: 3
    current_observation_excluded_from_own_baseline: true
    insufficient_samples_action: return_unknown
    never_impute_missing_window: true
  rolling_lows:
    windows_days:
    - 30
    - 90
    - 365
    include_all_time: true
    minimum_samples: 1
    low_alone_does_not_imply_historical_anomaly: true
  percentile:
    enabled: true
    method: empirical_midrank
    minimum_samples: 10
    insufficient_samples_action: return_unknown
  percentage_below_baseline:
    enabled: true
    primary_baseline_window: inherit_price_history_baseline_selection
    formula: (baseline_twd-current_twd)/baseline_twd*100
    positive_means_current_is_cheaper: true
    insufficient_baseline_action: return_unknown
  historical_low_distance:
    enabled: true
    amount_formula: current_twd-historical_low_twd
    percent_formula: (current_twd-historical_low_twd)/historical_low_twd*100
    insufficient_low_action: return_unknown
  confidence:
    basis: comparable_historical_sample_count
    levels:
      none:
        min_samples: 0
        max_samples: 0
      sparse:
        min_samples: 1
        max_samples: 2
      low:
        min_samples: 3
        max_samples: 9
      medium:
        min_samples: 10
        max_samples: 29
      high:
        min_samples: 30
        max_samples: null
  anomaly_labeling:
    historical_floor:
      rule: current_price_at_or_below_prior_all_time_low
      minimum_samples: 10
    unusually_low:
      calibration_status: uncalibrated
      action_until_calibrated: expose_metrics_without_label
    sparse_history_action: insufficient_history
  stale_disappeared_provenance:
    retain_events: true
    exclude_from_current_floor: true
    never_treat_as_currently_purchasable: true
  sparse_history_action: label_low_confidence_and_do_not_invent_percentile
  anomaly_views:
  - new_route_low
  - percentile_vs_route_history
  - percentage_below_recent_baseline
  role: supplemental_evidence_and_fallback_anomaly_truth
  required_for_formal_deal: false
  external_anomaly_truth:
    preferred: true
    normalization_scope: exact_destination_airport_across_configured_taiwan_origins
    google_flight_deals_typical_pool: minimum_qualified_typical_price_for_same_destination_airport_in_current_sweep
    candidate_selection: lowest_current_complete_airfare_for_same_destination_airport_before_exact_revalidation
    preserve_exact_origin_identity: true
    qualification_requires:
    - stable_surface
    - current_price_reproducibility
