name: SR-B version convergence

on:
  push:
    branches:
      - fix/cfr-sr-b-gflights-031

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfr-sr-b-gflights-031
          fetch-depth: 0
      - name: Converge version truth
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('flight-radar.yaml'): [('gflights==0.3.0', 'gflights==0.3.1')],
              Path('src/cheap_flight_radar/providers/gflights.py'): [
                  ('pinned ``gflights==0.3.0`` substrate', 'qualified ``gflights==0.3.1`` substrate'),
                  ('around gflights 0.3.0', 'around gflights 0.3.1'),
                  ('gflights 0.3.0', 'gflights 0.3.1'),
              ],
          }
          changed = False
          for path, rules in replacements.items():
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in rules:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed = True
          print(f'changed={changed}')
          PY
      - name: Commit converged files if needed
        run: |
          if git diff --quiet -- flight-radar.yaml src/cheap_flight_radar/providers/gflights.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-radar.yaml src/cheap_flight_radar/providers/gflights.py
          git commit -m "Converge gflights 0.3.1 version truth"
          git push origin HEAD:fix/cfr-sr-b-gflights-031
