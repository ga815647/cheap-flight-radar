name: One-shot Radar Pages dispatch

on:
  push:
    branches:
      - chatdev/production-soak-429-20260814

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[dispatch-radar-pages]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Radar Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
