name: Canonical production Radar

on:
  push:
    branches:
      - ops/radar-request
    paths:
      - "requests/daily.json"
  workflow_dispatch:
    inputs:
      request_date:
        description: Asia/Taipei local date (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: production-radar-acquisition
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout trigger request
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: _request

      - name: Resolve request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUEST_DATE="${{ inputs.request_date }}"
            ACTIVE=true
          elif [ -f "_request/requests/daily.json" ]; then
            REQUEST_DATE="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("_request/requests/daily.json").read_text(encoding="utf-8"))
          if payload.get("schema_version") != 1 or payload.get("mode") != "canonical_daily":
              raise SystemExit("invalid daily request contract")
          print(payload["requested_date"])
          PY
          )"
            ACTIVE=true
          else
            echo "Control-branch reset removed the prior request; no acquisition is due."
            ACTIVE=false
            REQUEST_DATE=""
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "request_date=$REQUEST_DATE" >> "$GITHUB_OUTPUT"

      - name: Validate local date
        if: steps.request.outputs.active == 'true'
        shell: bash
        env:
          REQUEST_DATE: ${{ steps.request.outputs.request_date }}
        run: |
          TODAY="$(TZ=Asia/Taipei date +%F)"
          if [ "$REQUEST_DATE" != "$TODAY" ]; then
            echo "Refusing stale/future canonical request: request=$REQUEST_DATE today=$TODAY" >&2
            exit 1
          fi

      - name: Checkout current application
        if: steps.request.outputs.active == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          path: _app

      - name: Checkout durable fare evidence
        if: steps.request.outputs.active == 'true'
        uses: actions/checkout@v6
        with:
          ref: history/price-observations
          path: _history

      - name: Checkout publication manifests
        if: steps.request.outputs.active == 'true'
        uses: actions/checkout@v6
        with:
          ref: publication/radar-reports
          path: _publication

      - name: Set up Python
        if: steps.request.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current application
        if: steps.request.outputs.active == 'true'
        run: python -m pip install -e _app

      - name: Inspect daily state
        if: steps.request.outputs.active == 'true'
        id: state
        shell: bash
        env:
          REQUEST_DATE: ${{ steps.request.outputs.request_date }}
        run: |
          python -m cheap_flight_radar.production_operations inspect \
            --history-dir _history \
            --publication-dir _publication \
            --date "$REQUEST_DATE" \
            --output _state.json
          STATUS="$(python -c 'import json; print(json.load(open("_state.json"))["status"])')"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          case "$STATUS" in
            acquire|recover_publication|published)
              ;;
            *)
              echo "Daily Radar failed closed in state: $STATUS" >&2
              cat _state.json >&2
              exit 1
              ;;
          esac

      - name: Persist one-per-day acquisition claim
        if: steps.request.outputs.active == 'true' && steps.state.outputs.status == 'acquire'
        shell: bash
        env:
          REQUEST_DATE: ${{ steps.request.outputs.request_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CLAIMED_AT="$(TZ=Asia/Taipei date --iso-8601=seconds)"
          python -m cheap_flight_radar.production_operations claim \
            --history-dir _history \
            --date "$REQUEST_DATE" \
            --claimed-at "$CLAIMED_AT" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-run-url "$RUN_URL" \
            --trigger-sha "${{ github.sha }}"
          cd _history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production-attempts
          git commit -m "Claim canonical Radar acquisition ${REQUEST_DATE}"
          git push origin HEAD:history/price-observations

      - name: Run canonical production acquisition
        if: steps.request.outputs.active == 'true' && steps.state.outputs.status == 'acquire'
        id: acquisition
        shell: bash
        run: |
          set -o pipefail
          python -m cheap_flight_radar.production_runtime \
            --policy _app/flight-radar.yaml \
            --history-dir _history \
            --output-dir _out 2>&1 | tee _runtime.log

      - name: Stage immutable success and recovery evidence
        if: steps.request.outputs.active == 'true' && steps.state.outputs.status == 'acquire' && steps.acquisition.outcome == 'success'
        id: success
        shell: bash
        env:
          REQUEST_DATE: ${{ steps.request.outputs.request_date }}
        run: |
          python -m cheap_flight_radar.production_operations stage-success \
            --output-dir _out \
            --history-dir _history \
            --date "$REQUEST_DATE" \
            --output _success.json
          RUN_ID="$(python -c 'import json; print(json.load(open("_success.json"))["radar_run_id"])')"
          echo "radar_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          cd _history
          git add data/price-history data/run-evidence
          git commit -m "Persist canonical Radar evidence ${RUN_ID}"
          git push origin HEAD:history/price-observations

      - name: Refresh history checkout after acquisition
        if: steps.request.outputs.active == 'true' && steps.state.outputs.status == 'acquire' && steps.acquisition.outcome == 'success'
        run: git -C _history pull --ff-only origin history/price-observations

      - name: Restore publication manifest from durable evidence
        if: steps.request.outputs.active == 'true' && (steps.state.outputs.status == 'recover_publication' || steps.state.outputs.status == 'published' || steps.acquisition.outcome == 'success')
        id: restore
        shell: bash
        env:
          REQUEST_DATE: ${{ steps.request.outputs.request_date }}
        run: |
          python -m cheap_flight_radar.production_operations restore-publication \
            --history-dir _history \
            --publication-dir _publication \
            --date "$REQUEST_DATE" \
            --output _restore.json
          RUN_ID="$(python -c 'import json; print(json.load(open("_restore.json"))["radar_run_id"])')"
          echo "radar_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Smoke-build publication before active push
        if: steps.request.outputs.active == 'true' && steps.restore.outcome == 'success'
        run: >-
          python -m cheap_flight_radar.production_publication
          --policy _app/flight-radar.yaml
          --history-dir _history
          --manifest-dir _publication/publication/runs
          --site-dir _site-smoke

      - name: Push active publication manifest
        if: steps.request.outputs.active == 'true' && steps.restore.outcome == 'success'
        shell: bash
        run: |
          cd _publication
          if [ -z "$(git status --porcelain -- publication/runs)" ]; then
            echo "Publication manifest already present; no data push required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publication/runs
            git commit -m "Publish canonical Radar ${{ steps.restore.outputs.radar_run_id }}"
            git push origin HEAD:publication/radar-reports
          fi

      - name: Explicitly dispatch Radar Pages
        if: steps.request.outputs.active == 'true' && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          repos/${{ github.repository }}/actions/workflows/radar-pages.yml/dispatches
          -f ref=main

      - name: Upload operational evidence
        if: always() && steps.request.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-production-radar-${{ steps.request.outputs.request_date }}-${{ github.run_id }}
          path: |
            _state.json
            _runtime.log
            _success.json
            _restore.json
            _out/
          if-no-files-found: warn
          retention-days: 14
