name: RP-02 minimum-away rework

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rework-and-gate:
    if: github.head_ref == 'feat/rp02-ftr-absolute-low-producer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e .

      - name: Apply audit rework
        run: python scripts/rp02_minimum_away_rework.py

      - name: Full deterministic Gate
        run: python -m unittest discover -s tests -v

      - name: Commit tested product rework
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flight-radar.yaml docs/ftr-handoff.md \
            src/cheap_flight_radar/ftr_absolute_low.py \
            tests/test_ftr_absolute_low.py
          if git diff --cached --quiet; then
            echo 'RP-02 audit rework already applied; nothing to commit.'
            exit 0
          fi
          git commit -m 'RP-02: enforce CFR minimum-away eligibility'
          git push origin HEAD:feat/rp02-ftr-absolute-low-producer
