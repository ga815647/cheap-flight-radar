name: Radar Pages

on:
  push:
    branches:
      - publication/radar-reports
    paths:
      - "publication/runs/*.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication manifests
        uses: actions/checkout@v6
        with:
          ref: publication/radar-reports

      - name: Checkout current generator
        uses: actions/checkout@v6
        with:
          ref: main
          path: _app

      - name: Checkout immutable fare evidence
        uses: actions/checkout@v6
        with:
          ref: history/price-observations
          path: _history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator
        run: python -m pip install -e _app

      - name: Build deterministic Radar site
        run: >-
          python -m cheap_flight_radar.publication
          --policy _app/flight-radar.yaml
          --history-dir _history
          --manifest-dir publication/runs
          --site-dir _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
