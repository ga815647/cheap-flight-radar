name: SR-F bounded worker via PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/cfr-sr-f-public-intelligence-simplification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cfr-sr-f-public-intelligence-simplification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute bounded worker
        run: python tools/sr_f_worker.py
      - name: Rework publication dependency found by first Worker gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/cheap_flight_radar/publication.py')
          text = path.read_text(encoding='utf-8')
          old_strip = '''def _coverage_strip_html(manifest: Mapping[str, Any]) -> str:\n    origins, fixed, china = _coverage_data(manifest)\n    origin_values = [str(value) for value in origins.values()]\n    origin_status = "complete" if origin_values and all(_status_tone(value) == "good" for value in origin_values) else "partial"\n    fixed_status = str(fixed.get("status", "unknown"))\n    china_status = str(china.get("status", "unknown"))\n    return (\n        '<div class="coverage-strip" aria-label="Radar coverage summary">'\n        f'<div class="coverage-pill"><span>Origins</span>{_status_badge(origin_status)}</div>'\n        f'<div class="coverage-pill"><span>Fixed watch</span>{_status_badge(fixed_status)}</div>'\n        f'<div class="coverage-pill"><span>China mode</span>{_status_badge(china_status)}</div>'\n        '</div>'\n    )\n'''
          new_strip = '''def _coverage_strip_html(manifest: Mapping[str, Any]) -> str:\n    origins, fixed, china = _coverage_data(manifest)\n    origin_values = [str(value) for value in origins.values()]\n    origin_status = "complete" if origin_values and all(_status_tone(value) == "good" for value in origin_values) else "partial"\n    china_status = str(china.get("status", "unknown"))\n    pills = [f'<div class="coverage-pill"><span>Origins</span>{_status_badge(origin_status)}</div>']\n    # SR-F retired fixed-watch acquisition. Preserve an old immutable run's\n    # historical fixed-watch evidence when present, but do not synthesize a\n    # current fixed-watch status for new runs.\n    if fixed:\n        pills.append(\n            f'<div class="coverage-pill"><span>Historical fixed watch</span>{_status_badge(str(fixed.get("status", "unknown")))}</div>'\n        )\n    pills.append(f'<div class="coverage-pill"><span>China mode</span>{_status_badge(china_status)}</div>')\n    return '<div class="coverage-strip" aria-label="Radar coverage summary">' + "".join(pills) + '</div>'\n'''
          if old_strip not in text:
              raise SystemExit('expected _coverage_strip_html block not found')
          text = text.replace(old_strip, new_strip)

          old_html = '''def _coverage_html(manifest: Mapping[str, Any], policy: Mapping[str, Any]) -> str:\n    origins, fixed, china = _coverage_data(manifest)\n    origin_rows = "".join(\n        f'<li><span>{escape(str(origin))}</span>{_status_badge(str(state))}</li>'\n        for origin, state in sorted(origins.items())\n    )\n    registry = policy["public_intelligence"]["fixed_watch_registry"]\n    cadence = {str(item["id"]): item["cadence_hours"] for item in registry}\n    source_rows = []\n    for item in fixed.get("sources", []):\n        source_id = str(item.get("id", "unknown"))\n        state = str(item.get("state", "unknown"))\n        threshold = cadence.get(source_id)\n        label = source_id + (f" · {threshold}h" if threshold is not None else "")\n        source_rows.append(f'<li><span>{escape(label)}</span>{_status_badge(state)}</li>')\n    china_rows = []\n    modes = china.get("modes", {})\n    if isinstance(modes, Mapping):\n        china_rows = [\n            f'<li><span>{escape(str(mode))}</span>{_status_badge(str(state))}</li>'\n            for mode, state in sorted(modes.items())\n        ]\n    return (\n        '<section class="ops-card"><div class="section-heading"><div><h2>Coverage &amp; Freshness</h2>'\n        '<p>Operational completeness for this immutable run.</p></div></div><div class="ops-grid">'\n        '<div class="ops-block"><h3>Origin coverage</h3><ul class="ops-list">' + origin_rows + '</ul></div>'\n        f'<div class="ops-block"><h3>Fixed-watch coverage: {escape(str(fixed.get("status", "unknown")))}</h3><ul class="ops-list">' + "".join(source_rows) + '</ul></div>'\n        f'<div class="ops-block"><h3>China-mode coverage: {escape(str(china.get("status", "unknown")))}</h3><ul class="ops-list">' + "".join(china_rows) + '</ul></div>'\n        '</div></section>'\n    )\n'''
          new_html = '''def _coverage_html(manifest: Mapping[str, Any], policy: Mapping[str, Any]) -> str:\n    origins, fixed, china = _coverage_data(manifest)\n    origin_rows = "".join(\n        f'<li><span>{escape(str(origin))}</span>{_status_badge(str(state))}</li>'\n        for origin, state in sorted(origins.items())\n    )\n    # Historical immutable manifests may contain fixed-watch evidence from the\n    # retired subsystem. Render that evidence from the manifest itself; current\n    # SSOT intentionally has no fixed-watch registry/cadence contract.\n    source_rows = []\n    for item in fixed.get("sources", []):\n        source_id = str(item.get("id", "unknown"))\n        state = str(item.get("state", "unknown"))\n        source_rows.append(f'<li><span>{escape(source_id)}</span>{_status_badge(state)}</li>')\n    fixed_block = ""\n    if fixed:\n        fixed_block = (\n            f'<div class="ops-block"><h3>Historical fixed-watch evidence: {escape(str(fixed.get("status", "unknown")))}</h3>'\n            '<ul class="ops-list">' + "".join(source_rows) + '</ul></div>'\n        )\n    china_rows = []\n    modes = china.get("modes", {})\n    if isinstance(modes, Mapping):\n        china_rows = [\n            f'<li><span>{escape(str(mode))}</span>{_status_badge(str(state))}</li>'\n            for mode, state in sorted(modes.items())\n        ]\n    return (\n        '<section class="ops-card"><div class="section-heading"><div><h2>Coverage &amp; Freshness</h2>'\n        '<p>Operational completeness for this immutable run.</p></div></div><div class="ops-grid">'\n        '<div class="ops-block"><h3>Origin coverage</h3><ul class="ops-list">' + origin_rows + '</ul></div>'\n        + fixed_block\n        + f'<div class="ops-block"><h3>China-mode coverage: {escape(str(china.get("status", "unknown")))}</h3><ul class="ops-list">' + "".join(china_rows) + '</ul></div>'\n        + '</div></section>'\n    )\n'''
          if old_html not in text:
              raise SystemExit('expected _coverage_html block not found')
          path.write_text(text.replace(old_html, new_html), encoding='utf-8')

          test_path = Path('tests/test_sr_f_public_intelligence_simplification.py')
          test = test_path.read_text(encoding='utf-8')
          needle = '    def test_current_docs_make_old_fixed_watch_material_historical(self):\n'
          extra = '''    def test_publication_has_no_active_fixed_watch_registry_dependency(self):\n        source = (ROOT / "src/cheap_flight_radar/publication.py").read_text(encoding="utf-8")\n        self.assertNotIn('policy["public_intelligence"]["fixed_watch_registry"]', source)\n        self.assertIn("Historical fixed-watch evidence", source)\n\n'''
          if extra not in test:
              test = test.replace(needle, extra + needle)
              test_path.write_text(test, encoding='utf-8')

          # Regenerate the final after-inventory after dispatch scaffolding was
          # deleted by the Worker script, so temporary Worker files do not appear
          # as retained architecture.
          doc = Path('docs/public-intelligence-simplification-2026-08-21.md')
          dtext = doc.read_text(encoding='utf-8')
          marker = '## After inventory\n'
          prefix = dtext.split(marker, 1)[0] + marker
          pat = r'fixed_watch|fixed-watch|fixed watch|Scrapy|scrapy|scrapy_playwright|scrapy-playwright|public_sources|fixed_watch_coverage'
          p = subprocess.run(['git','grep','-n','-I','-E',pat], text=True, capture_output=True)
          rows = [line for line in p.stdout.splitlines() if not line.startswith(('tools/sr_f_worker.py:', '.github/workflows/sr-f-worker'))]
          after = '\n'.join(f'- `{line}`' for line in rows[:250]) or '- none'
          suffix = '\n\nRemaining matches are retirement markers, historical evidence/docs, or regression assertions; no current fixed-watch executable runtime remains.\n\nHistorical research/docs may still mention fixed watches as prior evidence. Current executable authority is `PRODUCT_INTENT.md` + `flight-radar.yaml` + the SR-F current section in `docs/search-strategy.md`.\n'
          doc.write_text(prefix + after + suffix, encoding='utf-8')
          PY
      - name: Install simplified project
        run: python -m pip install -e .
      - name: Full deterministic gate
        run: python -m unittest discover -s tests -v
      - name: Verify no executable crawler residue
        shell: bash
        run: |
          if git grep -n -I -E 'from cheap_flight_radar\.(fixed_watch_runner|fixed_watch_state|public_sources)|Scrapy>=|scrapy-playwright|fixed-watch-run\.yml|policy\["public_intelligence"\]\["fixed_watch_registry"\]' -- pyproject.toml src tests .github/workflows flight-radar.yaml; then
            echo 'Executable fixed-watch/crawler residue remains' >&2
            exit 1
          fi
      - name: Commit Worker result
        shell: bash
        run: |
          git config user.name 'CFR SR-F Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify CFR public-intelligence signal lane'
          git push origin HEAD:feat/cfr-sr-f-public-intelligence-simplification
