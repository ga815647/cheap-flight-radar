name: One-shot fix recovery indentation

on:
  push:
    branches:
      - fix/daily-recovery-fail-closed-20260814
    paths:
      - .github/workflows/one-shot-fix-recovery-indentation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/daily-recovery-fail-closed-20260814
      - name: Repair indentation deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("src/cheap_flight_radar/production_operations.py")
          text = source.read_text(encoding="utf-8")
          start = text.index("    if publication_manifest.exists():\n")
          end = text.index("\n    if recovery_manifest.exists():\n", start)
          lines = [
              "    if publication_manifest.exists():",
              "        if not recovery_manifest.exists():",
              "            return DailyOperationState(",
              "                status=\"blocked_missing_recovery_evidence\",",
              "                reason=(",
              "                    \"active publication manifest exists without immutable recovery evidence; \"",
              "                    \"do not accept presentation state as durable recovery\"",
              "                ),",
              "                **common,",
              "            )",
              "        if publication_manifest.read_bytes() != recovery_manifest.read_bytes():",
              "            return DailyOperationState(",
              "                status=\"blocked_manifest_divergence\",",
              "                reason=\"active publication manifest differs from immutable recovery evidence\",",
              "                **common,",
              "            )",
              "        return DailyOperationState(",
              "            status=\"published\",",
              "            reason=\"canonical acquisition and active publication manifest already exist\",",
              "            **common,",
              "        )",
          ]
          source.write_text(text[:start] + "\n".join(lines) + text[end:], encoding="utf-8")

          tests = Path("tests/test_production_operations.py")
          text = tests.read_text(encoding="utf-8")
          start = text.index("    def test_active_publication_without_recovery_evidence_fails_closed(self):\n")
          end = text.index("    def test_manifest_divergence_fails_closed(self):\n", start)
          lines = [
              "    def test_active_publication_without_recovery_evidence_fails_closed(self):",
              "        run_id, history_rel = self.write_runtime_output()",
              "        snapshot_source = self.output / \"history\" / history_rel",
              "        snapshot_target = self.history / history_rel",
              "        snapshot_target.parent.mkdir(parents=True)",
              "        snapshot_target.write_bytes(snapshot_source.read_bytes())",
              "",
              "        manifest_source = self.output / \"publication\" / \"runs\" / f\"{run_id}.json\"",
              "        active = self.publication / \"publication\" / \"runs\" / f\"{run_id}.json\"",
              "        active.parent.mkdir(parents=True)",
              "        active.write_bytes(manifest_source.read_bytes())",
              "",
              "        state = inspect_daily_state(",
              "            history_dir=self.history,",
              "            publication_dir=self.publication,",
              "            requested_date=self.day,",
              "        )",
              "        self.assertEqual(state.status, \"blocked_missing_recovery_evidence\")",
              "",
              "",
          ]
          tests.write_text(text[:start] + "\n".join(lines) + text[end:], encoding="utf-8")
          PY
          rm .github/workflows/one-shot-fix-recovery-indentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cheap_flight_radar/production_operations.py tests/test_production_operations.py
          git add -u .github/workflows/one-shot-fix-recovery-indentation.yml
          git commit -m "fix: correct daily recovery guard indentation"
          git push origin HEAD:fix/daily-recovery-fail-closed-20260814
