name: RP-02 branch implementation gate

on:
  push:
    branches:
      - feat/rp02-ftr-absolute-low-producer

permissions:
  contents: write

jobs:
  implement-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RP-02 branch
        uses: actions/checkout@v4
        with:
          ref: feat/rp02-ftr-absolute-low-producer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Apply RP-02 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          module = '''"""Dedicated bounded absolute-low non-Deal selector for FTR handoff.

          The selector consumes only the current run's explicit exact non-Deal outcome
          pool. It never scans or rewrites the generic CFR Signal journal, performs no
          provider acquisition, and does not participate in CFR Deal ranking.
          """
          from __future__ import annotations

          from datetime import date, datetime
          from typing import Any, Mapping, Sequence

          from .airfare import AirfareRecord, is_international_asia_oceania
          from .models import TAIWAN_MAIN_ISLAND_PUBLIC_PASSENGER_AIRPORTS
          from .production_radar import RadarItem, RadarRunResult


          OUTPUT_STATE = "ftr_absolute_low_non_deal"
          SUPPORTED_CONTRACT_VERSION = "1.0"
          SUPPORTED_INPUT_STATES = ("exact_revalidated_candidate",)
          SUPPORTED_ORDERING = (
              "current_complete_airfare_twd_asc",
              "outbound_date_asc",
              "return_date_asc",
              "taiwan_origin_gateway_asc",
              "destination_arrival_airport_asc",
              "destination_departure_airport_asc",
              "record_id_asc",
          )


          class FTRAbsoluteLowPolicyError(ValueError):
              """Raised when the machine SSOT does not match the selector contract."""


          def _mapping(value: Any) -> Mapping[str, Any]:
              return value if isinstance(value, Mapping) else {}


          def validate_absolute_low_policy(policy: Mapping[str, Any]) -> Mapping[str, Any]:
              """Fail closed if the machine SSOT drifts from the implemented contract."""
              ftr = _mapping(policy.get("ftr_handoff"))
              producer = _mapping(ftr.get("absolute_low_non_deal_producer"))
              if not producer:
                  raise FTRAbsoluteLowPolicyError("missing ftr_handoff.absolute_low_non_deal_producer policy")
              if producer.get("enabled") is not True:
                  raise FTRAbsoluteLowPolicyError("absolute-low producer must be explicitly enabled")
              if str(producer.get("contract_version") or "") != SUPPORTED_CONTRACT_VERSION:
                  raise FTRAbsoluteLowPolicyError("absolute-low producer contract_version is unsupported")
              if str(producer.get("output_state") or "") != OUTPUT_STATE:
                  raise FTRAbsoluteLowPolicyError("absolute-low producer output_state drifted")
              if tuple(str(value) for value in (producer.get("input_states") or ())) != SUPPORTED_INPUT_STATES:
                  raise FTRAbsoluteLowPolicyError("absolute-low producer input_states drifted")
              if tuple(str(value) for value in (producer.get("ordering") or ())) != SUPPORTED_ORDERING:
                  raise FTRAbsoluteLowPolicyError("absolute-low producer ordering drifted")
              budget = _mapping(producer.get("budget"))
              limit = budget.get("max_selected_count")
              if isinstance(limit, bool) or not isinstance(limit, int) or limit <= 0:
                  raise FTRAbsoluteLowPolicyError("absolute-low max_selected_count must be a positive integer")
              eligibility = _mapping(producer.get("eligibility"))
              max_age = eligibility.get("max_observation_age_hours")
              if isinstance(max_age, bool) or not isinstance(max_age, int) or max_age <= 0:
                  raise FTRAbsoluteLowPolicyError("absolute-low max_observation_age_hours must be a positive integer")
              if str(eligibility.get("verification_state") or "") != "revalidated":
                  raise FTRAbsoluteLowPolicyError("absolute-low verification_state must remain revalidated")
              if str(eligibility.get("evidence_class") or "") != "exact_revalidated_candidate":
                  raise FTRAbsoluteLowPolicyError("absolute-low evidence_class must remain exact_revalidated_candidate")
              if tuple(str(value) for value in (eligibility.get("allowed_surfaces") or ())) != ("exact", "open_jaw"):
                  raise FTRAbsoluteLowPolicyError("absolute-low allowed_surfaces drifted")
              isolation = _mapping(producer.get("generic_signal_isolation"))
              if isolation.get("generic_signal_collection_is_not_selector_input") is not True:
                  raise FTRAbsoluteLowPolicyError("generic Signal isolation must remain enabled")
              if isolation.get("classification_signal_alone_is_ineligible") is not True:
                  raise FTRAbsoluteLowPolicyError("Signal classification alone must remain ineligible")
              deal_isolation = _mapping(producer.get("deal_isolation"))
              if deal_isolation.get("formal_deal_relabel_or_duplicate") != "forbidden":
                  raise FTRAbsoluteLowPolicyError("formal Deal relabel/duplicate must remain forbidden")
              canonical = _mapping(ftr.get("canonical_activation"))
              if canonical.get("enabled") is not False:
                  raise FTRAbsoluteLowPolicyError("RP-02 must not activate canonical FTR runtime")
              return producer


          def _aware_datetime(value: str) -> datetime | None:
              try:
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  return None
              if parsed.tzinfo is None or parsed.utcoffset() is None:
                  return None
              return parsed


          def _exact_dates(record: AirfareRecord) -> tuple[str, str] | None:
              outbound = record.outbound_date
              returned = record.return_date
              if not outbound or not returned:
                  return None
              try:
                  outbound_date = date.fromisoformat(outbound)
                  return_date = date.fromisoformat(returned)
              except ValueError:
                  return None
              if return_date <= outbound_date:
                  return None
              return outbound, returned


          def _destination_departure(record: AirfareRecord) -> str:
              if record.surface == "open_jaw" and len(record.legs) >= 2:
                  return record.legs[-1].origin
              return record.destination.iata


          def _taiwan_return_gateway(record: AirfareRecord) -> str:
              if record.surface == "open_jaw" and len(record.legs) >= 2:
                  return record.legs[-1].destination
              return record.origin.iata


          def _reproducible_identity(record: AirfareRecord) -> bool:
              search = _mapping(record.reproducible_search)
              if record.surface == "exact":
                  return bool(
                      str(search.get("origin") or "") == record.origin.iata
                      and str(search.get("destination") or "") == record.destination.iata
                      and str(search.get("date") or "") == str(record.outbound_date or "")
                      and str(search.get("return_date") or "") == str(record.return_date or "")
                  )
              if record.surface == "open_jaw":
                  raw_legs = search.get("legs")
                  if not isinstance(raw_legs, Sequence) or isinstance(raw_legs, (str, bytes)) or len(raw_legs) < 2:
                      return False
                  normalized = [(leg.origin, leg.destination, leg.date) for leg in record.legs]
                  observed = []
                  for raw in raw_legs:
                      if not isinstance(raw, Sequence) or isinstance(raw, (str, bytes)) or len(raw) != 3:
                          return False
                      observed.append(tuple(str(value) for value in raw))
                  return tuple(observed) == tuple(normalized)
              return False


          def _trust_provenance(record: AirfareRecord) -> bool:
              return bool(
                  record.provider
                  and record.observed_at
                  and record.reproducible_search
                  and (
                      record.booking_url
                      or record.evidence_url
                      or record.booking_token
                      or record.has_provider_leg_identity
                  )
              )


          def _identity(record: AirfareRecord) -> tuple[Any, ...]:
              dates = _exact_dates(record) or ("", "")
              return (
                  record.origin.iata,
                  record.destination.iata,
                  _destination_departure(record),
                  _taiwan_return_gateway(record),
                  dates[0],
                  dates[1],
                  tuple(
                      (leg.origin, leg.destination, leg.date, leg.departure_time, leg.arrival_time)
                      for leg in record.legs
                  ),
              )


          def _sort_key(item: RadarItem) -> tuple[Any, ...]:
              exact = item.exact
              if exact is None:
                  return (10**18, "", "", "", "", "", "")
              dates = _exact_dates(exact) or ("", "")
              return (
                  int(exact.current_price_twd or 10**18),
                  dates[0],
                  dates[1],
                  exact.origin.iata,
                  exact.destination.iata,
                  _destination_departure(exact),
                  exact.record_id,
              )


          def _eligible(
              item: RadarItem,
              *,
              run_at: datetime,
              policy: Mapping[str, Any],
              input_states: tuple[str, ...],
          ) -> bool:
              if item.classification != "Signal" or item.state not in input_states:
                  return False
              exact = item.exact
              if exact is None:
                  return False
              eligibility = _mapping(policy.get("eligibility"))
              if exact.verification_state != str(eligibility.get("verification_state")):
                  return False
              if exact.evidence_class != str(eligibility.get("evidence_class")):
                  return False
              if exact.surface not in tuple(str(value) for value in (eligibility.get("allowed_surfaces") or ())):
                  return False
              if not exact.complete_airfare or not exact.current_price_twd or exact.current_price_twd <= 0:
                  return False
              if _exact_dates(exact) is None or not exact.record_id or not exact.legs:
                  return False
              if exact.origin.iata not in {str(value) for value in policy_root_search(policy).get("origin_airports", ())}:
                  return False
              if _taiwan_return_gateway(exact) not in TAIWAN_MAIN_ISLAND_PUBLIC_PASSENGER_AIRPORTS:
                  return False
              if not is_international_asia_oceania(item.discovery.destination.country):
                  return False
              if not item.observation_id:
                  return False
              if not _reproducible_identity(exact) or not _trust_provenance(exact):
                  return False
              observed_at = _aware_datetime(exact.observed_at)
              if observed_at is None:
                  return False
              max_age = int(eligibility["max_observation_age_hours"])
              delta_hours = abs((run_at - observed_at).total_seconds()) / 3600.0
              if delta_hours > max_age:
                  return False
              return True


          def policy_root_search(producer_policy: Mapping[str, Any]) -> Mapping[str, Any]:
              root = producer_policy.get("_root_policy")
              return _mapping(_mapping(root).get("search"))


          def select_absolute_low_non_deals(
              result: RadarRunResult,
              *,
              policy: Mapping[str, Any],
          ) -> tuple[RadarItem, ...]:
              """Select a bounded price-first set from explicit exact non-Deal outcomes."""
              producer = dict(validate_absolute_low_policy(policy))
              producer["_root_policy"] = policy
              run_at = _aware_datetime(result.run_at)
              if run_at is None:
                  raise ValueError("RadarRunResult.run_at must be timezone-aware ISO-8601")

              deal_record_ids = {
                  item.exact.record_id
                  for item in result.deals
                  if item.exact is not None
              }
              deal_observation_ids = {
                  item.observation_id
                  for item in result.deals
                  if item.observation_id
              }
              deal_identities = {
                  _identity(item.exact)
                  for item in result.deals
                  if item.exact is not None
              }

              eligible: list[RadarItem] = []
              for item in result.exact_non_deal_candidates:
                  if not _eligible(
                      item,
                      run_at=run_at,
                      policy=producer,
                      input_states=SUPPORTED_INPUT_STATES,
                  ):
                      continue
                  assert item.exact is not None
                  if (
                      item.exact.record_id in deal_record_ids
                      or item.observation_id in deal_observation_ids
                      or _identity(item.exact) in deal_identities
                  ):
                      continue
                  eligible.append(item)

              eligible.sort(key=_sort_key)
              deduped: list[RadarItem] = []
              seen_record_ids: set[str] = set()
              seen_identities: set[tuple[Any, ...]] = set()
              for item in eligible:
                  assert item.exact is not None
                  identity = _identity(item.exact)
                  if item.exact.record_id in seen_record_ids or identity in seen_identities:
                      continue
                  seen_record_ids.add(item.exact.record_id)
                  seen_identities.add(identity)
                  deduped.append(item)

              limit = int(_mapping(producer.get("budget"))["max_selected_count"])
              return tuple(
                  RadarItem(
                      classification="Signal",
                      state=OUTPUT_STATE,
                      discovery=item.discovery,
                      exact=item.exact,
                      anomaly_source=item.anomaly_source,
                      anomaly_strength_percent=item.anomaly_strength_percent,
                      reason="selected by dedicated bounded FTR absolute-low non-Deal producer from current exact/revalidated evidence",
                      observation_id=item.observation_id,
                      anomaly_baseline_twd=item.anomaly_baseline_twd,
                      anomaly_scope=item.anomaly_scope,
                  )
                  for item in deduped[:limit]
              )


          def apply_absolute_low_selection(
              result: RadarRunResult,
              *,
              policy: Mapping[str, Any],
          ) -> RadarRunResult:
              selected = select_absolute_low_non_deals(result, policy=policy)
              return RadarRunResult(
                  radar_run_id=result.radar_run_id,
                  run_at=result.run_at,
                  deals=result.deals,
                  signals=result.signals,
                  coverage=result.coverage,
                  provider_failures=result.provider_failures,
                  exact_non_deal_candidates=result.exact_non_deal_candidates,
                  ftr_absolute_low_non_deals=selected,
              )
          '''
          module = "\n".join(line[10:] if line.startswith("          ") else line for line in module.splitlines()) + "\n"
          Path("src/cheap_flight_radar/ftr_absolute_low.py").write_text(module, encoding="utf-8")

          tests = '''from __future__ import annotations

          from copy import deepcopy
          from dataclasses import replace
          from datetime import datetime
          from pathlib import Path
          import unittest

          import yaml

          from cheap_flight_radar.airfare import AirfareLeg, AirfareRecord, AirportIdentity, ProviderResult
          from cheap_flight_radar.ftr_absolute_low import (
              FTRAbsoluteLowPolicyError,
              OUTPUT_STATE,
              SUPPORTED_INPUT_STATES,
              SUPPORTED_ORDERING,
              apply_absolute_low_selection,
              select_absolute_low_non_deals,
              validate_absolute_low_policy,
          )
          from cheap_flight_radar.production_radar import RadarItem, RadarRunResult
          from cheap_flight_radar.production_runtime import run_once

          ROOT = Path(__file__).resolve().parents[1]
          RUN_AT = datetime.fromisoformat("2026-08-19T08:00:00+08:00")


          def exact_record(
              record_id: str,
              *,
              price: int = 4200,
              origin: str = "TPE",
              destination: str = "KIX",
              return_gateway: str | None = None,
              outbound_date: str = "2026-10-05",
              return_date: str = "2026-10-09",
              observed_at: str = "2026-08-19T08:05:00+08:00",
              verification_state: str = "revalidated",
              evidence_class: str = "exact_revalidated_candidate",
              complete_airfare: bool = True,
              surface: str = "exact",
              booking_token: str | None = "token",
          ) -> AirfareRecord:
              if surface == "open_jaw":
                  return_gateway = return_gateway or "KHH"
                  legs = (
                      AirfareLeg(origin, destination, outbound_date, "08:00+08:00", "12:00+09:00"),
                      AirfareLeg("FUK", return_gateway, return_date, "13:00+09:00", "15:30+08:00"),
                  )
                  reproducible = {
                      "legs": [(leg.origin, leg.destination, leg.date) for leg in legs],
                      "currency": "TWD",
                      "country": "TW",
                  }
              else:
                  legs = (AirfareLeg(origin, destination, outbound_date, "08:00+08:00", "12:00+09:00"),)
                  reproducible = {
                      "origin": origin,
                      "destination": destination,
                      "date": outbound_date,
                      "return_date": return_date,
                      "currency": "TWD",
                      "country": "TW",
                  }
              return AirfareRecord(
                  record_id=record_id,
                  provider="gflights",
                  surface=surface,
                  origin=AirportIdentity(origin, city=origin, country="Taiwan"),
                  destination=AirportIdentity(destination, city=destination, country="Japan"),
                  legs=legs,
                  current_price_twd=price,
                  observed_at=observed_at,
                  verification_state=verification_state,
                  evidence_class=evidence_class,
                  complete_airfare=complete_airfare,
                  booking_token=booking_token,
                  reproducible_search=reproducible,
              )


          def radar_item(
              record: AirfareRecord | None,
              *,
              state: str = "exact_revalidated_candidate",
              classification: str = "Signal",
              observation_id: str | None = None,
          ) -> RadarItem:
              base = record or exact_record("fallback")
              return RadarItem(
                  classification=classification,
                  state=state,
                  discovery=base,
                  exact=record,
                  anomaly_source=None,
                  anomaly_strength_percent=None,
                  reason="fixture",
                  observation_id=observation_id if observation_id is not None else (f"obs-{record.record_id}" if record else None),
              )


          def run_result(*, pool=(), deals=()) -> RadarRunResult:
              return RadarRunResult(
                  radar_run_id="production-radar-20260819T080000+0800",
                  run_at=RUN_AT.isoformat(),
                  deals=tuple(deals),
                  signals=tuple(pool),
                  coverage={},
                  provider_failures=(),
                  exact_non_deal_candidates=tuple(pool),
              )


          class AbsoluteLowSelectorTest(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.policy = yaml.safe_load((ROOT / "flight-radar.yaml").read_text(encoding="utf-8"))

              def test_cheap_non_anomaly_exact_revalidated_complete_fare_is_selected(self):
                  source = radar_item(exact_record("cheap-non-anomaly", price=3900))
                  result = apply_absolute_low_selection(run_result(pool=(source,)), policy=deepcopy(self.policy))
                  self.assertEqual([item.state for item in result.ftr_absolute_low_non_deals], [OUTPUT_STATE])
                  self.assertEqual(result.ftr_absolute_low_non_deals[0].exact.record_id, "cheap-non-anomaly")
                  self.assertEqual(result.signals[0].state, "exact_revalidated_candidate")

              def test_lower_looking_generic_or_weak_signal_is_not_selected(self):
                  weak = radar_item(exact_record("weak-cheaper", price=1000), state="weak_seed")
                  valid = radar_item(exact_record("valid", price=3900))
                  selected = select_absolute_low_non_deals(run_result(pool=(weak, valid)), policy=deepcopy(self.policy))
                  self.assertEqual([item.exact.record_id for item in selected], ["valid"])

              def test_formal_deal_is_not_relabelled_or_duplicated(self):
                  record = exact_record("same-itinerary", price=3500)
                  deal = radar_item(record, classification="Deal", state="deal")
                  candidate = radar_item(record)
                  result = apply_absolute_low_selection(run_result(pool=(candidate,), deals=(deal,)), policy=deepcopy(self.policy))
                  self.assertEqual(result.deals, (deal,))
                  self.assertEqual(result.ftr_absolute_low_non_deals, ())

              def test_incomplete_non_exact_failed_non_converged_and_stale_only_are_ineligible(self):
                  base = exact_record("base")
                  invalid = (
                      radar_item(replace(base, record_id="incomplete", complete_airfare=False)),
                      radar_item(replace(base, record_id="nonexact", verification_state="exact_search")),
                      radar_item(replace(base, record_id="wrong-class", evidence_class="weak_seed")),
                      radar_item(replace(base, record_id="stale", observed_at="2026-08-17T00:00:00+08:00")),
                      radar_item(replace(base, record_id="no-provenance", booking_token=None, legs=(AirfareLeg("TPE", "KIX", "2026-10-05"),))),
                      radar_item(None, state="weak_seed"),
                  )
                  self.assertEqual(select_absolute_low_non_deals(run_result(pool=invalid), policy=deepcopy(self.policy)), ())

              def test_budget_truncates_by_absolute_price_not_anomaly(self):
                  policy = deepcopy(self.policy)
                  policy["ftr_handoff"]["absolute_low_non_deal_producer"]["budget"]["max_selected_count"] = 2
                  pool = (
                      radar_item(exact_record("p3000", price=3000, destination="NRT")),
                      radar_item(exact_record("p2000", price=2000, destination="KIX")),
                      radar_item(exact_record("p2500", price=2500, destination="FUK")),
                  )
                  selected = select_absolute_low_non_deals(run_result(pool=pool), policy=policy)
                  self.assertEqual([item.exact.record_id for item in selected], ["p2000", "p2500"])

              def test_equal_price_ties_have_stable_complete_order(self):
                  pool = (
                      radar_item(exact_record("z-id", price=3000)),
                      radar_item(exact_record("a-id", price=3000)),
                  )
                  selected = select_absolute_low_non_deals(run_result(pool=pool), policy=deepcopy(self.policy))
                  self.assertEqual([item.exact.record_id for item in selected], ["a-id"])

              def test_identical_input_repeated_and_reordered_has_identical_selected_ids(self):
                  first = radar_item(exact_record("first", price=2500, destination="FUK"))
                  second = radar_item(exact_record("second", price=2600, destination="NRT"))
                  third = radar_item(exact_record("third", price=2700, destination="KIX"))
                  a = select_absolute_low_non_deals(run_result(pool=(first, second, third)), policy=deepcopy(self.policy))
                  b = select_absolute_low_non_deals(run_result(pool=(third, first, second)), policy=deepcopy(self.policy))
                  self.assertEqual([item.exact.record_id for item in a], [item.exact.record_id for item in b])

              def test_existing_open_jaw_identity_is_preserved_without_new_search_behavior(self):
                  source = radar_item(exact_record("open-jaw", price=4100, surface="open_jaw", return_gateway="KHH"))
                  selected = select_absolute_low_non_deals(run_result(pool=(source,)), policy=deepcopy(self.policy))
                  self.assertEqual(len(selected), 1)
                  exact = selected[0].exact
                  self.assertEqual(exact.origin.iata, "TPE")
                  self.assertEqual(exact.destination.iata, "KIX")
                  self.assertEqual(exact.legs[-1].origin, "FUK")
                  self.assertEqual(exact.legs[-1].destination, "KHH")

              def test_machine_ssot_and_implementation_contract_drift_fails_closed(self):
                  producer = validate_absolute_low_policy(deepcopy(self.policy))
                  self.assertEqual(tuple(producer["input_states"]), SUPPORTED_INPUT_STATES)
                  self.assertEqual(tuple(producer["ordering"]), SUPPORTED_ORDERING)
                  self.assertEqual(producer["budget"]["max_selected_count"], 5)
                  self.assertFalse(self.policy["ftr_handoff"]["canonical_activation"]["enabled"])
                  drifted = deepcopy(self.policy)
                  drifted["ftr_handoff"]["absolute_low_non_deal_producer"]["ordering"] = ["record_id_asc"]
                  with self.assertRaisesRegex(FTRAbsoluteLowPolicyError, "ordering drifted"):
                      validate_absolute_low_policy(drifted)


          class NonAnomalyRuntimeAdapter:
              def __init__(self):
                  self.seed = AirfareRecord(
                      record_id="weak-floor-seed",
                      provider="gflights",
                      surface="flight_deals",
                      origin=AirportIdentity("TPE"),
                      destination=AirportIdentity("KIX", city="Osaka", country="Japan"),
                      legs=(AirfareLeg("TPE", "KIX", "2026-10-05"), AirfareLeg("KIX", "TPE", "2026-10-09")),
                      current_price_twd=4200,
                      observed_at=RUN_AT.isoformat(),
                      verification_state="discovery",
                      evidence_class="weak_seed",
                      complete_airfare=True,
                      reproducible_search={"origin": "TPE", "currency": "TWD"},
                  )

              async def flight_deals(self, *, origin, anchor_departure, anchor_return):
                  return ProviderResult("gflights", "flight_deals", "complete", (self.seed,) if origin == "TPE" else ())

              async def explore(self, *, origin, **kwargs):
                  return ProviderResult("gflights", "explore", "complete", ())

              async def exact(self, *, origin, destination, departure_date, return_date=None, **kwargs):
                  record = exact_record(
                      "runtime-exact-non-deal",
                      price=4200,
                      origin=origin,
                      destination=destination,
                      outbound_date=departure_date,
                      return_date=return_date or "2026-10-09",
                      observed_at="2026-08-19T08:05:00+08:00",
                  )
                  return ProviderResult("gflights", "exact", "complete", (record,))

              async def cheapest_dates(self, **kwargs):
                  return ProviderResult("gflights", "cheapest_dates", "complete", ())

              async def open_jaw(self, **kwargs):
                  return ProviderResult("gflights", "open_jaw", "empty", ())


          class AbsoluteLowRuntimeIntegrationTest(unittest.IsolatedAsyncioTestCase):
