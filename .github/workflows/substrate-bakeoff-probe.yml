name: substrate-bakeoff-probe

on:
  pull_request:
    branches:
      - chatdev/product-intent-20260813

permissions:
  contents: read

jobs:
  live-substrate-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRVL_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fli
        run: |
          python -m pip install --upgrade pip
          # flights 0.9.0 currently omits click from its wheel metadata even though the CLI imports it.
          python -m pip install flights click
          fli --help | head -n 30

      - name: Probe fli known-route and flexible-date surfaces
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/substrate-probe/fli
          probe() {
            name="$1"; shift
            echo "::group::fli ${name}"
            timeout 90s "$@" >"/tmp/substrate-probe/fli/${name}.out" 2>"/tmp/substrate-probe/fli/${name}.err"
            code=$?
            echo "exit_code=${code}"
            echo "stdout_bytes=$(wc -c <"/tmp/substrate-probe/fli/${name}.out")"
            echo "stderr_bytes=$(wc -c <"/tmp/substrate-probe/fli/${name}.err")"
            head -c 5000 "/tmp/substrate-probe/fli/${name}.out" || true
            echo
            cat "/tmp/substrate-probe/fli/${name}.err" || true
            echo "::endgroup::"
          }
          probe tpe_nrt_rt fli flights TPE NRT 2026-09-15 --return 2026-09-20 --currency TWD --country TW --language zh-TW --format json
          probe tsa_gmp_rt fli flights TSA GMP 2026-09-16 --return 2026-09-20 --currency TWD --country TW --language zh-TW --format json
          probe rmq_hkg_rt fli flights RMQ HKG 2026-09-17 --return 2026-09-21 --currency TWD --country TW --language zh-TW --format json
          probe khh_pvg_rt fli flights KHH PVG 2026-09-18 --return 2026-09-22 --currency TWD --country TW --language zh-TW --format json
          probe tpe_syd_rt fli flights TPE SYD 2026-10-15 --return 2026-10-22 --currency TWD --country TW --language zh-TW --format json
          probe tpe_nrt_dates fli dates TPE NRT --from 2026-09-01 --to 2026-10-31 --duration 5 --round --currency TWD --country TW --language zh-TW --format json
          exit 0

      - name: Install trvl v1.21.4 release
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $arch"; exit 1 ;;
          esac
          version=1.21.4
          curl -fsSL "https://github.com/MikkoParkkola/trvl/releases/download/v${version}/trvl_${version}_linux_${arch}.tar.gz" -o /tmp/trvl.tgz
          tar -xzf /tmp/trvl.tgz -C /tmp
          install -m 0755 /tmp/trvl /usr/local/bin/trvl
          trvl version || trvl --version || true
          trvl flights --help | head -n 60

      - name: Probe trvl explore, exact, round-trip, and flexible surfaces
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/substrate-probe/trvl
          probe() {
            name="$1"; shift
            echo "::group::trvl ${name}"
            timeout 90s "$@" >"/tmp/substrate-probe/trvl/${name}.out" 2>"/tmp/substrate-probe/trvl/${name}.err"
            code=$?
            echo "exit_code=${code}"
            echo "stdout_bytes=$(wc -c <"/tmp/substrate-probe/trvl/${name}.out")"
            echo "stderr_bytes=$(wc -c <"/tmp/substrate-probe/trvl/${name}.err")"
            head -c 5000 "/tmp/substrate-probe/trvl/${name}.out" || true
            echo
            cat "/tmp/substrate-probe/trvl/${name}.err" || true
            echo "::endgroup::"
          }
          probe tpe_explore trvl explore TPE --from 2026-09-01 --to 2026-12-11 --currency TWD --format json
          probe khh_explore trvl explore KHH --from 2026-09-01 --to 2026-12-11 --currency TWD --format json
          probe rmq_explore trvl explore RMQ --from 2026-09-01 --to 2026-12-11 --currency TWD --format json
          probe tsa_explore trvl explore TSA --from 2026-09-01 --to 2026-12-11 --currency TWD --format json
          probe tpe_nrt_rt trvl flights TPE NRT 2026-09-15 --return 2026-09-20 --currency TWD --format json
          probe tsa_gmp_rt trvl flights TSA GMP 2026-09-16 --return 2026-09-20 --currency TWD --format json
          probe rmq_hkg_rt trvl flights RMQ HKG 2026-09-17 --return 2026-09-21 --currency TWD --format json
          probe khh_pvg_rt trvl flights KHH PVG 2026-09-18 --return 2026-09-22 --currency TWD --format json
          probe tpe_syd_rt trvl flights TPE SYD 2026-10-15 --return 2026-10-22 --currency TWD --format json
          probe tpe_nrt_dates trvl dates TPE NRT --from 2026-09-01 --to 2026-10-31 --duration 5 --round-trip --currency TWD --format json
          exit 0

      - name: Upload raw probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: substrate-bakeoff-raw
          path: /tmp/substrate-probe
          if-no-files-found: warn
          retention-days: 7
