name: EXP artifact cleanup CFR pass2

on:
  push:
    branches:
      - exp/artifact-cleanup-cfr-20260820
    paths:
      - ".github/workflows/exp-artifact-cleanup-cfr-pass2.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6
        with:
          ref: exp/artifact-cleanup-cfr-20260820
          fetch-depth: 0

      - name: Enumerate classify and delete proven gate transport
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVIDENCE_PATH: repair/handoff/EXP_ARTIFACT_CLEANUP_CFR_01_PASS2_20260820.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPO"]
          evidence_path = Path(os.environ["EVIDENCE_PATH"])
          now = dt.datetime.now(dt.timezone.utc)

          def cmd(args, check=True):
              return subprocess.run(args, text=True, capture_output=True, check=check)

          def gh(endpoint):
              return json.loads(cmd(["gh", "api", endpoint]).stdout)

          def list_all():
              out=[]; page=1; reported=None
              while True:
                  p=gh(f"repos/{repo}/actions/artifacts?per_page=100&page={page}")
                  if reported is None: reported=int(p.get("total_count",0))
                  batch=p.get("artifacts",[]); out.extend(batch)
                  if len(batch)<100: break
                  page+=1
              return out,reported,page

          def run_meta(run_id):
              if not run_id: return None
              try: p=gh(f"repos/{repo}/actions/runs/{run_id}")
              except subprocess.CalledProcessError: return None
              return {k:p.get(k) for k in ("id","name","event","status","conclusion","head_branch","head_sha","created_at","updated_at","html_url")}

          def parse_ts(v):
              return dt.datetime.fromisoformat(v.replace("Z","+00:00")) if v else None

          def classify(a,r):
              name=str(a.get("name") or ""); status=(r or {}).get("status"); branch=(r or {}).get("head_branch"); run_name=(r or {}).get("name")
              created=parse_ts(a.get("created_at")); age=None if created is None else (now-created).total_seconds()/3600
              if status and status!="completed": return "ACTIVE_RUNTIME_DEPENDENCY",f"workflow run status={status}"
              if name.startswith("fixed-watch-run-"):
                  if age is None: return "UNKNOWN","fixed-watch age unavailable"
                  if age<24: return "ACTIVE_RUNTIME_DEPENDENCY",f"fixed-watch freshness cache age_hours={age:.3f}<24"
                  return "EXPIRED_HANDOFF_TRANSPORT",f"fixed-watch freshness cache age_hours={age:.3f}>=24"
              if name.startswith("rp05-local-gate-bundle-") and run_name=="RP-05 local Gate source bundle" and branch=="feat/rp05-ftr-same-day-recovery":
                  return "DISPOSABLE_TEST_DEBUG","completed 1-day RP-05 local Gate source/dependency transport; source is Git-durable"
              if name.startswith("rp05-local-gate-source-") and run_name=="RP-05 local Gate source bundle" and branch=="feat/rp05-ftr-same-day-recovery":
                  return "DISPOSABLE_TEST_DEBUG","completed 1-day RP-05 local Gate exact-source transport; source is Git-durable"
              if name in {"rp06-exact-source","rp06-offline-wheelhouse"} and run_name=="CI" and branch=="feat/rp06-route-shape-return-gateway":
                  return "DISPOSABLE_TEST_DEBUG","completed 1-day RP-06 local Gate bridge transport; exact source is Git-durable and wheelhouse is disposable dependency cache"
              return "UNKNOWN","not newly proven disposable in pass2"

          def norm(a):
              rid=((a.get("workflow_run") or {}).get("id")); r=run_meta(rid); c,reason=classify(a,r)
              return {"artifact_id":int(a["id"]),"name":a.get("name"),"size_bytes":int(a.get("size_in_bytes") or 0),"created_at":a.get("created_at"),"updated_at":a.get("updated_at"),"expires_at":a.get("expires_at"),"expired":bool(a.get("expired")),"workflow_run":r,"classification":c,"classification_reason":reason}

          main_sha=gh(f"repos/{repo}/commits/main").get("sha")
          raw,reported,pages=list_all(); before=[norm(x) for x in raw]; before_ids={x["artifact_id"] for x in before}
          candidates=[x for x in before if x["classification"] in {"DISPOSABLE_TEST_DEBUG","EXPIRED_HANDOFF_TRANSPORT"}]
          deleted=[]; skipped=[]; blockers=[]
          for expected in sorted(candidates,key=lambda x:x["artifact_id"]):
              aid=expected["artifact_id"]
              try: cur=gh(f"repos/{repo}/actions/artifacts/{aid}")
              except subprocess.CalledProcessError as e:
                  blockers.append(f"pre-delete GET failed {aid}: {e}"); skipped.append({**expected,"skip_reason":"pre-delete GET failed"}); continue
              curid={"artifact_id":int(cur["id"]),"name":cur.get("name"),"size_bytes":int(cur.get("size_in_bytes") or 0),"created_at":cur.get("created_at")}
              expid={k:expected[k] for k in ("artifact_id","name","size_bytes","created_at")}
              if curid!=expid:
                  blockers.append(f"identity mismatch {aid}"); skipped.append({**expected,"skip_reason":"identity mismatch","current_identity":curid}); continue
              rr=run_meta(((cur.get("workflow_run") or {}).get("id"))); cc,why=classify(cur,rr)
              if cc!=expected["classification"] or cc not in {"DISPOSABLE_TEST_DEBUG","EXPIRED_HANDOFF_TRANSPORT"}:
                  blockers.append(f"classification changed {aid}: {expected['classification']}->{cc}"); skipped.append({**expected,"skip_reason":"classification changed","current_classification":cc,"current_reason":why}); continue
              d=cmd(["gh","api","--method","DELETE",f"repos/{repo}/actions/artifacts/{aid}"],check=False)
              if d.returncode:
                  blockers.append(f"DELETE failed {aid}: {d.stderr.strip()}"); skipped.append({**expected,"skip_reason":"DELETE failed"}); continue
              deleted.append(expected)

          raw2,reported2,pages2=list_all(); after=[norm(x) for x in raw2]; after_ids={x["artifact_id"] for x in after}
          still={x["artifact_id"] for x in deleted}&after_ids
          if still: blockers.append(f"deleted ids still present: {sorted(still)}")
          concurrent=[x for x in after if x["artifact_id"] not in before_ids]
          total=lambda xs:sum(x["size_bytes"] for x in xs)
          cb=lambda cls:sum(x["size_bytes"] for x in after if x["classification"]==cls)
          ev={
            "package":"EXP-ARTIFACT-CLEANUP-CFR-01-PASS2","repo":repo,"main_sha":main_sha,"generated_at":now.isoformat(),
            "proof_basis":{
              "rp05":".github/workflows/rp05-local-gate-source-bundle.yml at historical exact heads: explicit source/dependency bundle, retention-days=1; PR #47 durable exact-head Gate and merged source exist",
              "rp06":".github/workflows/ci.yml at historical RP-06 heads: exact-source local Gate bridge + offline dependency wheelhouse, retention-days=1; PR #49 durable exact-head Gate and merged source exist"
            },
            "before":{"api_reported_total_count":reported,"enumerated_count":len(before),"pagination_pages":pages,"total_bytes":total(before),"total_mib":total(before)/1048576,"artifacts":sorted(before,key=lambda x:(-x["size_bytes"],x["artifact_id"]))},
            "cleanup":{"candidate_count":len(candidates),"deleted_count":len(deleted),"deleted_bytes":total(deleted),"deleted_mib":total(deleted)/1048576,"deleted":sorted(deleted,key=lambda x:(-x["size_bytes"],x["artifact_id"])),"skipped":skipped},
            "after":{"api_reported_total_count":reported2,"enumerated_count":len(after),"pagination_pages":pages2,"total_bytes":total(after),"total_mib":total(after)/1048576,"active_dependency_bytes":cb("ACTIVE_RUNTIME_DEPENDENCY"),"unique_evidence_bytes":cb("UNIQUE_DURABLE_EVIDENCE"),"unknown_bytes":cb("UNKNOWN"),"artifacts":sorted(after,key=lambda x:(-x["size_bytes"],x["artifact_id"]))},
            "accounting":{"concurrent_new_artifact_count":len(concurrent),"concurrent_new_artifacts":concurrent,"exact_reclaimed_bytes_from_verified_deletes":total(deleted),"expected_after_bytes_without_concurrency":total(before)-total(deleted),"observed_after_bytes":total(after)},
            "state":"INCONCLUSIVE" if blockers else "PASS","blockers":blockers
          }
          evidence_path.parent.mkdir(parents=True,exist_ok=True); evidence_path.write_text(json.dumps(ev,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"state":ev["state"],"before_count":len(before),"before_bytes":total(before),"deleted_count":len(deleted),"deleted_bytes":total(deleted),"after_count":len(after),"after_bytes":total(after),"unknown_bytes":ev["after"]["unknown_bytes"],"blockers":blockers},indent=2))
          PY

      - name: Persist pass2 evidence
        env:
          EVIDENCE_PATH: repair/handoff/EXP_ARTIFACT_CLEANUP_CFR_01_PASS2_20260820.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_PATH"
          git commit -m "EXP: record CFR artifact cleanup pass2"
          git push origin HEAD:exp/artifact-cleanup-cfr-20260820
