name: Mandarin KNH exact-fare probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'chatdev/knh-exact-fare-closeout-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vanilla Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect official Mandarin booking DOM
        run: python scripts/mandarin_knh_probe.py
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandarin-knh-probe
          path: artifacts/mandarin-knh-probe
          if-no-files-found: error
          retention-days: 3
