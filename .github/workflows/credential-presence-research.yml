name: Credential Presence Research

on:
  push:
    branches:
      - research/credentialed-validation-2026-08-10

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
      DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
      DUFFEL_LIVE_TOKEN: ${{ secrets.DUFFEL_LIVE_TOKEN }}
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
      FLYAI_KEY: ${{ secrets.FLYAI_KEY }}
    steps:
      - name: Record credential presence only
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          def present(*names):
              return any(bool(os.environ.get(name)) for name in names)

          result = {
              "skyscanner_api_key_present": present("SKYSCANNER_API_KEY"),
              "duffel_live_token_present": present("DUFFEL_LIVE_TOKEN", "DUFFEL_ACCESS_TOKEN"),
              "flyai_formal_api_key_present": present("FLYAI_API_KEY", "FLYAI_KEY"),
          }
          Path("credential-presence.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))

      - name: Upload presence result
        uses: actions/upload-artifact@v4
        with:
          name: credential-presence
          path: credential-presence.json
          if-no-files-found: error
