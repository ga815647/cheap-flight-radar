name: Credential Presence Research

on:
  push:
    branches:
      - research/credentialed-validation-2026-08-10

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SKYSCANNER_API_KEY: ${{ secrets.SKYSCANNER_API_KEY }}
      SKYSCANNER_KEY: ${{ secrets.SKYSCANNER_KEY }}
      SKYSCANNER_TOKEN: ${{ secrets.SKYSCANNER_TOKEN }}
      DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
      DUFFEL_LIVE_TOKEN: ${{ secrets.DUFFEL_LIVE_TOKEN }}
      DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
      DUFFEL_API_TOKEN: ${{ secrets.DUFFEL_API_TOKEN }}
      DUFFEL_API_KEY: ${{ secrets.DUFFEL_API_KEY }}
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
      FLYAI_KEY: ${{ secrets.FLYAI_KEY }}
      FLYAI_TOKEN: ${{ secrets.FLYAI_TOKEN }}
      FLY_AI_API_KEY: ${{ secrets.FLY_AI_API_KEY }}
    steps:
      - name: Record credential presence only
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          groups = {
              "skyscanner": ["SKYSCANNER_API_KEY", "SKYSCANNER_KEY", "SKYSCANNER_TOKEN"],
              "duffel": ["DUFFEL_ACCESS_TOKEN", "DUFFEL_LIVE_TOKEN", "DUFFEL_TOKEN", "DUFFEL_API_TOKEN", "DUFFEL_API_KEY"],
              "flyai": ["FLYAI_API_KEY", "FLYAI_KEY", "FLYAI_TOKEN", "FLY_AI_API_KEY"],
          }
          result = {
              "skyscanner_api_key_present": any(bool(os.environ.get(k)) for k in groups["skyscanner"]),
              "duffel_live_token_present": any(bool(os.environ.get(k)) for k in groups["duffel"]),
              "flyai_formal_api_key_present": any(bool(os.environ.get(k)) for k in groups["flyai"]),
              "probed_secret_names": groups,
          }
          Path("credential-presence.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))

      - name: Upload presence result
        uses: actions/upload-artifact@v4
        with:
          name: credential-presence
          path: credential-presence.json
          if-no-files-found: error
