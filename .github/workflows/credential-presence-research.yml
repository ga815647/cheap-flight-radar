name: Credential Presence Research

on:
  push:
    branches:
      - research/credentialed-validation-2026-08-10

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVIDER_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Record provider credential names and presence only
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          secrets = json.loads(os.environ.get("PROVIDER_SECRETS_JSON") or "{}")
          provider_keys = {
              "skyscanner": sorted(k for k in secrets if "SKYSCANNER" in k.upper()),
              "duffel": sorted(k for k in secrets if "DUFFEL" in k.upper()),
              "flyai": sorted(k for k in secrets if "FLYAI" in k.upper() or "FLY_AI" in k.upper()),
          }
          result = {
              "skyscanner_api_key_present": any(bool(secrets[k]) for k in provider_keys["skyscanner"]),
              "duffel_live_token_present": any(bool(secrets[k]) for k in provider_keys["duffel"]),
              "flyai_formal_api_key_present": any(bool(secrets[k]) for k in provider_keys["flyai"]),
              "matching_secret_names": provider_keys,
          }
          Path("credential-presence.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))

      - name: Upload presence result
        uses: actions/upload-artifact@v4
        with:
          name: credential-presence
          path: credential-presence.json
          if-no-files-found: error
