name: FlyAI Formal Key Research

on:
  push:
    branches:
      - research/credentialed-validation-2026-08-10

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
    steps:
      - name: Verify formal key presence
        shell: bash
        run: |
          if [ -z "$FLYAI_API_KEY" ]; then
            echo "FLYAI_API_KEY is not available to this workflow"
            exit 2
          fi
          echo "FLYAI_API_KEY is present; value will not be printed"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official FlyAI CLI
        run: npm install -g @fly-ai/flyai-cli@1.0.16

      - name: Configure formal API key
        shell: bash
        run: |
          flyai config set FLYAI_API_KEY "$FLYAI_API_KEY" >/dev/null
          echo "Formal API key configured in ephemeral runner"

      - name: Run formal-key fixed basket
        shell: python
        run: |
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          OUT = Path("research-output")
          OUT.mkdir(exist_ok=True)

          CASES = {
              "J1": ("TPE", "NRT", "2026-10-13", "2026-10-17"),
              "J2": ("TSA", "HND", "2026-10-13", "2026-10-18"),
              "J3": ("RMQ", "KIX", "2026-10-13", "2026-10-17"),
              "J4": ("KHH", "FUK", "2026-10-13", "2026-10-17"),
              "K1": ("TPE", "ICN", "2026-10-13", "2026-10-17"),
              "K2": ("KHH", "PUS", "2026-10-13", "2026-10-17"),
              "C1": ("TSA", "SHA", "2026-10-13", "2026-10-17"),
              "C2": ("TPE", "XMN", "2026-10-13", "2026-10-17"),
              "S1": ("TPE", "SGN", "2026-10-13", "2026-10-17"),
              "L1": ("TPE", "LAX", "2026-10-13", "2026-10-23"),
          }
          J5_LEGS = {
              "J5A": ("TPE", "NRT", "2026-10-13"),
              "J5B": ("KIX", "TPE", "2026-10-18"),
          }

          def query_round_trip(expected):
              origin, destination, out_date, back_date = expected
              args = [
                  "flyai", "search-flight",
                  "--origin", origin,
                  "--destination", destination,
                  "--dep-date", out_date,
                  "--back-date", back_date,
                  "--seat-class-name", "economy",
                  "--sort-type", "3",
              ]
              return run(args)

          def query_one_way(expected):
              origin, destination, out_date = expected
              args = [
                  "flyai", "search-flight",
                  "--origin", origin,
                  "--destination", destination,
                  "--dep-date", out_date,
                  "--seat-class-name", "economy",
                  "--sort-type", "3",
              ]
              return run(args)

          def run(args):
              try:
                  proc = subprocess.run(args, capture_output=True, text=True, timeout=120)
                  stdout = proc.stdout or ""
                  stderr = proc.stderr or ""
                  code = proc.returncode
              except subprocess.TimeoutExpired as exc:
                  stdout = exc.stdout or ""
                  stderr = (exc.stderr or "") + "\nTIMEOUT"
                  code = 124
              try:
                  payload = json.loads(stdout) if stdout.strip() else {}
              except json.JSONDecodeError:
                  payload = {}
              return code, payload, stderr[-1000:]

          def items(payload):
              return (((payload or {}).get("data") or {}).get("itemList") or [])

          def journeys(item):
              return item.get("journeys") or []

          def exact_round_trip(item, expected):
              origin, destination, out_date, back_date = expected
              js = journeys(item)
              if len(js) < 2:
                  return False
              outbound = js[0].get("segments") or []
              inbound = js[1].get("segments") or []
              if not outbound or not inbound:
                  return False
              return (
                  outbound[0].get("depStationCode") == origin
                  and outbound[-1].get("arrStationCode") == destination
                  and (outbound[0].get("depDateTime") or "")[:10] == out_date
                  and inbound[0].get("depStationCode") == destination
                  and inbound[-1].get("arrStationCode") == origin
                  and (inbound[0].get("depDateTime") or "")[:10] == back_date
              )

          def exact_one_way(item, expected):
              origin, destination, out_date = expected
              js = journeys(item)
              if not js:
                  return False
              outbound = js[0].get("segments") or []
              if not outbound:
                  return False
              return (
                  outbound[0].get("depStationCode") == origin
                  and outbound[-1].get("arrStationCode") == destination
                  and (outbound[0].get("depDateTime") or "")[:10] == out_date
              )

          def signature(item):
              return tuple(
                  tuple(
                      (
                          seg.get("depStationCode"),
                          seg.get("arrStationCode"),
                          seg.get("depDateTime"),
                          seg.get("marketingTransportNo"),
                      )
                      for seg in (journey.get("segments") or [])
                  )
                  for journey in journeys(item)
              )

          def price_number(item):
              try:
                  return float(item.get("ticketPrice"))
              except (TypeError, ValueError):
                  return None

          def semantic_paths(value, path=""):
              found = {"currency": set(), "tax": set(), "baggage": set(), "fare": set()}
              if isinstance(value, dict):
                  for key, child in value.items():
                      p = f"{path}.{key}" if path else str(key)
                      low = str(key).lower()
                      for token in found:
                          if token in low:
                              found[token].add(p)
                      nested = semantic_paths(child, p)
                      for token in found:
                          found[token].update(nested[token])
              elif isinstance(value, list):
                  for idx, child in enumerate(value[:20]):
                      nested = semantic_paths(child, f"{path}[{idx}]")
                      for token in found:
                          found[token].update(nested[token])
              return found

          def carriers(exact_items):
              names = set()
              numbers = set()
              for item in exact_items:
                  for journey in journeys(item):
                      for seg in journey.get("segments") or []:
                          if seg.get("marketingTransportName"):
                              names.add(str(seg.get("marketingTransportName")))
                          if seg.get("marketingTransportNo"):
                              numbers.add(str(seg.get("marketingTransportNo")))
              return sorted(names), sorted(numbers)

          observed_at = datetime.now(ZoneInfo("Asia/Taipei")).isoformat()
          case_results = {}
          total_items = 0
          total_exact = 0
          cases_exact = 0
          cases_substitution = 0
          repeat_provider_ok = 0
          repeat_attempts = 0
          repeat_same_itinerary = 0
          repeat_same_price = 0
          all_carriers = set()
          semantic_union = {"currency": set(), "tax": set(), "baggage": set(), "fare": set()}

          for case_id, expected in CASES.items():
              code1, first, err1 = query_round_trip(expected)
              code2, second, err2 = query_round_trip(expected)
              first_items = items(first)
              second_items = items(second)
              exact1 = [item for item in first_items if exact_round_trip(item, expected)]
              exact2 = [item for item in second_items if exact_round_trip(item, expected)]
              numeric = [item for item in exact1 if price_number(item) is not None]
              selected = min(numeric, key=price_number) if numeric else (exact1[0] if exact1 else None)
              matched = None
              if selected:
                  repeat_attempts += 1
                  selected_sig = signature(selected)
                  matched = next((item for item in exact2 if signature(item) == selected_sig), None)
                  if matched:
                      repeat_same_itinerary += 1
                      if matched.get("ticketPrice") == selected.get("ticketPrice"):
                          repeat_same_price += 1
              if code2 == 0 and second.get("status") == 0:
                  repeat_provider_ok += 1

              semantic = semantic_paths(first)
              for token in semantic_union:
                  semantic_union[token].update(semantic[token])
              carrier_names, flight_numbers = carriers(exact1)
              all_carriers.update(carrier_names)

              total_items += len(first_items)
              total_exact += len(exact1)
              cases_exact += int(bool(exact1))
              cases_substitution += int(bool(first_items) and len(exact1) < len(first_items))

              case_results[case_id] = {
                  "requested": {
                      "origin": expected[0], "destination": expected[1],
                      "out_date": expected[2], "back_date": expected[3],
                  },
                  "first_command_exit": code1,
                  "first_provider_status": first.get("status"),
                  "first_provider_message": first.get("message"),
                  "first_item_count": len(first_items),
                  "first_exact_item_count": len(exact1),
                  "has_exact_result": bool(exact1),
                  "airport_substitution_items": len(first_items) - len(exact1),
                  "min_exact_ticketPrice": selected.get("ticketPrice") if selected else None,
                  "exact_carriers": carrier_names,
                  "exact_flight_numbers": flight_numbers,
                  "semantic_key_paths": {k: sorted(v)[:40] for k, v in semantic.items()},
                  "repeat_command_exit": code2,
                  "repeat_provider_status": second.get("status"),
                  "repeat_exact_item_count": len(exact2),
                  "same_selected_itinerary_in_repeat": matched is not None,
                  "repeat_ticketPrice": matched.get("ticketPrice") if matched else None,
                  "same_ticketPrice": bool(matched and matched.get("ticketPrice") == selected.get("ticketPrice")),
                  "stderr_tail_first": err1,
                  "stderr_tail_repeat": err2,
              }

          j5_results = {}
          for case_id, expected in J5_LEGS.items():
              code, payload, err = query_one_way(expected)
              returned = items(payload)
              exact_returned = [item for item in returned if exact_one_way(item, expected)]
              j5_results[case_id] = {
                  "requested": {"origin": expected[0], "destination": expected[1], "out_date": expected[2]},
                  "command_exit": code,
                  "provider_status": payload.get("status"),
                  "item_count": len(returned),
                  "exact_item_count": len(exact_returned),
                  "has_exact_result": bool(exact_returned),
                  "stderr_tail": err,
              }

          aggregate = {
              "provider": "FlyAI search-flight",
              "cli_version_pinned": "@fly-ai/flyai-cli@1.0.16",
              "credential_mode": "formal_api_key",
              "observed_at_asia_taipei": observed_at,
              "round_trip_cases_attempted": len(CASES),
              "round_trip_cases_with_exact_result": cases_exact,
              "exact_case_coverage": cases_exact / len(CASES),
              "returned_items": total_items,
              "exact_returned_items": total_exact,
              "exact_returned_item_rate": total_exact / total_items if total_items else None,
              "airport_integrity_reject_items": total_items - total_exact,
              "airport_integrity_reject_rate": (total_items - total_exact) / total_items if total_items else None,
              "cases_with_any_airport_substitution": cases_substitution,
              "exact_carrier_names": sorted(all_carriers),
              "semantic_key_paths": {k: sorted(v)[:100] for k, v in semantic_union.items()},
              "repeat_query_provider_success": repeat_provider_ok,
              "repeat_query_provider_success_rate": repeat_provider_ok / len(CASES),
              "selected_itinerary_repeat_attempts": repeat_attempts,
              "same_selected_itinerary_in_repeat": repeat_same_itinerary,
              "same_selected_itinerary_rate": repeat_same_itinerary / repeat_attempts if repeat_attempts else None,
              "same_itinerary_and_ticketPrice": repeat_same_price,
              "same_itinerary_and_ticketPrice_rate": repeat_same_price / repeat_attempts if repeat_attempts else None,
              "true_revalidation_success": None,
              "staleness_rate": None,
              "lcc_miss_rate": None,
              "lowest_verifiable_fare_hit_rate": None,
              "cross_source_price_gap": None,
              "j5_structured_open_jaw_combined_query": "unsupported_by_tested_search-flight_cli_schema; legs measured separately and not combined as a fare",
              "j5_leg_results": j5_results,
              "keyless_checkpoint_reference": {
                  "exact_case_coverage": 1.0,
                  "returned_items": 89,
                  "exact_returned_items": 81,
                  "airport_integrity_reject_rate": 8 / 89,
                  "repeat_same_selected_itinerary_rate": 0.9,
                  "repeat_same_itinerary_and_ticketPrice_rate": 0.9,
              },
              "limitations": [
                  "Repeat query is a stability proxy, not provider offer refresh or checkout revalidation.",
                  "LCC miss rate needs an independent exact-date reference inventory denominator.",
                  "Lowest-verifiable fare hit rate and cross-source price gap need a comparable independent exact provider or final purchase-surface observation.",
                  "No missing currency/tax/baggage/fare semantics are inferred; semantic_key_paths only records keys actually present.",
              ],
          }

          evidence = {"aggregate": aggregate, "cases": case_results}
          (OUT / "formal-key-summary.json").write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(aggregate, ensure_ascii=False, indent=2))

      - name: Upload formal-key evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyai-formal-key-fixed-basket
          path: research-output/
          if-no-files-found: error
