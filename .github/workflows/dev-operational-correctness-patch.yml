name: One-shot operational correctness cleanup

on:
  push:
    branches:
      - fix/operator-same-day-reacquisition-20260815
    paths:
      - ".github/workflows/dev-operational-correctness-patch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operator PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/operator-same-day-reacquisition-20260815
          fetch-depth: 0

      - name: Remove generated files and one-shot scaffold
        shell: bash
        run: |
          git rm -r --ignore-unmatch src/cheap_flight_radar.egg-info
          find src tests -type d -name __pycache__ -print0 | xargs -0 -r git rm -r --ignore-unmatch
          git rm --ignore-unmatch scripts/dev_operational_correctness_patch.py
          git rm --ignore-unmatch .github/workflows/dev-operational-correctness-patch.yml

      - name: Commit clean PR head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove operational correctness patch scaffold"
          git push origin HEAD:fix/operator-same-day-reacquisition-20260815
