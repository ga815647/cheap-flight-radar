name: SearchAPI China Decision Research

on:
  push:
    branches:
      - research/searchapi-china-decision-2026-08-10

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify SearchAPI key presence
        shell: bash
        run: |
          test -n "$SEARCHAPI_API_KEY"
          echo "SEARCHAPI_API_KEY is present; value will not be printed"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused China reference
        id: research
        continue-on-error: true
        run: python scripts/searchapi_china_decision.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: searchapi-china-decision
          path: research-output/
          if-no-files-found: error
      - name: Fail if research failed
        if: steps.research.outcome != 'success'
        run: exit 1
