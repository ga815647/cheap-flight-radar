name: Temporary Production Radar Live Validation

on:
  push:
    branches:
      - chatdev/gflights-production-radar-20260813
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Checkout optional immutable history
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: history/price-observations
          path: _history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Gate
        run: python -m unittest discover -s tests -v

      - name: Run one production Radar acquisition
        shell: bash
        run: |
          set -euo pipefail
          history_args=()
          if [[ -d _history/data/price-history ]]; then
            history_args=(--history-dir _history)
          fi
          python -m cheap_flight_radar.production_radar \
            --policy flight-radar.yaml \
            "${history_args[@]}" \
            --output-dir live-run

      - name: Print durable live summary
        run: cat live-run/run-result.json

      - name: Smoke-build schema-v2 publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-history
          if [[ -d _history/data ]]; then
            cp -a _history/data live-history/
          fi
          mkdir -p live-history/data
          cp -a live-run/history/data/. live-history/data/
          python -m cheap_flight_radar.production_publication \
            --policy flight-radar.yaml \
            --history-dir live-history \
            --manifest-dir live-run/publication/runs \
            --site-dir live-site
          test -s live-site/latest/index.html

      - name: Upload live validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-radar-live
          path: |
            live-run
            live-site
