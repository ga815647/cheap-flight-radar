name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

  production-soak:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout immutable fare evidence
        uses: actions/checkout@v4
        with:
          ref: history/price-observations
          path: _history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run canonical production Radar
        run: >-
          python -m cheap_flight_radar.production_runtime
          --history-dir _history
          --output-dir _out

      - name: Upload production soak artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-soak-429-20260814
          path: _out
          if-no-files-found: error
