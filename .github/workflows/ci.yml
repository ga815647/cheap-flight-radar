name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

  dispatch-radar-pages:
    if: github.event_name == 'pull_request' && github.head_ref == 'chatdev/production-publication-run-20260813'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh Radar Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run radar-pages.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
