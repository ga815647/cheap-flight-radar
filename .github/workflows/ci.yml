name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

  live-recall-validation:
    if: github.event_name == 'pull_request' && github.head_ref == 'chatdev/destination-airport-anomaly-20260813'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run fresh production Radar
        run: |
          rm -rf live-output
          python -m cheap_flight_radar.production_runtime --output-dir live-output

      - name: Validate Issue 26 live execution evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('live-output/run-result.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          coverage = payload['coverage']
          execution = coverage['execution']
          origins = coverage['origins']
          required_origins = {'TPE', 'TSA', 'RMQ', 'KHH'}
          assert set(origins) == required_origins, origins
          assert coverage['all_origins_attempted'] is True
          assert execution['flight_deals']['attempts'] >= 12, execution['flight_deals']
          assert execution['explore']['attempts'] >= 4, execution['explore']
          assert execution['flexible_dates']['attempts'] > 0, execution['flexible_dates']
          assert execution['mixed_taiwan_return']['attempts'] > 0, execution['mixed_taiwan_return']
          assert execution['open_jaw']['attempts'] > 0, execution['open_jaw']
          assert coverage['deep_search_candidate_limit'] == 20
          assert coverage['final_shortlist_limit'] == 10
          assert coverage['final_shortlist_applied_after_deep_search'] is True
          assert coverage['expansion_seed_count'] > coverage['final_shortlist_limit'], coverage
          assert coverage['anomaly_normalization'] == 'exact_destination_airport_across_tpe_tsa_rmq_khh'
          summary = {
              'radar_run_id': payload['radar_run_id'],
              'all_four_origins_swept': True,
              'deep_search_candidate_limit': coverage['deep_search_candidate_limit'],
              'final_shortlist_limit': coverage['final_shortlist_limit'],
              'expansion_seed_count': coverage['expansion_seed_count'],
              'flight_deals': execution['flight_deals'],
              'explore': execution['explore'],
              'conventional_exact': execution['conventional_exact'],
              'flexible_dates': execution['flexible_dates'],
              'mixed_taiwan_return': execution['mixed_taiwan_return'],
              'open_jaw': execution['open_jaw'],
              'cju_regression_semantics': coverage['anomaly_normalization'],
              'live_validation': 'passed',
          }
          Path('live-output/issue-26-live-validation.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Capture CJU regression fixture evidence
        run: |
          python -m unittest discover -s tests -p 'test_production_radar.py' -v 2>&1 | tee live-output/cju-regression-fixture.log
          grep -q 'test_same_destination_uses_cheapest_origin_and_lowest_typical_baseline' live-output/cju-regression-fixture.log

      - name: Upload live evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-live-recall-${{ github.event.pull_request.head.sha }}
          path: live-output/
          if-no-files-found: error
