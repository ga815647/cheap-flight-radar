name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

  production-radar-live:
    if: github.event_name == 'pull_request' && github.head_ref == 'chatdev/production-publication-run-20260813'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source

      - name: Checkout immutable history evidence
        uses: actions/checkout@v4
        with:
          ref: history/price-observations
          path: history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production runtime
        working-directory: source
        run: python -m pip install -e .

      - name: Run canonical production Radar
        working-directory: source
        run: >-
          python -m cheap_flight_radar.production_runtime
          --history-dir ../history/data/price-history
          --output-dir artifacts/production-radar

      - name: Upload production Radar artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-radar-${{ github.event.pull_request.head.sha }}
          path: source/artifacts/production-radar
          if-no-files-found: error
          retention-days: 14
