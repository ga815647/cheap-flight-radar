name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply destination-airport normalization patch
        if: github.event_name == 'pull_request' && github.head_ref == 'chatdev/destination-airport-anomaly-20260813'
        run: |
          python scripts/apply_destination_airport_normalization.py
          git checkout origin/main -- .github/workflows/ci.yml
          rm scripts/apply_destination_airport_normalization.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PRODUCT_INTENT.md flight-radar.yaml docs src tests .github/workflows/ci.yml scripts
          git commit -m "Normalize anomaly truth by destination airport"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v
