name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Export exact source for local Gate bridge
        uses: actions/upload-artifact@v4
        with:
          name: rp06-exact-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

      - name: Stage offline Gate dependencies
        run: python -m pip download --dest /tmp/rp06-wheelhouse scrapy parsel

      - name: Export offline Gate dependencies
        uses: actions/upload-artifact@v4
        with:
          name: rp06-offline-wheelhouse
          path: /tmp/rp06-wheelhouse
          retention-days: 1
