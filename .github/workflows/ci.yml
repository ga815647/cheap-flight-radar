name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

  sr_b_live:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/cfr-sr-b-gflights-qualification'
    strategy:
      fail-fast: false
      matrix:
        gflights_version: ["0.3.0", "0.3.1"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CFR and selected gflights
        run: |
          python -m pip install -e .
          python -m pip install --force-reinstall "gflights==${{ matrix.gflights_version }}"
      - name: Verify selected version
        run: python -c "from importlib.metadata import version; assert version('gflights') == '${{ matrix.gflights_version }}'"
      - name: Run bounded fixed-basket live probe
        run: python scripts/sr_b_gflights_live_probe.py
