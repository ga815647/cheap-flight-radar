name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v

  sr_d_safe_fli:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/cfr-sr-d-safe-fli'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fli candidate
        run: python -m pip install "flights==0.9.0" click
      - name: Run single-attempt no-impersonation qualification
        run: python scripts/sr_d_safe_fli_probe.py
