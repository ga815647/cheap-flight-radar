name: RP-02 transient trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-gate:
    if: github.head_ref == 'feat/rp02-ftr-absolute-low-producer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RP-02 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e .

      - name: Apply RP-02 final review fixes
        run: python scripts/rp02_review_fix.py

      - name: Full deterministic Gate
        run: python -m unittest discover -s tests -v

      - name: Commit only tested RP-02 product changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flight-radar.yaml docs/ftr-handoff.md \
            src/cheap_flight_radar/production_radar.py \
            src/cheap_flight_radar/production_runtime.py \
            src/cheap_flight_radar/ftr_handoff.py \
            src/cheap_flight_radar/ftr_absolute_low.py \
            tests/test_ftr_handoff.py tests/test_ftr_absolute_low.py
          git commit -m 'RP-02: harden selector contract and deterministic ties'
          git push origin HEAD:feat/rp02-ftr-absolute-low-producer
