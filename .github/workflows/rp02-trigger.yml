name: RP-02 transient trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-gate:
    if: github.head_ref == 'feat/rp02-ftr-absolute-low-producer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RP-02 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install -e .

      - name: Extract and run RP-02 implementation payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/rp02-bootstrap.yml').read_text(encoding='utf-8')
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          body = text[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/rp02_apply.py').write_text(body, encoding='utf-8')
          PY
          python /tmp/rp02_apply.py

      - name: Remove transient workflows from final branch diff
        run: rm .github/workflows/rp02-bootstrap.yml .github/workflows/rp02-trigger.yml

      - name: Full deterministic Gate
        run: python -m unittest discover -s tests -v

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RP-02: add bounded FTR absolute-low non-Deal producer'
          git push origin HEAD:feat/rp02-ftr-absolute-low-producer
