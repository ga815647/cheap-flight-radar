name: FlyAI Keyless Research

on:
  push:
    branches:
      - research/flyai-keyless-validation-2026-08-10

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare output
        run: mkdir -p research-output

      - name: Install official FlyAI CLI
        id: install
        continue-on-error: true
        run: npm install -g @fly-ai/flyai-cli@1.0.16

      - name: Record CLI help
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          flyai --help > research-output/help.txt 2> research-output/help.err
          flyai search-flight --help > research-output/search-flight-help.txt 2> research-output/search-flight-help.err

      - name: Run fixed basket and immediate revalidation
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          OUT = Path("research-output")
          CASES = {
              "J1": ("TPE", "NRT", "2026-10-13", "2026-10-17"),
              "J2": ("TSA", "HND", "2026-10-13", "2026-10-18"),
              "J3": ("RMQ", "KIX", "2026-10-13", "2026-10-17"),
              "J4": ("KHH", "FUK", "2026-10-13", "2026-10-17"),
              "K1": ("TPE", "ICN", "2026-10-13", "2026-10-17"),
              "K2": ("KHH", "PUS", "2026-10-13", "2026-10-17"),
              "C1": ("TSA", "SHA", "2026-10-13", "2026-10-17"),
              "C2": ("TPE", "XMN", "2026-10-13", "2026-10-17"),
              "S1": ("TPE", "SGN", "2026-10-13", "2026-10-17"),
              "L1": ("TPE", "LAX", "2026-10-13", "2026-10-23"),
          }
          J5_LEGS = {
              "J5A": ("TPE", "NRT", "2026-10-13"),
              "J5B": ("KIX", "TPE", "2026-10-18"),
          }

          def run_cli(name, args):
              try:
                  proc = subprocess.run(
                      ["flyai", *args], capture_output=True, text=True, timeout=120
                  )
                  code = proc.returncode
                  stdout = proc.stdout
                  stderr = proc.stderr
              except subprocess.TimeoutExpired as exc:
                  code = 124
                  stdout = exc.stdout or ""
                  stderr = (exc.stderr or "") + "\nTIMEOUT"
              (OUT / f"{name}.json").write_text(stdout)
              (OUT / f"{name}.err").write_text(stderr)
              (OUT / f"{name}.status").write_text(str(code))
              return code, stdout, stderr

          def parse_payload(text):
              if not text.strip():
                  return None
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  return None

          def segments(item):
              return [j.get("segments") or [] for j in (item.get("journeys") or [])]

          def exact_round_trip(item, expected):
              origin, destination, out_date, back_date = expected
              js = segments(item)
              if len(js) < 2 or not js[0] or not js[1]:
                  return False
              outbound, inbound = js[0], js[1]
              return (
                  outbound[0].get("depStationCode") == origin
                  and outbound[-1].get("arrStationCode") == destination
                  and (outbound[0].get("depDateTime") or "")[:10] == out_date
                  and inbound[0].get("depStationCode") == destination
                  and inbound[-1].get("arrStationCode") == origin
                  and (inbound[0].get("depDateTime") or "")[:10] == back_date
              )

          def exact_one_way(item, expected):
              origin, destination, out_date = expected
              js = segments(item)
              if not js or not js[0]:
                  return False
              outbound = js[0]
              return (
                  outbound[0].get("depStationCode") == origin
                  and outbound[-1].get("arrStationCode") == destination
                  and (outbound[0].get("depDateTime") or "")[:10] == out_date
              )

          def signature(item):
              sig = []
              for journey in item.get("journeys") or []:
                  jsig = []
                  for seg in journey.get("segments") or []:
                      jsig.append((
                          seg.get("depStationCode"),
                          seg.get("arrStationCode"),
                          seg.get("depDateTime"),
                          seg.get("marketingTransportNo"),
                      ))
                  sig.append(tuple(jsig))
              return tuple(sig)

          def price_number(item):
              value = item.get("ticketPrice")
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def normalize_item(item, exact):
              return {
                  "exact_airport_date": exact,
                  "ticketPrice": item.get("ticketPrice"),
                  "has_currency_field": any("currency" in str(k).lower() for k in item.keys()),
                  "tags": item.get("tags"),
                  "journeys": [
                      {
                          "journeyType": journey.get("journeyType"),
                          "segments": [
                              {
                                  "depStationCode": seg.get("depStationCode"),
                                  "arrStationCode": seg.get("arrStationCode"),
                                  "depDateTime": seg.get("depDateTime"),
                                  "arrDateTime": seg.get("arrDateTime"),
                                  "marketingTransportName": seg.get("marketingTransportName"),
                                  "marketingTransportNo": seg.get("marketingTransportNo"),
                                  "seatClassName": seg.get("seatClassName"),
                              }
                              for seg in journey.get("segments") or []
                          ],
                      }
                      for journey in item.get("journeys") or []
                  ],
              }

          summaries = {}
          revalidation_attempts = 0
          revalidation_successes = 0
          stale_selected = 0

          for case_id, expected in CASES.items():
              origin, destination, out_date, back_date = expected
              args = [
                  "search-flight",
                  "--origin", origin,
                  "--destination", destination,
                  "--dep-date", out_date,
                  "--back-date", back_date,
                  "--seat-class-name", "economy",
                  "--sort-type", "3",
              ]
              code, stdout, _ = run_cli(case_id, args)
              payload = parse_payload(stdout)
              items = (((payload or {}).get("data") or {}).get("itemList") or [])
              normalized = [normalize_item(item, exact_round_trip(item, expected)) for item in items]
              exact_items = [item for item in items if exact_round_trip(item, expected)]
              numeric_exact = [item for item in exact_items if price_number(item) is not None]
              selected = min(numeric_exact, key=price_number) if numeric_exact else (exact_items[0] if exact_items else None)
              entry = {
                  "requested": {"origin": origin, "destination": destination, "out_date": out_date, "back_date": back_date},
                  "command_exit": code,
                  "provider_status": (payload or {}).get("status"),
                  "provider_message": (payload or {}).get("message"),
                  "systemMessage": (payload or {}).get("systemMessage"),
                  "item_count": len(items),
                  "exact_item_count": len(exact_items),
                  "has_exact_result": bool(exact_items),
                  "min_exact_ticketPrice": selected.get("ticketPrice") if selected else None,
                  "result_has_explicit_currency": any(x["has_currency_field"] for x in normalized),
                  "normalized_items": normalized,
                  "revalidation": None,
              }

              if selected:
                  flight_numbers = [
                      seg.get("marketingTransportNo")
                      for journey in selected.get("journeys") or []
                      for seg in journey.get("segments") or []
                      if seg.get("marketingTransportNo")
                  ]
                  reval_args = list(args)
                  if flight_numbers:
                      reval_args += ["--transport-no", ",".join(flight_numbers)]
                  revalidation_attempts += 1
                  rcode, rstdout, _ = run_cli(f"{case_id}-revalidation", reval_args)
                  rpayload = parse_payload(rstdout)
                  ritems = (((rpayload or {}).get("data") or {}).get("itemList") or [])
                  selected_sig = signature(selected)
                  same = [item for item in ritems if signature(item) == selected_sig and exact_round_trip(item, expected)]
                  matched = same[0] if same else None
                  success = matched is not None
                  if success:
                      revalidation_successes += 1
                  selected_price = selected.get("ticketPrice")
                  reval_price = matched.get("ticketPrice") if matched else None
                  price_changed = success and selected_price != reval_price
                  stale = (not success) or price_changed
                  if stale:
                      stale_selected += 1
                  entry["revalidation"] = {
                      "command_exit": rcode,
                      "provider_status": (rpayload or {}).get("status"),
                      "same_itinerary_found": success,
                      "original_ticketPrice": selected_price,
                      "revalidated_ticketPrice": reval_price,
                      "price_changed": bool(price_changed),
                      "stale_by_immediate_requery": bool(stale),
                      "flight_numbers_filter": flight_numbers,
                  }
              summaries[case_id] = entry

          leg_summaries = {}
          for case_id, expected in J5_LEGS.items():
              origin, destination, out_date = expected
              args = [
                  "search-flight",
                  "--origin", origin,
                  "--destination", destination,
                  "--dep-date", out_date,
                  "--seat-class-name", "economy",
                  "--sort-type", "3",
              ]
              code, stdout, _ = run_cli(case_id, args)
              payload = parse_payload(stdout)
              items = (((payload or {}).get("data") or {}).get("itemList") or [])
              exact_items = [item for item in items if exact_one_way(item, expected)]
              leg_summaries[case_id] = {
                  "requested": {"origin": origin, "destination": destination, "out_date": out_date},
                  "command_exit": code,
                  "provider_status": (payload or {}).get("status"),
                  "item_count": len(items),
                  "exact_item_count": len(exact_items),
                  "has_exact_result": bool(exact_items),
              }

          aggregate = {
              "provider": "FlyAI search-flight",
              "cli_version_pinned": "@fly-ai/flyai-cli@1.0.16",
              "credential_mode": "keyless_trial",
              "round_trip_cases_attempted": len(CASES),
              "round_trip_cases_with_exact_result": sum(1 for x in summaries.values() if x["has_exact_result"]),
              "exact_case_coverage": sum(1 for x in summaries.values() if x["has_exact_result"]) / len(CASES),
              "cases_with_any_airport_substitution_in_returned_items": sum(
                  1 for x in summaries.values() if x["item_count"] and x["exact_item_count"] < x["item_count"]
              ),
              "revalidation_attempts": revalidation_attempts,
              "revalidation_successes": revalidation_successes,
              "revalidation_success_rate": (revalidation_successes / revalidation_attempts) if revalidation_attempts else None,
              "stale_selected_count_immediate_requery": stale_selected,
              "stale_selected_rate_immediate_requery": (stale_selected / revalidation_attempts) if revalidation_attempts else None,
              "explicit_currency_present_in_results": any(x["result_has_explicit_currency"] for x in summaries.values()),
              "j5_structured_open_jaw_combined_query": "unsupported_by_search-flight_cli_schema; two one-way legs probed separately and must not be treated as one open-jaw fare",
              "j5_leg_results": leg_summaries,
          }
          output = {"aggregate": aggregate, "cases": summaries}
          (OUT / "summary.json").write_text(json.dumps(output, ensure_ascii=False, indent=2))
          print(json.dumps(aggregate, ensure_ascii=False, indent=2))

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyai-keyless-fixed-basket
          path: research-output/
          if-no-files-found: warn
