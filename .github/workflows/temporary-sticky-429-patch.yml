name: Temporary sticky-429 patch runner

on:
  push:
    branches:
      - fix/sticky-429-circuit-evidence-20260819
    paths:
      - scripts/temporary_sticky_429_patch.py

permissions:
  contents: write

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sticky-429-circuit-evidence-20260819
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic patch
        run: python scripts/temporary_sticky_429_patch.py
      - name: Install
        run: python -m pip install -e .
      - name: Full Gate
        run: python -m unittest discover -s tests -v
      - name: Commit durable package only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            flight-radar.yaml \
            docs/production-sticky-429-circuit-2026-08-19.md \
            src/cheap_flight_radar/airfare.py \
            src/cheap_flight_radar/operational_status.py \
            src/cheap_flight_radar/production_publication.py \
            src/cheap_flight_radar/production_radar.py \
            src/cheap_flight_radar/production_runtime.py \
            tests/test_operational_correctness.py \
            tests/test_production_publication.py \
            tests/test_production_runtime.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No durable changes to commit"
            exit 1
          fi
          git commit -m "Harden sticky 429 circuit accounting"
          git push origin HEAD:fix/sticky-429-circuit-evidence-20260819
