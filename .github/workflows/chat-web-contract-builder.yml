name: Chat Web Contract Builder

on:
  push:
    branches:
      - work/chat-web-execution-contract-20260821

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/chat-web-execution-contract-20260821
          fetch-depth: 0

      - name: Apply bounded contract patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy_path = Path('flight-radar.yaml')
          text = policy_path.read_text(encoding='utf-8')
          anchor = '''source_routing:\n  status: provider_execution_truth_converged_v4\n  strict_no_silent_degradation: true\n  route_plan_execution_contract:\n'''
          replacement = '''source_routing:\n  status: provider_execution_truth_converged_v4\n  strict_no_silent_degradation: true\n  execution_planes:\n    machine_backend:\n      definition: current_CFR_runtime_can_invoke_provider_deterministically\n      route_plan_authority: source_routing.selected_routes\n      provider_registry_authority: source_routing.providers\n      provider_search_coverage_authority: true\n      coverage_requires_actual_execution_evidence: true\n    chat_web_consumer_surface:\n      definition: Chat_directly_observes_public_consumer_travel_Web_surfaces\n      policy_authority: source_routing.chat_web_execution_contract\n      provider_search_coverage_authority: false\n      machine_backend_coverage_authority: false\n  chat_web_execution_contract:\n    status: active_v1\n    provider_abstraction: consumer_travel_web_surface\n    execution_plane: external_chatgpt_web_direct\n    backend_integration_state: external_not_backend_integrated\n    example_membership_is_not_backend_qualification: true\n    roles:\n      opportunistic_discovery:\n        allowed: true\n        evidence_may_establish:\n        - Signal\n        - destination_or_route_seed\n        - observed_public_fare_hint\n        exact_fare_truth_without_revalidation: false\n      exact_fare_itinerary_verification:\n        allowed: true\n        trigger: serious_candidate_or_explicit_scoped_query\n        requires:\n        - public_reproducible_surface\n        - exact_origin_and_destination_airports\n        - exact_travel_dates\n        - identifiable_itinerary\n        - current_complete_airfare\n        - trusted_seller_or_metasearch_with_trusted_final_seller\n        may_establish:\n        - exact_current_fare_evidence\n        - exact_itinerary_evidence\n        formal_deal_truth_role: conditional_input_to_existing_CFR_verification_and_anomaly_gates\n        exact_absolute_low_truth_role: conditional_input_to_existing_exact_revalidated_candidate_gate\n      incomplete_or_lagged_observation:\n        evidence_class: Signal\n        formal_deal_eligible: false\n        exact_absolute_low_eligible: false\n      restricted_or_inaccessible_surface:\n        evidence_class: typed_access_blind_spot_when_surface_class_known\n        registry_authority: access_blind_spots\n        hidden_price_inference: forbidden\n    provider_classes:\n      consumer_ota_web:\n        allowed_roles:\n        - opportunistic_discovery\n        - exact_fare_itinerary_verification\n        qualified_examples:\n          trip_com:\n            display_name: Trip.com\n            disposition: seed_or_verification_only_under_current_access\n            evidence: docs/scoped-native-window-bakeoff-2026-08-21.md\n          expedia:\n            display_name: Expedia\n            disposition: seed_or_verification_only_under_current_access\n            evidence: docs/scoped-native-window-bakeoff-2026-08-21.md\n      consumer_metasearch_web:\n        allowed_roles:\n        - opportunistic_discovery\n        - exact_fare_itinerary_verification\n        qualified_examples:\n          skyscanner:\n            display_name: Skyscanner\n            disposition: seed_or_verification_only_under_current_access\n            evidence: docs/scoped-native-window-bakeoff-2026-08-21.md\n          kiwi_consumer_web:\n            display_name: Kiwi.com_consumer_Web\n            disposition: seed_or_verification_only_under_current_access\n            evidence: docs/scoped-native-window-bakeoff-2026-08-21.md\n      airline_public_sales_web:\n        allowed_roles:\n        - opportunistic_discovery\n        - exact_fare_itinerary_verification\n        qualified_examples:\n          airline_official_booking_surface:\n            display_name: public_airline_booking_surface\n            disposition: trusted_seller_surface_subject_to_exact_reproduction\n            evidence: PRODUCT_INTENT.md\n    evidence_requirements:\n      retain:\n      - provider_class\n      - surface_or_source_identity\n      - observed_at\n      - query_or_candidate_scope\n      - evidence_role\n      - access_state\n      unknown_fields_remain_unknown: true\n      cached_or_indexed_price_is_exact_truth: false\n    coverage_semantics:\n      exhaustive_web_coverage_claim: forbidden\n      machine_backend_coverage_from_web_browsing: forbidden\n      canonical_provider_health_from_web_browsing: forbidden\n      successful_web_observation_scope: observed_surface_or_candidate_only\n      web_attempt_may_be_recorded_as_provenance: true\n      web_attempt_satisfies_required_provider_search_slice: false\n      no_usable_observation: no_observation_not_no_fare\n      inaccessible_or_restricted: access_unknown_not_fare_absence\n      unqueried_surface: not_attempted\n      scoped_window_success_without_actual_window_query: forbidden\n      may_supplement_backend_recall_without_changing_backend_coverage: true\n    access_constraints:\n      public_without_login_required: true\n      login_or_member_session: forbidden\n      session_reuse_or_rotation: forbidden\n      captcha_bypass: forbidden\n      anti_bot_evasion: forbidden\n      browser_automation_subsystem: forbidden\n      crawler_subsystem: forbidden\n    routing_invariants:\n      machine_destination_free_primary: gflights_google_flight_deals\n      machine_known_route_primary: gflights_google_exact\n      machine_known_route_fallback: kiwi_mcp_exact\n      web_surface_never_becomes_automatic_fallback_by_observation: true\n      current_geography_unchanged: true\n      ftr_handoff_semantics_unchanged: true\n  route_plan_execution_contract:\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one source_routing anchor, got {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          role_anchor = '''    chatgpt_web_public_fare_index:\n      selected_roles:\n      - origin_wide_fallback\n      - post_seed_known_route_probe\n      execution: chatgpt_web_direct\n'''
          role_replacement = '''    chatgpt_web_public_fare_index:\n      selected_roles:\n      - opportunistic_origin_wide_discovery\n      - candidate_triggered_exact_fare_verification\n      execution: chatgpt_web_direct\n'''
          if text.count(role_anchor) != 1:
              raise SystemExit(f'expected one Chat Web provider-role anchor, got {text.count(role_anchor)}')
          text = text.replace(role_anchor, role_replacement, 1)
          policy_path.write_text(text, encoding='utf-8')

          agents_path = Path('AGENTS.md')
          agents = agents_path.read_text(encoding='utf-8')
          agents_anchor = '- `docs/*.md` explains reasoning, evidence, and edge cases behind current policy.\n'
          agents_replacement = (
              '- Chat/Web consumer travel-surface execution policy is owned by '
              '`flight-radar.yaml` under `source_routing.chat_web_execution_contract`; '
              'this file only points to that authority.\n'
              + agents_anchor
          )
          if agents.count(agents_anchor) != 1:
              raise SystemExit(f'expected one AGENTS authority anchor, got {agents.count(agents_anchor)}')
          agents_path.write_text(agents.replace(agents_anchor, agents_replacement, 1), encoding='utf-8')

          test_path = Path('tests/test_chat_web_execution_contract.py')
          test_path.write_text('''from copy import deepcopy\nfrom pathlib import Path\nimport unittest\n\nimport yaml\n\nfrom cheap_flight_radar.models import SearchRequest\nfrom cheap_flight_radar.source_router import build_source_plan\n\n\nROOT = Path(__file__).resolve().parents[1]\n\n\nclass ChatWebExecutionContractTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.policy = yaml.safe_load((ROOT / "flight-radar.yaml").read_text(encoding="utf-8"))\n        cls.routing = cls.policy["source_routing"]\n        cls.contract = cls.routing["chat_web_execution_contract"]\n\n    def test_machine_backend_and_chat_web_execution_planes_are_distinct(self):\n        planes = self.routing["execution_planes"]\n        self.assertTrue(planes["machine_backend"]["provider_search_coverage_authority"])\n        self.assertTrue(planes["machine_backend"]["coverage_requires_actual_execution_evidence"])\n        self.assertFalse(planes["chat_web_consumer_surface"]["provider_search_coverage_authority"])\n        self.assertFalse(planes["chat_web_consumer_surface"]["machine_backend_coverage_authority"])\n        self.assertEqual(self.contract["execution_plane"], "external_chatgpt_web_direct")\n        self.assertEqual(self.contract["backend_integration_state"], "external_not_backend_integrated")\n\n    def test_consumer_web_roles_separate_signal_from_exact_verification(self):\n        roles = self.contract["roles"]\n        self.assertIn("Signal", roles["opportunistic_discovery"]["evidence_may_establish"])\n        self.assertFalse(roles["opportunistic_discovery"]["exact_fare_truth_without_revalidation"])\n        exact = roles["exact_fare_itinerary_verification"]\n        self.assertTrue(exact["allowed"])\n        self.assertIn("current_complete_airfare", exact["requires"])\n        self.assertIn("trusted_seller_or_metasearch_with_trusted_final_seller", exact["requires"])\n        self.assertIn("exact_current_fare_evidence", exact["may_establish"])\n        self.assertIn("existing_CFR_verification", exact["formal_deal_truth_role"])\n        incomplete = roles["incomplete_or_lagged_observation"]\n        self.assertEqual(incomplete["evidence_class"], "Signal")\n        self.assertFalse(incomplete["formal_deal_eligible"])\n\n    def test_provider_class_abstraction_has_evidence_backed_consumer_examples(self):\n        classes = self.contract["provider_classes"]\n        ota = classes["consumer_ota_web"]["qualified_examples"]\n        meta = classes["consumer_metasearch_web"]["qualified_examples"]\n        self.assertEqual(ota["trip_com"]["display_name"], "Trip.com")\n        self.assertEqual(ota["expedia"]["display_name"], "Expedia")\n        self.assertEqual(meta["skyscanner"]["display_name"], "Skyscanner")\n        self.assertTrue(self.contract["example_membership_is_not_backend_qualification"])\n        for examples in (ota, meta):\n            for example in examples.values():\n                self.assertEqual(example["disposition"], "seed_or_verification_only_under_current_access")\n                self.assertTrue((ROOT / example["evidence"]).is_file())\n\n    def test_web_browsing_never_establishes_exhaustive_or_backend_coverage(self):\n        coverage = self.contract["coverage_semantics"]\n        self.assertEqual(coverage["exhaustive_web_coverage_claim"], "forbidden")\n        self.assertEqual(coverage["machine_backend_coverage_from_web_browsing"], "forbidden")\n        self.assertEqual(coverage["canonical_provider_health_from_web_browsing"], "forbidden")\n        self.assertFalse(coverage["web_attempt_satisfies_required_provider_search_slice"])\n        self.assertEqual(coverage["no_usable_observation"], "no_observation_not_no_fare")\n        self.assertEqual(coverage["inaccessible_or_restricted"], "access_unknown_not_fare_absence")\n        self.assertEqual(coverage["unqueried_surface"], "not_attempted")\n        self.assertEqual(coverage["scoped_window_success_without_actual_window_query"], "forbidden")\n\n    def test_restricted_web_surfaces_route_to_typed_blind_spots_without_hidden_price(self):\n        restricted = self.contract["roles"]["restricted_or_inaccessible_surface"]\n        self.assertEqual(restricted["registry_authority"], "access_blind_spots")\n        self.assertEqual(restricted["hidden_price_inference"], "forbidden")\n        blind = self.policy["access_blind_spots"]\n        self.assertTrue(blind["semantics"]["access_failure_does_not_prove_fare_absence"])\n        self.assertEqual(blind["semantics"]["hidden_price_inference"], "forbidden")\n\n    def test_contract_forbids_consumer_web_automation_and_preserves_machine_routing(self):\n        access = self.contract["access_constraints"]\n        self.assertTrue(access["public_without_login_required"])\n        for key in (\n            "login_or_member_session",\n            "session_reuse_or_rotation",\n            "captcha_bypass",\n            "anti_bot_evasion",\n            "browser_automation_subsystem",\n            "crawler_subsystem",\n        ):\n            self.assertEqual(access[key], "forbidden")\n\n        invariants = self.contract["routing_invariants"]\n        self.assertEqual(invariants["machine_destination_free_primary"], "gflights_google_flight_deals")\n        self.assertEqual(invariants["machine_known_route_primary"], "gflights_google_exact")\n        self.assertEqual(invariants["machine_known_route_fallback"], "kiwi_mcp_exact")\n        selected = self.routing["selected_routes"]["shared"]\n        self.assertEqual(selected["origin_wide_discovery"]["primary_provider"], "gflights_google_flight_deals")\n        self.assertIsNone(selected["origin_wide_discovery"]["automatic_executable_fallback"])\n        self.assertEqual(selected["broad_discovery"]["primary_provider"], "gflights_google_exact")\n        self.assertEqual(selected["broad_discovery"]["automatic_executable_fallback"], "kiwi_mcp_exact")\n\n    def test_web_provider_cannot_be_promoted_to_automatic_route_plan_fallback(self):\n        policy = deepcopy(self.policy)\n        policy["source_routing"]["selected_routes"]["shared"]["broad_discovery"]["automatic_executable_fallback"] = (\n            "chatgpt_web_public_fare_index"\n        )\n        request = SearchRequest(\n            profile="world",\n            search_stage="round_trip_benchmark",\n            origin="TPE",\n            destination="NRT",\n            outbound_date="2026-10-05",\n            return_date="2026-10-09",\n            destination_country="JP",\n        )\n        plan = build_source_plan(request, policy, {})\n        self.assertEqual(plan.coverage_state, "invalid_contract")\n        self.assertEqual(plan.entries, ())\n        self.assertIn("no canonical automatic fallback executor", plan.fallback_reason)\n\n    def test_geography_ftr_contract_and_agents_authority_pointer_are_unchanged(self):\n        self.assertEqual(self.policy["capability_state"]["current_runtime"]["destination_scope"], "asia_oceania")\n        self.assertEqual(self.policy["search"]["destination_scope"], "asia_oceania")\n        self.assertEqual(self.policy["search"]["origin_airports"], ["TPE", "TSA", "RMQ", "KHH"])\n        self.assertEqual(self.policy["ftr_handoff"]["status"], "canonical_runtime_active_launch_ready")\n        agents = (ROOT / "AGENTS.md").read_text(encoding="utf-8")\n        self.assertIn("source_routing.chat_web_execution_contract", agents)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          policy = yaml.safe_load(Path('flight-radar.yaml').read_text(encoding='utf-8'))
          assert policy['source_routing']['chat_web_execution_contract']['status'] == 'active_v1'
          assert policy['search']['destination_scope'] == 'asia_oceania'
          assert policy['source_routing']['selected_routes']['shared']['broad_discovery']['automatic_executable_fallback'] == 'kiwi_mcp_exact'
          PY

      - name: Commit bounded patch and remove builder
        shell: bash
        run: |
          rm .github/workflows/chat-web-contract-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md flight-radar.yaml tests/test_chat_web_execution_contract.py .github/workflows/chat-web-contract-builder.yml
          git commit -m "Define Chat Web execution contract"
          git push origin HEAD:work/chat-web-execution-contract-20260821
