name: Fixed watch execution

on:
  workflow_dispatch:
    inputs:
      radar_run_id:
        description: ChatGPT radar run identifier
        required: true
        type: string
      watch_ids:
        description: Comma-separated due fixed-watch ids selected by the ChatGPT orchestrator
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic HTTP runtime
        run: python -m pip install -e .

      - name: Execute requested fixed watches
        run: >-
          python -m cheap_flight_radar.fixed_watch_runner
          --run-id "${{ inputs.radar_run_id }}"
          --watch-ids "${{ inputs.watch_ids }}"
          --output artifacts/fixed-watch-run.json

      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-watch-run-${{ inputs.radar_run_id }}
          path: artifacts/fixed-watch-run.json
          if-no-files-found: error
          retention-days: 14
