name: policy-convergence-once

on:
  pull_request:
    branches:
      - chatdev/product-intent-20260813

permissions:
  contents: write

jobs:
  converge-policy:
    if: github.event.pull_request.head.ref == 'chatdev/substrate-bakeoff-20260813'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Converge executable SSOT to Product Intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('flight-radar.yaml')
          p = yaml.safe_load(path.read_text())

          p['project']['objective'] = (
              'Find real, abnormally cheap airfare Deals from Taiwan, ranked first by '
              'route-relative anomaly strength and then by current complete airfare, '
              'while retaining weaker promotional observations separately as Signals.'
          )

          s = p['search']
          s['horizon_days'] = 120
          s['horizon_semantics'] = 'default_compute_budget_not_product_bound'
          s['horizon_extension_allowed_when_provider_surface_is_cheap'] = True
          s['destination_scope'] = 'asia_oceania'
          s['discovery_strategy'] = 'destination_free_deal_round_trip_or_one_way_sweep'
          s['search_architecture'] = {
              'stage_a': 'destination_free_sweep_from_each_taiwan_origin',
              'accepted_seed_kinds': ['qualified_round_trip_deal', 'round_trip_fare', 'one_way_fare', 'destination_only'],
              'direct_qualified_round_trip_deal_can_skip_return_construction': True,
              'cheap_one_way_or_explore_seed_requires_endpoint_specific_completion': True,
              'expand_open_jaw_only_for_competitive_endpoints': True,
              'brute_force_city_date_city_matrix': 'forbidden_by_default',
              'market_specialist_pipeline_required': False,
              'market_priority_order': ['japan', 'korea', 'china', 'other_asia_oceania'],
          }
          ofc = s.get('outbound_first_contract', {})
          ofc['status'] = 'legacy_compatibility_only'
          ofc['serious_seed_requires_exact_outbound_one_way_probe'] = False
          ofc['only_serious_outbounds_enter_return_expansion'] = False
          ofc['china_specialist_multimodal_expansion_after_baseline_completion'] = False
          ofc['round_trip_deal_may_be_formal_candidate_without_one_way_split'] = True
          s['outbound_first_contract'] = ofc
          world = s['daily_profiles']['profiles']['world']
          world['destination_scope'] = 'asia_oceania'
          world['mode'] = 'priority_coverage_with_shared_pipeline'
          for market in ('japan', 'korea', 'china'):
              prof = s['daily_profiles']['profiles'][market]
              prof['mode'] = 'priority_coverage_with_shared_pipeline'
          china_prof = s['daily_profiles']['profiles']['china']
          china_prof['enable_multimodal_gateways'] = False
          china_prof['onward_modes'] = ['domestic_flight', 'rail', 'bus']

          p['fare_policy']['self_transfer_penalty'] = False
          p['fare_policy']['formal_deal_ranking_ignores_connection_brand_schedule_friction'] = True
          p['routing']['positioning_modes'] = [m for m in p['routing']['positioning_modes'] if m != 'ferry']
          p['routing']['ferry_in_product_scope'] = False
          p['return_windows_policy'] = {
              'role': 'search_hints_only',
              'formal_deal_minimum_away_hours': 24,
              'trip_length_does_not_affect_deal_status_or_ranking': True,
          }
          p['usable_time']['formal_deal_ranking_role'] = 'none'
          p['cost']['effective_total_transport_price_includes'] = [
              'international_airfare', 'required_domestic_airfare', 'required_baggage'
          ]
          p['cost']['formal_deal_price_semantics'] = 'complete_airfare_only'

          r = p['ranking']
          r['formal_deal_order'] = ['relative_anomaly_strength_desc', 'current_complete_airfare_twd_asc']
          r['primary_user_facing_views'] = ['deals', 'signals']
          r['legacy_absolute_price_views_status'] = 'diagnostic_only_not_first_class_deal_views'
          r['composite_score']['role'] = 'internal_discovery_ordering_only_not_formal_deal_ranking'
          r['formal_deal_ignores'] = [
              'trip_length_fit', 'transport_efficiency', 'connection_count', 'self_transfer',
              'airline_brand', 'red_eye', 'visa_friction', 'lodging_cost'
          ]
          p['penalties']['applies_to_formal_deal_ranking'] = False
          p['penalties']['self_transfer']['enabled'] = False
          p['penalties']['excessive_connection_time']['enabled'] = False
          p['penalties']['insufficient_trip_length_for_route']['enabled'] = False

          c = p['china']
          c['ferry_in_product_scope'] = False
          c['coverage_gate']['enabled'] = False
          c['coverage_gate']['required_modes'] = ['direct_air']
          for gateway in c.get('gateway_modes', {}).values():
              gateway['enabled'] = False
          c['ferry_data_policy']['status'] = 'retained_historical_reference_not_active_product_policy'
          c['ferry_evaluation']['status'] = 'retained_historical_reference_not_active_product_policy'

          h = p['price_history']
          h['role'] = 'supplemental_evidence_and_fallback_anomaly_truth'
          h['required_for_formal_deal'] = False
          h['external_anomaly_truth'] = {
              'preferred': True,
              'qualification_requires': ['stable_surface', 'current_price_reproducibility', 'typical_price_or_explicit_anomaly_magnitude'],
              'conflict_resolution': 'explicit_source_priority_never_average',
              'priority': ['google_flight_deals', 'google_flights_exact_price_insight', 'own_price_history'],
          }

          pub = p['publication']
          pub['primary_user_facing_views'] = ['deals', 'signals']
          pub['legacy_views_status'] = 'diagnostic_or_transition_only'
          pub['historical_display']['role'] = 'supplemental_when_available'

          pi = p['public_intelligence']
          pi['roles']['fixed_watch']['definition'] = 'optional_recurring_signal_source_not_deal_truth_authority'
          pi['roles']['fixed_watch']['failure_affects_coverage'] = False
          pi['coverage']['fixed_watch_attempts_are_coverage_authority'] = False
          pi['coverage']['opportunistic_source_cannot_substitute_fixed_watch_coverage'] = False
          pi['runtime']['anti_bot_evasion']['rotating_browser_user_agent'] = 'forbidden_for_production'
          pi['runtime']['anti_bot_evasion']['ordinary_fixed_user_agent_header'] = 'allowed'
          pi['fixed_watch_registry'] = [
              item for item in pi.get('fixed_watch_registry', [])
              if item.get('id') != 'ptt_japan_travel_info'
          ]
          for item in pi['fixed_watch_registry']:
              item['role'] = 'signal_only'
              item['cadence_hours'] = 24

          sr = p['source_routing']
          sr['status'] = 'bakeoff_selected_v2'
          sr['anomaly_truth_priority'] = [
              'google_flight_deals', 'google_flights_exact_price_insight', 'own_price_history'
          ]
          sr['conflicting_anomaly_sources'] = 'select_highest_priority_qualified_source_never_average'
          sr['api_production_gate'] = 'long_term_free_or_proven_recurring_free_quota_only'
          sr['api_production_exclusions'] = {
              'expedia_api': 'authorization_partner_access_and_new_applications_paused',
              'kiwi_tequila_api': 'new_partnerships_invitation_only',
              'skyscanner_api': 'partnership_approval_and_quota_not_proven_free_for_daily_full_radar',
              'google_flights_public_airfare_api': 'not_available',
          }

          shared = sr['selected_routes']['shared']
          shared['origin_wide_discovery'] = {
              'primary_provider': 'gflights_google_flight_deals',
              'fallback_provider': 'expedia_tw_airport_origin_surface',
              'secondary_seed_providers': ['gflights_google_explore', 'kiwi_anywhere_web', 'skyscanner_everywhere_web'],
              'execution_mode': 'keyless_http_client',
              'credential_required': False,
              'query_scope': 'destination_free_origin_airport_anywhere',
              'request_contract': 'OriginSweepRequest',
              'destination_input_forbidden': True,
              'applies_to_profiles': ['world', 'japan', 'korea', 'china'],
              'shared_across_profiles': True,
              'require_origin_attempt_for_each_configured_airport': True,
              'evidence_kinds': ['qualified_round_trip_deal', 'round_trip_fare', 'one_way_fare', 'destination_only'],
              'full_market_coverage_claim': False,
          }
          shared['broad_discovery'] = {
              'primary_provider': 'gflights_google_exact',
              'fallback_provider': 'fli_google_exact',
              'execution_mode': 'keyless_http_client',
              'credential_required': False,
              'query_scope': 'known_route_exact_or_flexible_completion',
              'role': 'complete_selected_seed_and_revalidate_current_airfare',
              'applies_to_profiles': ['world', 'japan', 'korea', 'china'],
              'shared_across_profiles': True,
              'combined_open_jaw': 'supported',
              'revalidation_required': True,
          }
          sr['selected_routes']['china'] = {
              'deep_search': {
                  'primary_provider': 'gflights_google_exact',
                  'execution_mode': 'keyless_http_client',
                  'credential_required': False,
                  'query_scope': 'known_route_exact_or_flexible_completion',
                  'combined_open_jaw': 'supported',
                  'specialist_pipeline_required': False,
              }
          }

          providers = sr['providers']
          providers['gflights_google_flight_deals'] = {
              'truth_source': 'google_flight_deals',
              'library': 'gflights==0.3.0',
              'license': 'MIT',
              'execution': 'disposable_github_runner_or_local',
              'credential_required': False,
              'proxy': 'forbidden',
              'user_agent': 'fixed_explicit_project_identity_required',
              'selected_roles': ['primary_destination_free_deal_discovery', 'primary_external_anomaly_truth_acquisition'],
              'qualification': 'production_candidate_live_proven_2026_08_13',
          }
          providers['gflights_google_explore'] = {
              'truth_source': 'google_flights_explore',
              'library': 'gflights==0.3.0',
              'credential_required': False,
              'selected_roles': ['secondary_destination_free_seed_discovery'],
              'verification_state': 'seed_only_until_exact_completion',
          }
          providers['gflights_google_exact'] = {
              'truth_source': 'google_flights_exact_search',
              'library': 'gflights==0.3.0',
              'credential_required': False,
              'selected_roles': ['exact_completion', 'flexible_dates', 'open_jaw', 'booking_offer_revalidation'],
              'verification_state': 'current_search_evidence_revalidate_before_publish',
          }
          providers['fli_google_exact'] = {
              'library': 'flights==0.9.0',
              'credential_required': False,
              'selected_roles': ['exact_and_flexible_fallback_comparator'],
              'production_note': 'install_click_explicitly_due_current_wheel_metadata_defect',
          }
          providers['kiwi_anywhere_web'] = {'selected_roles': ['secondary_seed_discovery'], 'execution': 'chatgpt_web_direct', 'credential_required': False}
          providers['skyscanner_everywhere_web'] = {'selected_roles': ['secondary_seed_discovery'], 'execution': 'chatgpt_web_direct', 'credential_required': False}
          providers['trvl_research_only'] = {
              'selected_roles': [],
              'production_status': 'rejected_after_live_bakeoff',
              'reasons': ['twd_request_returned_usd', 'default_multi_provider_merge_noisy', 'provider_429_and_403_observed', 'self_connect_composition', 'polyform_noncommercial_license', 'google_provider_uses_utls_browser_tls_impersonation'],
          }
          providers.pop('flyai', None)

          path.write_text(yaml.safe_dump(p, sort_keys=False, allow_unicode=True, width=110), encoding='utf-8')
          PY

          rm .github/workflows/policy-convergence-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flight-radar.yaml .github/workflows/policy-convergence-once.yml
          git commit -m 'Converge airfare substrate policy to product intent'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
