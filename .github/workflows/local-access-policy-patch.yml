name: Temporary local access policy patch

on:
  push:
    branches:
      - chatdev/local-access-normalization-20260812

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatdev/local-access-normalization-20260812
          fetch-depth: 0

      - name: Apply policy and docs patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'flight-radar.yaml',
              '''routing:\n  open_jaw: true\n  allow_positioning_segments: true\n  positioning_modes:\n    - domestic_flight\n    - rail\n    - bus\n    - ferry\n  max_extra_flight_segments_default: 1\n  prefer_domestic_positioning_over_cross_border_self_transfer: true\n  reject_unverified_connections: true\n''',
              '''routing:\n  open_jaw: true\n  allow_positioning_segments: true\n  positioning_modes:\n    - domestic_flight\n    - rail\n    - bus\n    - ferry\n  max_extra_flight_segments_default: 1\n  prefer_domestic_positioning_over_cross_border_self_transfer: true\n  reject_unverified_connections: true\n  short_local_access:\n    normalization: ignore_cost_and_comparative_time\n    exact_fare_or_duration_required: false\n    can_fail_closed: false\n    practical_connection_feasibility_required_when_time_sensitive: true\n    definition: >-\n      Short local first/last-mile or intra-gateway-area movement that can normally\n      be handled by taxi or ordinary local transit and is not itself the travel\n      product being compared.\n    examples:\n      - airport_to_same_city_or_gateway_area\n      - port_to_same_city_or_gateway_area\n      - short_airport_to_port_or_port_to_airport\n    does_not_apply_to:\n      - intercity_or_cross_region_transfer\n      - ferry_or_mainland_rail_or_domestic_flight\n      - required_connection_wait_or_checkin\n      - unavoidable_transport_caused_overnight\n'''
          )

          replace(
              'flight-radar.yaml',
              '''    - required_airport_or_port_transfer\n    - required_baggage\n    - unavoidable_transport_caused_overnight_cost\n  exclude_by_default:\n    - normal_local_sightseeing_transport\n''',
              '''    - material_required_airport_or_port_transfer_excluding_short_local_access\n    - required_baggage\n    - unavoidable_transport_caused_overnight_cost\n  exclude_by_default:\n    - short_local_taxi_or_equivalent_access_cost\n    - normal_local_sightseeing_transport\n'''
          )

          replace(
              'flight-radar.yaml',
              '''  ferry_evaluation:\n    compare_against_simplest_comparable_air_itinerary: true\n    count_total_door_to_door_transport_time: true\n    include_port_transfer_and_checkin_time: true\n    include_immigration_and_wait_time: true\n''',
              '''  ferry_evaluation:\n    compare_against_simplest_comparable_air_itinerary: true\n    count_total_door_to_door_transport_time: true\n    short_local_taxi_or_equivalent_transfer_time_excluded: true\n    include_material_port_transfer_and_checkin_time: true\n    connection_feasibility_still_required_for_excluded_local_access: true\n    include_immigration_and_wait_time: true\n'''
          )

          replace(
              'flight-radar.yaml',
              '''    final_revalidation:\n      round_trip_benchmark_required: true\n      exact_airport_and_date_required_for_air_segments: true\n      current_price_required_for_all_priced_segments: true\n      live_schedule_required_for_time_sensitive_ground_or_ferry_segments: true\n      essential_unknown_action: exploratory_not_verified\n''',
              '''    final_revalidation:\n      round_trip_benchmark_required: true\n      exact_airport_and_date_required_for_air_segments: true\n      current_price_required_for_all_priced_segments: true\n      live_schedule_required_for_time_sensitive_ground_or_ferry_segments: true\n      excluded_short_local_access_is_not_an_essential_component: true\n      essential_unknown_action: exploratory_not_verified\n'''
          )

          replace(
              'docs/china-routing.md',
              '''Count, when required:\n\n- Taiwan positioning flight and airport process,\n- airport → port transfer,\n- ferry check-in and waiting,\n- sailing time,\n- immigration/border processing,\n- port → city/rail/airport transfer,\n- onward mainland transport,\n- the same components again if the return also uses ferry.\n''',
              '''Count, when required:\n\n- Taiwan positioning flight and airport process,\n- material airport / port transfer that is more than short local access,\n- ferry check-in and waiting,\n- sailing time,\n- immigration/border processing,\n- material port → city/rail/airport transfer when it is intercity or otherwise a real routing leg,\n- onward mainland transport,\n- the same components again if the return also uses ferry.\n\n### Short local access normalization\n\nShort local first/last-mile movement that can normally be handled by taxi or ordinary local transit is **not part of the comparative deal cost or comparative transport time**. A conventional same-city air trip also requires local airport access, so exact taxi fare/minutes add noise without improving the gateway decision.\n\nFor this class of movement:\n\n- do not require an exact fare or duration;\n- do not fail-close a candidate solely because that exact local fare/time is missing;\n- do not deduct it from usable destination time or add it to extra transport time;\n- still confirm that the connection is physically practical when it feeds a time-sensitive ferry or separately ticketed segment.\n\nExamples that may be ignored for cost/time when practically short and local include `KNH ↔ Shuitou`, `Wutong ↔ Xiamen local anchor`, or an ordinary airport ↔ same-city taxi. This exception does **not** apply to a real intercity leg such as `Huangqi ↔ Fuzhou`, to ferry/rail/domestic-air travel, to check-in/waiting, or to a transport-caused overnight.\n'''
          )

          replace(
              'docs/china-routing.md',
              '''China multimodal candidates must include required:\n\n- Taiwan positioning flight,\n- ferry fare,\n- port/airport transfers,\n- mainland rail/domestic airfare,\n- return transport to Taiwan,\n- required baggage and unavoidable transport-caused overnight costs.\n''',
              '''China multimodal candidates must include required:\n\n- Taiwan positioning flight,\n- ferry fare,\n- material port/airport transfers that are not short local taxi-equivalent access,\n- mainland rail/domestic airfare,\n- return transport to Taiwan,\n- required baggage and unavoidable transport-caused overnight costs.\n\nShort local taxi-equivalent access is deliberately excluded from both comparative cost and comparative transport time; only connection feasibility remains relevant.\n'''
          )

          replace(
              'docs/scoring.md',
              '''Use the normalized TWD cost defined in `flight-radar.yaml`, including transport components that are required to make the proposed itinerary work.\n\nThe system should retain both original-currency values and normalized TWD values when possible.\n''',
              '''Use the normalized TWD cost defined in `flight-radar.yaml`, including material transport components that are required to make the proposed itinerary work. Short local taxi-equivalent first/last-mile access is excluded because comparable same-city itineraries also incur local airport/port access and the user does not value that small difference.\n\nThe system should retain both original-currency values and normalized TWD values when possible.\n'''
          )

          replace(
              'docs/scoring.md',
              '''Transport efficiency penalizes itinerary friction, especially:\n\n- excessive connection time,\n- unnecessary backtracking,\n- risky self-transfers,\n- expensive positioning segments,\n- avoidable overnight costs caused by transport.\n\nA direct or efficient one-stop itinerary should usually beat a similarly priced itinerary that burns a large fraction of the trip in transit.\n''',
              '''Transport efficiency penalizes itinerary friction, especially:\n\n- excessive connection time,\n- unnecessary backtracking,\n- risky self-transfers,\n- expensive positioning segments,\n- avoidable overnight costs caused by transport.\n\nShort local taxi-equivalent access is not counted as comparative transport time and does not reduce usable time. Connection feasibility still matters when that local movement feeds a fixed departure.\n\nA direct or efficient one-stop itinerary should usually beat a similarly priced itinerary that burns a large fraction of the trip in material transit.\n'''
          )

          replace(
              'docs/fujian-gateway-convergence-closeout-2026-08-12.md',
              '''The current SSOT already contains the required behavior, so this closeout does not change `flight-radar.yaml`:\n\n- every priced required segment needs a current price;\n- every time-sensitive ferry / ground / rail segment needs current schedule evidence;\n- unavoidable transport-caused overnight cost is part of complete effective transport cost;\n- an essential unknown keeps the route exploratory rather than final-verified;\n- no proxy rotation, stealth/fingerprint spoofing, CAPTCHA bypass, residential proxy, or equivalent anti-bot workaround is permitted.\n''',
              '''At the time of the original closeout, the SSOT required exact priced ground components. A later same-day policy clarification now excludes **short local taxi-equivalent access** from both comparative cost and comparative transport time. Historical acquisition below is retained as evidence, but missing short local taxi fare/minutes are no longer blockers.\n\nThe current rule is therefore:\n\n- every material priced required segment needs a current price;\n- every material time-sensitive ferry / rail / intercity ground segment needs current schedule evidence;\n- short local taxi-equivalent access needs only practical connection feasibility, not exact fare/time;\n- unavoidable transport-caused overnight cost is part of complete effective transport cost;\n- an essential material unknown keeps the route exploratory rather than final-verified;\n- no proxy rotation, stealth/fingerprint spoofing, CAPTCHA bypass, residential proxy, or equivalent anti-bot workaround is permitted.\n'''
          )

          replace(
              'docs/fujian-gateway-convergence-closeout-2026-08-12.md',
              '''- **KNH:** official or otherwise exact-booking domestic-air surface for the connectable `08/20` outbound and `08/23` reverse fare; ferry and Xiamen-side transport evidence are now materially stronger.\n''',
              '''- **KNH:** official or otherwise exact-booking domestic-air surface for the connectable `08/20` outbound and `08/23` reverse fare. Short local KNH/Xiamen taxi-equivalent access is no longer a cost/time blocker; only practical connection feasibility matters.\n'''
          )

          replace(
              'tests/test_china_mixed_routing_policy.py',
              '''        cls.mixed = cls.policy["china"]["mixed_routing"]\n''',
              '''        cls.mixed = cls.policy["china"]["mixed_routing"]\n        cls.local_access = cls.policy["routing"]["short_local_access"]\n        cls.cost = cls.policy["cost"]\n        cls.ferry = cls.policy["china"]["ferry_evaluation"]\n'''
          )

          replace(
              'tests/test_china_mixed_routing_policy.py',
              '''    def test_mixed_routing_stops_on_unverifiable_or_noncompetitive_branches(self):\n''',
              '''    def test_short_local_access_is_not_a_cost_time_or_fail_closed_component(self):\n        self.assertEqual(\n            self.local_access["normalization"],\n            "ignore_cost_and_comparative_time",\n        )\n        self.assertFalse(self.local_access["exact_fare_or_duration_required"])\n        self.assertFalse(self.local_access["can_fail_closed"])\n        self.assertTrue(\n            self.local_access["practical_connection_feasibility_required_when_time_sensitive"]\n        )\n        includes = set(self.cost["effective_total_transport_price_includes"])\n        self.assertNotIn("required_airport_or_port_transfer", includes)\n        self.assertIn(\n            "material_required_airport_or_port_transfer_excluding_short_local_access",\n            includes,\n        )\n        self.assertTrue(self.ferry["short_local_taxi_or_equivalent_transfer_time_excluded"])\n        self.assertTrue(\n            self.mixed["final_revalidation"][\n                "excluded_short_local_access_is_not_an_essential_component"\n            ]\n        )\n\n    def test_mixed_routing_stops_on_unverifiable_or_noncompetitive_branches(self):\n'''
          )
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flight-radar.yaml docs/china-routing.md docs/scoring.md docs/fujian-gateway-convergence-closeout-2026-08-12.md tests/test_china_mixed_routing_policy.py
          git commit -m "policy: ignore short local access cost and time"
          git push origin HEAD:chatdev/local-access-normalization-20260812
