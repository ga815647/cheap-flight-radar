name: Crawler runtime spike

on:
  pull_request:
  workflow_dispatch:

jobs:
  crawlee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Crawlee + ordinary Playwright
        run: |
          /usr/bin/time -f 'CRAWLEE_PIP_SECONDS=%e' python -m pip install 'crawlee[parsel,playwright]'
          /usr/bin/time -f 'CRAWLEE_BROWSER_SECONDS=%e' python -m playwright install --with-deps chromium
          python - <<'PY'
          import crawlee, playwright
          print('crawlee_version', crawlee.__version__)
          PY
      - name: Prepare deterministic fixture
        run: |
          mkdir -p /tmp/radar-spike
          printf '%s\n' '<html><title>static</title><div id="signal">static-ready</div></html>' > /tmp/radar-spike/static.html
          printf '%s\n' '<html><title>js</title><div id="signal">before</div><script>document.getElementById("signal").textContent="js-ready";</script></html>' > /tmp/radar-spike/js.html
          python -m http.server 8765 --directory /tmp/radar-spike >/tmp/radar-spike/http.log 2>&1 &
      - name: Run HTTP and JS paths
        run: |
          cat > /tmp/radar-spike/crawlee_spike.py <<'PY'
          import asyncio
          from crawlee.crawlers import ParselCrawler, ParselCrawlingContext, PlaywrightCrawler, PlaywrightCrawlingContext

          async def main():
              http = ParselCrawler(max_requests_per_crawl=1, max_request_retries=1, max_session_rotations=0, retry_on_blocked=False)
              http_values = []
              @http.router.default_handler
              async def http_handler(context: ParselCrawlingContext):
                  http_values.append(context.selector.css('#signal::text').get())
              await http.run(['http://127.0.0.1:8765/static.html'])
              assert http_values == ['static-ready'], http_values

              browser = PlaywrightCrawler(max_requests_per_crawl=1, max_request_retries=1, max_session_rotations=0, retry_on_blocked=False, browser_type='chromium')
              browser_values = []
              @browser.router.default_handler
              async def browser_handler(context: PlaywrightCrawlingContext):
                  browser_values.append(await context.page.locator('#signal').text_content())
              await browser.run(['http://127.0.0.1:8765/js.html'])
              assert browser_values == ['js-ready'], browser_values
              print('CRAWLEE_SMOKE_OK', http_values, browser_values)

          asyncio.run(main())
          PY
          /usr/bin/time -f 'CRAWLEE_RUN_SECONDS=%e' python /tmp/radar-spike/crawlee_spike.py

  scrapy_playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Scrapy + Playwright
        run: |
          /usr/bin/time -f 'SCRAPY_PIP_SECONDS=%e' python -m pip install scrapy scrapy-playwright
          /usr/bin/time -f 'SCRAPY_BROWSER_SECONDS=%e' python -m playwright install --with-deps chromium
          python - <<'PY'
          import scrapy, scrapy_playwright
          print('scrapy_version', scrapy.__version__)
          print('scrapy_playwright_module', scrapy_playwright.__file__)
          PY
      - name: Prepare deterministic fixture
        run: |
          mkdir -p /tmp/radar-spike
          printf '%s\n' '<html><title>static</title><div id="signal">static-ready</div></html>' > /tmp/radar-spike/static.html
          printf '%s\n' '<html><title>js</title><div id="signal">before</div><script>document.getElementById("signal").textContent="js-ready";</script></html>' > /tmp/radar-spike/js.html
          python -m http.server 8765 --directory /tmp/radar-spike >/tmp/radar-spike/http.log 2>&1 &
      - name: Run HTTP and JS paths
        run: |
          cat > /tmp/radar-spike/scrapy_spike.py <<'PY'
          import json
          from pathlib import Path
          import scrapy
          from scrapy.crawler import CrawlerProcess

          out = Path('/tmp/radar-spike/items.jl')
          class SpikeSpider(scrapy.Spider):
              name = 'spike'
              custom_settings = {
                  'DOWNLOAD_HANDLERS': {
                      'http': 'scrapy_playwright.handler.ScrapyPlaywrightDownloadHandler',
                      'https': 'scrapy_playwright.handler.ScrapyPlaywrightDownloadHandler',
                  },
                  'TWISTED_REACTOR': 'twisted.internet.asyncioreactor.AsyncioSelectorReactor',
                  'FEEDS': {str(out): {'format': 'jsonlines', 'overwrite': True}},
                  'LOG_LEVEL': 'ERROR',
                  'RETRY_TIMES': 1,
              }
              def start_requests(self):
                  yield scrapy.Request('http://127.0.0.1:8765/static.html', cb_kwargs={'kind':'http'})
                  yield scrapy.Request('http://127.0.0.1:8765/js.html', meta={'playwright': True}, cb_kwargs={'kind':'browser'})
              def parse(self, response, kind):
                  yield {'kind': kind, 'value': response.css('#signal::text').get()}

          process = CrawlerProcess()
          process.crawl(SpikeSpider)
          process.start()
          rows = [json.loads(line) for line in out.read_text().splitlines()]
          got = {row['kind']: row['value'] for row in rows}
          assert got == {'http':'static-ready','browser':'js-ready'}, got
          print('SCRAPY_SMOKE_OK', got)
          PY
          /usr/bin/time -f 'SCRAPY_RUN_SECONDS=%e' python /tmp/radar-spike/scrapy_spike.py

  urlwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install urlwatch + ordinary Playwright
        run: |
          /usr/bin/time -f 'URLWATCH_PIP_SECONDS=%e' python -m pip install urlwatch playwright
          /usr/bin/time -f 'URLWATCH_BROWSER_SECONDS=%e' python -m playwright install --with-deps chromium
          urlwatch --version
      - name: Run URL and browser jobs
        run: |
          mkdir -p /tmp/radar-spike "$HOME/.config/urlwatch"
          printf '%s\n' '<html><div id="signal">static-ready</div></html>' > /tmp/radar-spike/static.html
          printf '%s\n' '<html><div id="signal">before</div><script>document.getElementById("signal").textContent="js-ready";</script></html>' > /tmp/radar-spike/js.html
          python -m http.server 8765 --directory /tmp/radar-spike >/tmp/radar-spike/http.log 2>&1 &
          cat > "$HOME/.config/urlwatch/urls.yaml" <<'YAML'
          name: static
          url: http://127.0.0.1:8765/static.html
          filter:
            - css: '#signal'
          ---
          name: browser
          navigate: http://127.0.0.1:8765/js.html
          browser: chromium
          wait_for: '#signal'
          filter:
            - css: '#signal'
          YAML
          /usr/bin/time -f 'URLWATCH_RUN_SECONDS=%e' urlwatch | tee /tmp/radar-spike/urlwatch.out
          grep -q 'static-ready' /tmp/radar-spike/urlwatch.out
          grep -q 'js-ready' /tmp/radar-spike/urlwatch.out
          echo URLWATCH_SMOKE_OK

  changedetection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Start changedetection.io container
        run: |
          start=$(date +%s)
          docker run -d --name changedetection -p 5000:5000 dgtlmoon/changedetection.io:latest
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5000/ >/tmp/cd-home.html; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5000/ >/dev/null
          end=$(date +%s)
          echo "CHANGEDETECTION_STARTUP_SECONDS=$((end-start))"
          docker image inspect dgtlmoon/changedetection.io:latest --format 'CHANGEDETECTION_IMAGE_BYTES={{.Size}}'
          docker ps --filter name=changedetection
          echo CHANGEDETECTION_HTTP_SERVICE_OK
      - name: Record non-bypass browser architecture boundary
        run: |
          echo 'JS fallback requires a separate ordinary browser service (Playwright/WebDriver); no stealth, CAPTCHA bypass, proxy rotation, or fingerprint evasion is exercised in this spike.'
