name: SR-F public-intelligence simplification worker

on:
  push:
    branches:
      - feat/cfr-sr-f-public-intelligence-simplification

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cfr-sr-f-public-intelligence-simplification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory and implement bounded SR-F
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import pathlib, shutil, subprocess, textwrap

          root = pathlib.Path('.')
          def grep_inventory():
              pat = r'fixed_watch|fixed-watch|fixed watch|Scrapy|scrapy|scrapy_playwright|scrapy-playwright|public_sources|fixed_watch_coverage'
              p = subprocess.run(['git','grep','-n','-I','-E',pat], text=True, capture_output=True)
              return p.stdout.strip().splitlines() if p.stdout.strip() else []

          before = grep_inventory()

          # Remove fixed-watch executable/runtime surface.
          for path in [
              '.github/workflows/fixed-watch-run.yml',
              'src/cheap_flight_radar/fixed_watch_runner.py',
              'src/cheap_flight_radar/fixed_watch_state.py',
              'src/cheap_flight_radar/public_sources.py',
              'tests/test_fixed_watch_state.py',
              'tests/test_public_source_parsers.py',
              'tests/test_public_intelligence_runtime.py',
              'tests/test_public_intelligence_spec.py',
          ]:
              p = root / path
              if p.exists():
                  p.unlink()
          fixture_dir = root / 'tests/fixtures/public_sources'
          if fixture_dir.exists():
              shutil.rmtree(fixture_dir)

          # Drop orphaned crawler/browser dependencies.
          pyproject = root / 'pyproject.toml'
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('  "Scrapy>=2.17,<3",\n', '')
          text = text.replace('\n[project.optional-dependencies]\nbrowser = [\n  "scrapy-playwright>=0.0.48,<0.1",\n]\n', '\n')
          pyproject.write_text(text, encoding='utf-8')

          # Retain only generic opportunistic Signal provenance/dedupe primitives.
          public_module = root / 'src/cheap_flight_radar/public_intelligence.py'
          public_module.write_text(textwrap.dedent('''\
          """Generic opportunistic public-intelligence provenance and dedupe primitives.

          SR-F deliberately retired CFR's fixed-watch crawler/cadence/state machinery.
          This module retains only source-agnostic Signal provenance/identity helpers for
          best-effort public Web/social observations supplied by the ChatGPT orchestrator.
          These records are never Deal/anomaly/backend coverage authority by themselves.
          """
          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime
          from hashlib import sha256
          import json
          from typing import Any, Iterable, Mapping, Sequence


          @dataclass(frozen=True)
          class DiscoverySighting:
              observation_id: str
              source_id: str
              source_url: str
              item_url: str
              observed_at: datetime
              title: str
              carrier: str | None = None
              sale_period: str | None = None
              travel_period: str | None = None
              route_set: tuple[str, ...] = ()
              promo_code: str | None = None
              price_text: str | None = None

              def __post_init__(self) -> None:
                  _require_aware(self.observed_at)


          @dataclass(frozen=True)
          class DiscoveryCandidate:
              campaign_key: str
              first_seen_at: datetime
              first_discovery_source_id: str
              discovery_source_ids: tuple[str, ...]
              sightings: tuple[DiscoverySighting, ...]


          def campaign_identity(sighting: DiscoverySighting) -> str | None:
              """Return a source/price-independent campaign key, or None if unresolved."""
              route_set = tuple(sorted({_clean_token(route) for route in sighting.route_set if _clean_token(route)}))
              required = (
                  _clean_token(sighting.carrier),
                  _clean_token(sighting.sale_period),
                  _clean_token(sighting.travel_period),
              )
              if any(value is None for value in required) or not route_set:
                  return None
              return "campaign:" + _stable_hash({
                  "carrier": required[0],
                  "sale_period": required[1],
                  "travel_period": required[2],
                  "route_set": route_set,
                  "promo_code": _clean_token(sighting.promo_code),
              })


          def exact_itinerary_identity(
              *,
              trip_type: str,
              exact_origin_airport: str,
              exact_destination_airport_when_known: str | None,
              outbound_date_or_window: str,
              return_date_or_window: str | None,
              operating_or_marketing_flight_identity_when_known: Sequence[str] = (),
          ) -> str:
              payload = {
                  "trip_type": _clean_token(trip_type),
                  "exact_origin_airport": _clean_token(exact_origin_airport),
                  "exact_destination_airport_when_known": _clean_token(exact_destination_airport_when_known),
                  "outbound_date_or_window": _clean_token(outbound_date_or_window),
                  "return_date_or_window": _clean_token(return_date_or_window),
                  "flight_identity": tuple(
                      token for token in (_clean_token(value) for value in operating_or_marketing_flight_identity_when_known) if token
                  ),
              }
              if not payload["trip_type"] or not payload["exact_origin_airport"] or not payload["outbound_date_or_window"]:
                  raise ValueError("trip type, exact origin, and outbound date/window are required")
              return "itinerary:" + _stable_hash(payload)


          def dedupe_campaign_sightings(
              sightings: Iterable[DiscoverySighting],
          ) -> tuple[tuple[DiscoveryCandidate, ...], tuple[DiscoverySighting, ...]]:
              groups: dict[str, list[DiscoverySighting]] = {}
              unresolved: list[DiscoverySighting] = []
              for sighting in sightings:
                  key = campaign_identity(sighting)
                  if key is None:
                      unresolved.append(sighting)
                  else:
                      groups.setdefault(key, []).append(sighting)
              candidates: list[DiscoveryCandidate] = []
              for key, group in groups.items():
                  ordered = sorted(group, key=lambda item: (item.observed_at, item.observation_id))
                  candidates.append(DiscoveryCandidate(
                      campaign_key=key,
                      first_seen_at=ordered[0].observed_at,
                      first_discovery_source_id=ordered[0].source_id,
                      discovery_source_ids=tuple(dict.fromkeys(item.source_id for item in ordered)),
                      sightings=tuple(ordered),
                  ))
              candidates.sort(key=lambda item: (item.first_seen_at, item.campaign_key))
              unresolved.sort(key=lambda item: (item.observed_at, item.observation_id))
              return tuple(candidates), tuple(unresolved)


          def make_observation_id(source_id: str, item_url: str, title: str, observed_at: datetime) -> str:
              _require_aware(observed_at)
              return "obs:" + _stable_hash({
                  "source_id": source_id,
                  "item_url": item_url,
                  "title": title.strip(),
                  "observed_at": observed_at.isoformat(),
              })


          def _require_aware(value: datetime) -> None:
              if value.tzinfo is None or value.utcoffset() is None:
                  raise ValueError("timestamps must be timezone-aware")


          def _clean_token(value: str | None) -> str | None:
              if value is None:
                  return None
              cleaned = " ".join(str(value).strip().split()).casefold()
              return cleaned or None


          def _stable_hash(payload: Mapping[str, Any]) -> str:
              encoded = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return sha256(encoded).hexdigest()[:24]
          '''), encoding='utf-8')

          # Replace fixed-watch operational SSOT with a small opportunistic/verification lane.
          policy = root / 'flight-radar.yaml'
          ptxt = policy.read_text(encoding='utf-8')
          start = ptxt.index('public_intelligence:\n')
          end = ptxt.index('source_routing:\n', start)
          new_block = textwrap.dedent('''\
          public_intelligence:
            status: simplified_opportunistic_signal_lane_v2
            roles:
              opportunistic:
                definition: best_effort_open_web_or_public_social_signal
                failure_affects_coverage: false
              verification_only:
                definition: candidate_triggered_airline_ota_or_fare_search_surface
                failure_affects_discovery_coverage: false
            orchestration:
              primary_scheduler: chatgpt_scheduled_radar_run
              github_actions_role: disposable_execution_gate_backend_not_public_intelligence_crawler
              independent_github_cron: false
              chatgpt_run_sequence:
              - perform_opportunistic_web_discovery
              - perform_deep_search_and_revalidation
              - persist_immutable_price_history_snapshot
              - derive_historical_metrics_from_persisted_history
              - append_publication_manifest
              - publish_static_report
            coverage:
              public_intelligence_is_required_coverage_authority: false
              opportunistic_source_failure_affects_provider_health: false
              verification_only_failure_affects_discovery_coverage: false
              no_public_intelligence_observation_does_not_mean_market_absence: true
              no_public_intelligence_observation_does_not_mean_no_cheaper_restricted_fare: true
            provenance:
              first_seen_immutable: true
              discovery_sources_append_only: true
              preserve_all_duplicate_sightings: true
              keep_deep_search_sources_separate: true
              keep_revalidation_sources_separate: true
              keep_final_cross_check_sources_separate: true
              exact_taiwan_airport_identity_required_when_known: true
            dedupe:
              source_identity_excluded_from_candidate_identity: true
              price_excluded_from_itinerary_identity: true
              exact_itinerary_key_components:
              - trip_type
              - exact_origin_airport
              - exact_destination_airport_when_known
              - outbound_date_or_window
              - return_date_or_window
              - operating_or_marketing_flight_identity_when_known
              campaign_key_components:
              - carrier
              - sale_period
              - travel_period
              - route_set
              - promo_code_when_known
              fare_observations_append_to_existing_candidate: true
              never_count_duplicate_sightings_as_separate_deals: true
            opportunistic_policy:
              include_public_search_engine_results: true
              include_public_social_posts_when_indexed_without_login_bypass: true
              include_news_and_forums: true
              include_public_airline_promotion_pages: true
              preserve_source_url_or_post_identity: true
              public_social_seed_contract:
                public_indexed_without_login_required: true
                may_supply:
                - route_signal
                - date_signal
                - promo_signal
                - price_text
                verification_state: seed_only
                can_establish_verified_fare: false
                serious_candidate_requires_separate_exact_fare_probe: true
              examples_researched_not_required_coverage:
              - china_airlines_official_promotions
              - tigerair_tw_official_news_and_static_events
              - taiwan_airfare_editor_facebook_pages
              - peach_official_promotions
              - tway_official_events
              - jejuair_official_events
              - eva_air_official_promotions
              - cheapflytw
              - secret_flying
              - fly4free
            verification_only_policy:
              trigger_after_serious_candidate: true
              source_classes:
              - airline_booking_or_exact_fare_page
              - ota_exact_itinerary_page
              - metasearch_exact_itinerary_page
              verify_when_possible:
              - exact_airports
              - exact_dates
              - flight_identity
              - current_price
              - tax_scope
              - baggage_scope
              - fare_family
              unknown_components_remain_unknown: true
            retired_fixed_watch_subsystem:
              status: retired_by_CFR_SR_F
              reason: optional_signal_recall_value_did_not_justify_crawler_cadence_state_browser_and_artifact_maintenance
              durable_evidence: docs/public-intelligence-simplification-2026-08-21.md
              historical_manifests_are_not_current_runtime_input: true
          ''')
          ptxt = ptxt[:start] + new_block + ptxt[end:]
          ptxt = ptxt.replace('  - fixed_watch_coverage_and_freshness\n', '')
          policy.write_text(ptxt, encoding='utf-8')

          # Current search-strategy header: old fixed-watch passages below remain historical only.
          strategy = root / 'docs/search-strategy.md'
          stxt = strategy.read_text(encoding='utf-8')
          marker = '## Current public-intelligence contract (SR-F, 2026-08-21)'
          if marker not in stxt:
              first_nl = stxt.index('\n') + 1
              current = textwrap.dedent('''\

              ## Current public-intelligence contract (SR-F, 2026-08-21)

              The fixed-watch crawler/cadence/state subsystem is retired. Public intelligence is now a best-effort opportunistic/verification-only Signal lane operated directly by the ChatGPT orchestrator when useful; it is not Deal/anomaly/backend coverage authority and has no independent GitHub schedule or crawler runtime. Generic provenance/campaign/itinerary dedupe helpers remain. Older fixed-watch/crawler sections below are historical design evidence only and do not override `PRODUCT_INTENT.md` or `flight-radar.yaml`.
              ''')
              stxt = stxt[:first_nl] + current + stxt[first_nl:]
              strategy.write_text(stxt, encoding='utf-8')

          # Dedicated deterministic regression for the simplified contract.
          test = root / 'tests/test_sr_f_public_intelligence_simplification.py'
          test.write_text(textwrap.dedent('''\
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import unittest
          import yaml

          from cheap_flight_radar import public_intelligence as pi

          ROOT = Path(__file__).resolve().parents[1]
          UTC = timezone.utc

          class SRFPublicIntelligenceSimplificationTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.policy = yaml.safe_load((ROOT / "flight-radar.yaml").read_text(encoding="utf-8"))
                  cls.public = cls.policy["public_intelligence"]

              def test_fixed_watch_executable_surface_is_retired(self):
                  for rel in (
                      ".github/workflows/fixed-watch-run.yml",
                      "src/cheap_flight_radar/fixed_watch_runner.py",
                      "src/cheap_flight_radar/fixed_watch_state.py",
                      "src/cheap_flight_radar/public_sources.py",
                  ):
                      self.assertFalse((ROOT / rel).exists(), rel)
                  pyproject = (ROOT / "pyproject.toml").read_text(encoding="utf-8").lower()
                  self.assertNotIn("scrapy", pyproject)
                  self.assertNotIn("playwright", pyproject)
                  self.assertFalse(hasattr(pi, "FixedWatch"))
                  self.assertFalse(hasattr(pi, "plan_fixed_watches"))

              def test_ssot_keeps_only_opportunistic_and_verification_signal_roles(self):
                  self.assertEqual(self.public["status"], "simplified_opportunistic_signal_lane_v2")
                  self.assertEqual(set(self.public["roles"]), {"opportunistic", "verification_only"})
                  self.assertFalse(self.public["coverage"]["public_intelligence_is_required_coverage_authority"])
                  self.assertFalse(self.public["coverage"]["opportunistic_source_failure_affects_provider_health"])
                  self.assertEqual(self.public["retired_fixed_watch_subsystem"]["status"], "retired_by_CFR_SR_F")
                  self.assertNotIn("fixed_watch_coverage_and_freshness", self.policy["publication"]["required_operational_sections"])

              def test_campaign_dedupe_preserves_provenance_without_price_identity(self):
                  now = datetime(2026, 8, 21, 15, 0, tzinfo=UTC)
                  first = pi.DiscoverySighting(
                      observation_id="one", source_id="a", source_url="https://a.example/", item_url="https://a.example/1",
                      observed_at=now - timedelta(minutes=1), title="sale", carrier="Carrier X", sale_period="Aug",
                      travel_period="Sep", route_set=("TPE-NRT",), promo_code="GO", price_text="TWD 1999",
                  )
                  second = pi.DiscoverySighting(
                      observation_id="two", source_id="b", source_url="https://b.example/", item_url="https://b.example/2",
                      observed_at=now, title="sale repost", carrier="carrier x", sale_period="Aug",
                      travel_period="Sep", route_set=("TPE-NRT",), promo_code="go", price_text="TWD 2099",
                  )
                  self.assertEqual(pi.campaign_identity(first), pi.campaign_identity(second))
                  candidates, unresolved = pi.dedupe_campaign_sightings((second, first))
                  self.assertEqual(unresolved, ())
                  self.assertEqual(len(candidates), 1)
                  self.assertEqual(candidates[0].discovery_source_ids, ("a", "b"))
                  self.assertEqual(tuple(x.price_text for x in candidates[0].sightings), ("TWD 1999", "TWD 2099"))

              def test_unresolved_signal_is_not_promoted_and_itinerary_identity_has_no_price(self):
                  now = datetime(2026, 8, 21, 15, 0, tzinfo=UTC)
                  raw = pi.DiscoverySighting(
                      observation_id="raw", source_id="web", source_url="https://example/", item_url="https://example/raw",
                      observed_at=now, title="unscoped cheap hint",
                  )
                  candidates, unresolved = pi.dedupe_campaign_sightings((raw,))
                  self.assertEqual(candidates, ())
                  self.assertEqual(unresolved, (raw,))
                  ident = pi.exact_itinerary_identity(
                      trip_type="round_trip", exact_origin_airport="TPE", exact_destination_airport_when_known="NRT",
                      outbound_date_or_window="2026-10-05", return_date_or_window="2026-10-09",
                      operating_or_marketing_flight_identity_when_known=("IT200", "IT201"),
                  )
                  self.assertTrue(ident.startswith("itinerary:"))

              def test_current_docs_make_old_fixed_watch_material_historical(self):
                  text = (ROOT / "docs/search-strategy.md").read_text(encoding="utf-8")
                  self.assertIn("Current public-intelligence contract (SR-F, 2026-08-21)", text)
                  self.assertIn("fixed-watch crawler/cadence/state subsystem is retired", text)

          if __name__ == "__main__":
              unittest.main()
          '''), encoding='utf-8')

          # Durable before/after inventory + keep/remove map.
          after = grep_inventory()
          doc = root / 'docs/public-intelligence-simplification-2026-08-21.md'
          before_text = '\n'.join(f'- `{line}`' for line in before[:250]) or '- none'
          after_text = '\n'.join(f'- `{line}`' for line in after[:250]) or '- none'
          doc.write_text(f'''# CFR-SR-F — public-intelligence simplification (2026-08-21)\n\nStatus: bounded implementation evidence for Issue #73.\n\n## Decision\nRetire the fixed-watch crawler/cadence/state subsystem. Its optional Signal value does not justify maintaining a separate Scrapy/Playwright execution plane, freshness state machine, artifacts and parser registry after the substrate reassessment. Public intelligence remains best-effort opportunistic/verification-only context and is never Deal/anomaly/backend coverage authority.\n\n## KEEP\n- `src/cheap_flight_radar/public_intelligence.py`: source-agnostic `DiscoverySighting`, campaign identity/dedupe, exact-itinerary identity and observation provenance helpers.\n- ChatGPT Web/public social/news/airline promotion discovery as opportunistic Signal/seed input when useful.\n- Candidate-triggered airline/OTA/metasearch verification surfaces.\n- Existing core Daily/Scoped provider routing, SR-D gflights/Kiwi behavior, SR-E blind spots and CFR→FTR truth.\n\n## RETIRE\n- `.github/workflows/fixed-watch-run.yml`.\n- `fixed_watch_runner.py`, `fixed_watch_state.py`, `public_sources.py`.\n- fixed-watch cadence/reuse/manifest/parser contracts and tests/fixtures.\n- Scrapy and scrapy-playwright project dependencies/browser installation path.\n- fixed-watch publication coverage requirement and machine-SSOT registry/runtime.\n\n## Before inventory\n{before_text}\n\n## After inventory\n{after_text}\n\nHistorical research/docs may still mention fixed watches as prior evidence. Current executable authority is `PRODUCT_INTENT.md` + `flight-radar.yaml` + the SR-F current section in `docs/search-strategy.md`.\n''', encoding='utf-8')

          # Remove this one-shot worker from the final PR tree.
          wf = root / '.github/workflows/sr-f-worker.yml'
          if wf.exists():
              wf.unlink()
          PY

          python -m pip install -e .
          python -m unittest discover -s tests -v

          # No executable fixed-watch/crawler residue may remain outside historical docs/evidence.
          if git grep -n -I -E 'from cheap_flight_radar\.(fixed_watch_runner|fixed_watch_state|public_sources)|Scrapy>=|scrapy-playwright|fixed-watch-run\.yml' -- pyproject.toml src tests .github/workflows flight-radar.yaml; then
            echo 'Executable fixed-watch/crawler residue remains' >&2
            exit 1
          fi

          git config user.name 'CFR SR-F Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify CFR public-intelligence signal lane'
          git push origin HEAD:feat/cfr-sr-f-public-intelligence-simplification
