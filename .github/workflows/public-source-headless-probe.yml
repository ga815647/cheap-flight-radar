name: Public source headless probe

on:
  push:
    branches:
      - research/free-public-source-registry-2026-08-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe selected sources with stock Chrome headless
        shell: bash
        run: |
          set -u
          chrome="$(command -v google-chrome || command -v chromium || true)"
          echo "CHROME|${chrome:-missing}"
          test -n "$chrome" || exit 0
          probe() {
            name="$1"; url="$2"; marker="$3"
            body="$(mktemp)"; err="$(mktemp)"
            set +e
            timeout 35 "$chrome" --headless=new --no-sandbox --disable-gpu --dump-dom "$url" >"$body" 2>"$err"
            rc=$?
            set -e
            bytes=$(wc -c <"$body")
            marker_hit=no; challenge=no; login=no
            grep -Fqi "$marker" "$body" && marker_hit=yes
            grep -Eqi 'captcha|challenge-platform|cf-chl|verify you are human|robot check' "$body" "$err" && challenge=yes
            grep -Eqi 'log[ -]?in|登入|登录|sign in' "$body" && login=yes
            printf 'HEADLESS|%s|rc=%s|bytes=%s|marker=%s|challenge=%s|login=%s\n' "$name" "$rc" "$bytes" "$marker_hit" "$challenge" "$login"
            rm -f "$body" "$err"
          }
          probe peach_home 'https://www.flypeach.com/' 'Peach'
          probe jeju_events 'https://www.jejuair.net/zh-tw/event/pastEvent.do' '以前的活動'
          probe tway_events 'https://www.twayair.com/app/promotion/event/being' '이벤트'
          probe eva_news 'https://www.evaair.com/zh-tw/about-eva-air/news/' '最新消息'
          probe facebook_taiwanairtkt 'https://www.facebook.com/TaiwanAirTkt/' '台灣航空福利社'
