name: One-shot operator reacquisition patch

on:
  push:
    branches:
      - fix/operator-same-day-reacquisition-20260815
    paths:
      - ".github/workflows/dev-operator-reacquisition-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/operator-same-day-reacquisition-20260815
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply durable operator reacquisition change
        shell: bash
        run: |
          python - <<'PATCHPY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "PRODUCT_INTENT.md",
              "- Run the Radar about **once per day** for now; no immediate-alert requirement.\n",
              "- Routine automation should run the Radar about **once per day** for now; no immediate-alert requirement. This is a scheduling preference, not a prohibition on an explicit same-day operator-requested reacquisition when the user wants refreshed evidence, diagnosis, or a provider-health comparison.\n- An operator-requested same-day reacquisition must be explicitly identified and append immutable evidence. It must not weaken duplicate protection for the routine daily trigger, silently retry a failed automatic run, or overwrite the canonical daily observation.\n",
          )

          replace_once(
              "flight-radar.yaml",
              """    canonical_daily_acquisition:\n      local_day_timezone: Asia/Taipei\n      max_attempts_per_local_day: 1\n      claim_path_template: data/production-attempts/YYYY/MM/DD/canonical.json\n      claim_must_persist_before_live_provider_call: true\n      prior_claim_without_snapshot_action: fail_closed_no_same_day_reacquisition\n      run_recovery_path_template: data/run-evidence/YYYY/MM/DD/{radar_run_id}\n      recovery_manifest_required_before_active_publication: true\n""",
              """    canonical_daily_acquisition:\n      local_day_timezone: Asia/Taipei\n      max_automatic_attempts_per_local_day: 1\n      scope: routine_automatic_control_only\n      claim_path_template: data/production-attempts/YYYY/MM/DD/canonical.json\n      claim_must_persist_before_live_provider_call: true\n      prior_claim_without_snapshot_action: fail_closed_no_automatic_same_day_reacquisition\n      run_recovery_path_template: data/run-evidence/YYYY/MM/DD/{radar_run_id}\n      recovery_manifest_required_before_active_publication: true\n    operator_requested_reacquisition:\n      enabled: true\n      requires_explicit_user_or_operator_request: true\n      automatic_retry: false\n      request_id_required: true\n      request_id_must_be_unique_per_intentional_attempt: true\n      claim_path_template: data/operator-attempts/YYYY/MM/DD/{request_id}.json\n      claim_must_persist_before_live_provider_call: true\n      duplicate_same_request_id_action: recovery_or_noop_never_reacquire\n      run_id_prefix_template: operator-radar-{request_id}-\n      snapshot_is_additional_immutable_price_history: true\n      does_not_consume_or_replace_canonical_daily_claim: true\n      does_not_overwrite_canonical_daily_snapshot: true\n""",
          )

          replace_once(
              "flight-radar.yaml",
              """    canonical_daily_control:\n      branch: ops/radar-request\n      request_path: requests/daily.json\n      request_mode: canonical_daily\n      request_local_date_timezone: Asia/Taipei\n      request_must_match_current_local_date: true\n    publication_trigger: presentation_manifest_push\n""",
              """    canonical_daily_control:\n      branch: ops/radar-request\n      request_path: requests/daily.json\n      request_mode: canonical_daily\n      request_local_date_timezone: Asia/Taipei\n      request_must_match_current_local_date: true\n    operator_reacquisition_control:\n      branch: ops/radar-operator-request\n      request_path: requests/operator.json\n      request_mode: operator_reacquisition\n      request_local_date_timezone: Asia/Taipei\n      request_must_match_current_local_date: true\n      request_id_required: true\n      requires_explicit_user_or_operator_request: true\n      scheduled_or_automatic_use: forbidden\n    publication_trigger: presentation_manifest_push\n""",
          )

          replace_once(
              ".github/workflows/canonical-production-radar.yml",
              "concurrency:\n  group: canonical-production-radar\n  cancel-in-progress: false\n",
              "concurrency:\n  group: production-radar-acquisition\n  cancel-in-progress: false\n",
          )

          replace_once(
              "src/cheap_flight_radar/production_runtime.py",
              "import json\nfrom pathlib import Path\nfrom typing import Any, Mapping, Sequence\n",
              "import json\nfrom pathlib import Path\nimport re\nfrom typing import Any, Mapping, Sequence\n",
          )

          runtime_helper = r'''

def _replace_run_identity(value: Any, old_id: str, new_id: str) -> Any:
    if isinstance(value, str):
        return value.replace(old_id, new_id)
    if isinstance(value, list):
        return [_replace_run_identity(item, old_id, new_id) for item in value]
    if isinstance(value, dict):
        return {key: _replace_run_identity(item, old_id, new_id) for key, item in value.items()}
    return value


def retag_run_artifacts(
    *,
    output_dir: Path,
    paths: Mapping[str, str],
    run_id_prefix: str,
    execution_mode: str,
) -> Mapping[str, str]:
    """Retag one completed acquisition without re-querying providers.

    Canonical automatic runs retain the ``production-radar-*`` identity. Explicit
    operator reacquisitions are retagged after acquisition so their immutable
    snapshot can coexist on the same local day without entering the canonical
    daily snapshot namespace.
    """

    prefix = run_id_prefix.strip("-.")
    if not prefix or re.search(r"[^A-Za-z0-9._-]", prefix):
        raise ValueError("run_id_prefix must contain only path-safe characters")
    if prefix == "production-radar":
        return paths

    result_path = Path(paths["run_result"])
    manifest_path = Path(paths["publication_manifest"])
    snapshot_path = Path(paths["history_snapshot"])
    result = json.loads(result_path.read_text(encoding="utf-8"))
    manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
    snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))

    old_id = str(result.get("radar_run_id") or "")
    if not old_id.startswith("production-radar-"):
        raise ValueError("retag source must be a production-radar run")
    suffix = old_id.removeprefix("production-radar-")
    new_id = f"{prefix}-{suffix}"
    old_safe = re.sub(r"[^A-Za-z0-9._-]+", "-", old_id).strip("-.")
    new_safe = re.sub(r"[^A-Za-z0-9._-]+", "-", new_id).strip("-.")

    transformed_result = _replace_run_identity(result, old_id, new_id)
    transformed_manifest = _replace_run_identity(manifest, old_id, new_id)
    transformed_snapshot = _replace_run_identity(snapshot, old_id, new_id)
    history_rel = Path(str(manifest["history_snapshot_path"]))
    if history_rel.name != f"{old_safe}.json":
        raise ValueError("history snapshot path does not match source run identity")
    new_history_rel = history_rel.with_name(f"{new_safe}.json").as_posix()
    transformed_manifest["history_snapshot_path"] = new_history_rel
    transformed_manifest["execution_mode"] = execution_mode
    transformed_result["execution_mode"] = execution_mode

    new_snapshot_path = snapshot_path.with_name(f"{new_safe}.json")
    new_manifest_path = manifest_path.with_name(f"{new_id}.json")
    new_snapshot_path.write_text(
        json.dumps(transformed_snapshot, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
        encoding="utf-8",
    )
    new_manifest_path.write_text(
        json.dumps(transformed_manifest, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
        encoding="utf-8",
    )
    result_path.write_text(
        json.dumps(transformed_result, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
        encoding="utf-8",
    )
    if new_snapshot_path != snapshot_path:
        snapshot_path.unlink()
    if new_manifest_path != manifest_path:
        manifest_path.unlink()
    return {
        "history_snapshot": new_snapshot_path.as_posix(),
        "publication_manifest": new_manifest_path.as_posix(),
        "run_result": result_path.as_posix(),
    }
'''
          replace_once(
              "src/cheap_flight_radar/production_runtime.py",
              "\n\nasync def _async_main(args: argparse.Namespace) -> int:\n",
              runtime_helper + "\n\nasync def _async_main(args: argparse.Namespace) -> int:\n",
          )

          replace_once(
              "src/cheap_flight_radar/production_runtime.py",
              """    paths = write_run_artifacts(result, policy=policy, output_dir=Path(args.output_dir))\n    print(json.dumps({\n        \"radar_run_id\": result.radar_run_id,\n        \"run_at\": result.run_at,\n        \"deal_count\": len(result.deals),\n        \"signal_count\": len(result.signals),\n        \"signal_states\": {\n            state: sum(1 for item in result.signals if item.state == state)\n            for state in sorted({item.state for item in result.signals})\n        },\n        \"coverage\": result.coverage,\n        \"provider_failures\": list(result.provider_failures),\n        \"paths\": paths,\n    }, ensure_ascii=False, sort_keys=True, indent=2))\n""",
              """    paths = write_run_artifacts(result, policy=policy, output_dir=Path(args.output_dir))\n    if args.run_id_prefix != \"production-radar\":\n        paths = retag_run_artifacts(\n            output_dir=Path(args.output_dir),\n            paths=paths,\n            run_id_prefix=args.run_id_prefix,\n            execution_mode=args.execution_mode,\n        )\n    summary = json.loads(Path(paths[\"run_result\"]).read_text(encoding=\"utf-8\"))\n    print(json.dumps({\n        \"radar_run_id\": summary[\"radar_run_id\"],\n        \"run_at\": summary[\"run_at\"],\n        \"deal_count\": summary[\"deal_count\"],\n        \"signal_count\": summary[\"signal_count\"],\n        \"signal_states\": summary[\"signal_states\"],\n        \"coverage\": summary[\"coverage\"],\n        \"provider_failures\": summary[\"provider_failures\"],\n        \"paths\": paths,\n    }, ensure_ascii=False, sort_keys=True, indent=2))\n""",
          )

          replace_once(
              "src/cheap_flight_radar/production_runtime.py",
              """    parser.add_argument(\"--output-dir\", required=True)\n    args = parser.parse_args(argv)\n""",
              """    parser.add_argument(\"--output-dir\", required=True)\n    parser.add_argument(\n        \"--run-id-prefix\",\n        default=\"production-radar\",\n        help=\"Path-safe run identity prefix; operator workflows use a request-specific prefix\",\n    )\n    parser.add_argument(\n        \"--execution-mode\",\n        default=\"canonical_daily\",\n        help=\"Provenance label embedded in non-canonical retagged run artifacts\",\n    )\n    args = parser.parse_args(argv)\n""",
          )

          operator_module = r'''"""Explicit operator-requested same-day Radar acquisition guardrails.

Routine automation remains canonical once per Asia/Taipei day. This module
provides a separate request-id namespace for an explicitly requested additional
live acquisition. A duplicate invocation of the same request id is recovery or
no-op only; a new live attempt requires a new explicit request id.
"""
from __future__ import annotations

import argparse
from dataclasses import asdict, dataclass
from datetime import date, datetime
import json
from pathlib import Path
import re
import shutil
from typing import Any, Mapping, Sequence
from zoneinfo import ZoneInfo

PROJECT_TIMEZONE = ZoneInfo("Asia/Taipei")
OPERATOR_RUN_PREFIX = "operator-radar-"
REQUEST_ID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")


@dataclass(frozen=True)
class OperatorOperationState:
    requested_date: str
    request_id: str
    status: str
    claim_path: str
    radar_run_id: str | None = None
    history_snapshot_path: str | None = None
    recovery_manifest_path: str | None = None
    publication_manifest_path: str | None = None
    reason: str | None = None


def _validate_request_id(request_id: str) -> str:
    if not REQUEST_ID_RE.fullmatch(request_id):
        raise ValueError("request_id must be 1-64 path-safe characters")
    return request_id


def _day_parts(requested_date: str) -> tuple[str, str, str]:
    parsed = date.fromisoformat(requested_date)
    return f"{parsed.year:04d}", f"{parsed.month:02d}", f"{parsed.day:02d}"


def operator_claim_repository_path(requested_date: str, request_id: str) -> str:
    request_id = _validate_request_id(request_id)
    year, month, day = _day_parts(requested_date)
    return f"data/operator-attempts/{year}/{month}/{day}/{request_id}.json"


def operator_run_prefix(request_id: str) -> str:
    return f"{OPERATOR_RUN_PREFIX}{_validate_request_id(request_id)}-"


def run_evidence_repository_dir(requested_date: str, radar_run_id: str) -> str:
    year, month, day = _day_parts(requested_date)
    return f"data/run-evidence/{year}/{month}/{day}/{radar_run_id}"


def _read_json(path: Path) -> Mapping[str, Any]:
    payload = json.loads(path.read_text(encoding="utf-8"))
    if not isinstance(payload, Mapping):
        raise ValueError(f"JSON object required: {path}")
    return payload


def _snapshot_files(history_dir: Path, requested_date: str, request_id: str) -> list[Path]:
    year, month, day = _day_parts(requested_date)
    root = history_dir / "data" / "price-history" / year / month / day
    if not root.exists():
        return []
    prefix = operator_run_prefix(request_id)
    return sorted(path for path in root.glob(f"{prefix}*.json") if path.is_file())


def inspect_operator_state(
    *,
    history_dir: Path,
    publication_dir: Path,
    requested_date: str,
    request_id: str,
) -> OperatorOperationState:
    claim_rel = operator_claim_repository_path(requested_date, request_id)
    claim_path = history_dir / claim_rel
    snapshots = _snapshot_files(history_dir, requested_date, request_id)
    if len(snapshots) > 1:
        return OperatorOperationState(
            requested_date=requested_date,
            request_id=request_id,
            status="blocked_multiple_operator_snapshots",
            claim_path=claim_rel,
            reason="more than one snapshot exists for one operator request id",
        )
    if not snapshots:
        if claim_path.exists():
            return OperatorOperationState(
                requested_date=requested_date,
                request_id=request_id,
                status="blocked_prior_operator_attempt",
                claim_path=claim_rel,
                reason="operator request claim exists without persisted success; same request id cannot reacquire",
            )
        return OperatorOperationState(
            requested_date=requested_date,
            request_id=request_id,
            status="acquire",
            claim_path=claim_rel,
            reason="new explicit operator request id",
        )

    snapshot_path = snapshots[0]
    snapshot = _read_json(snapshot_path)
    radar_run_id = str(snapshot.get("radar_run_id") or "")
    if not radar_run_id.startswith(operator_run_prefix(request_id)):
        return OperatorOperationState(
            requested_date=requested_date,
            request_id=request_id,
            status="blocked_invalid_snapshot_identity",
            claim_path=claim_rel,
            history_snapshot_path=snapshot_path.relative_to(history_dir).as_posix(),
            reason="operator snapshot run id does not match request id",
        )

    evidence_dir = history_dir / run_evidence_repository_dir(requested_date, radar_run_id)
    recovery_manifest = evidence_dir / "publication-manifest.json"
    publication_manifest = publication_dir / "publication" / "runs" / f"{radar_run_id}.json"
    common = dict(
        requested_date=requested_date,
        request_id=request_id,
        claim_path=claim_rel,
        radar_run_id=radar_run_id,
        history_snapshot_path=snapshot_path.relative_to(history_dir).as_posix(),
        recovery_manifest_path=recovery_manifest.relative_to(history_dir).as_posix(),
        publication_manifest_path=publication_manifest.relative_to(publication_dir).as_posix(),
    )
    if publication_manifest.exists():
        if not recovery_manifest.exists():
            return OperatorOperationState(
                status="blocked_missing_recovery_evidence",
                reason="active operator publication exists without immutable recovery evidence",
                **common,
            )
        if publication_manifest.read_bytes() != recovery_manifest.read_bytes():
            return OperatorOperationState(
                status="blocked_manifest_divergence",
                reason="active operator publication differs from immutable recovery evidence",
                **common,
            )
        return OperatorOperationState(
            status="published",
            reason="operator acquisition and publication already exist",
            **common,
        )
    if recovery_manifest.exists():
        return OperatorOperationState(
            status="recover_publication",
            reason="operator acquisition exists; republish without reacquisition",
            **common,
        )
    return OperatorOperationState(
        status="blocked_missing_recovery_evidence",
        reason="operator snapshot exists without immutable recovery manifest",
        **common,
    )


def write_operator_claim(
    *,
    history_dir: Path,
    requested_date: str,
    request_id: str,
    claimed_at: str,
    workflow_run_id: str,
    workflow_run_url: str,
    trigger_sha: str,
) -> Path:
    parsed_claimed_at = datetime.fromisoformat(claimed_at.replace("Z", "+00:00"))
    if parsed_claimed_at.tzinfo is None or parsed_claimed_at.utcoffset() is None:
        raise ValueError("claimed_at must be timezone-aware")
    target = history_dir / operator_claim_repository_path(requested_date, request_id)
    if target.exists():
        raise FileExistsError(f"operator acquisition claim already exists: {target}")
    target.parent.mkdir(parents=True, exist_ok=True)
    payload = {
        "schema_version": 1,
        "mode": "operator_reacquisition",
        "requested_date": requested_date,
        "request_id": request_id,
        "claimed_at": claimed_at,
        "workflow_run_id": str(workflow_run_id),
        "workflow_run_url": workflow_run_url,
        "trigger_sha": trigger_sha,
        "semantics": "explicit_operator_requested_live_reacquisition",
    }
    target.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
    return target


def stage_operator_success_evidence(
    *,
    output_dir: Path,
    history_dir: Path,
    requested_date: str,
    request_id: str,
) -> Mapping[str, str]:
    claim_path = history_dir / operator_claim_repository_path(requested_date, request_id)
    if not claim_path.exists():
        raise FileNotFoundError("operator acquisition claim must exist before staging success")
    result_path = output_dir / "run-result.json"
    result = _read_json(result_path)
    radar_run_id = str(result.get("radar_run_id") or "")
    if not radar_run_id.startswith(operator_run_prefix(request_id)):
        raise ValueError("runtime result does not match operator request identity")
    if result.get("execution_mode") != "operator_requested_reacquisition":
        raise ValueError("operator runtime result missing explicit execution_mode")
    run_at = datetime.fromisoformat(str(result.get("run_at") or "").replace("Z", "+00:00"))
    if run_at.tzinfo is None or run_at.utcoffset() is None:
        raise ValueError("runtime run_at must be timezone-aware")
    if run_at.astimezone(PROJECT_TIMEZONE).date().isoformat() != requested_date:
        raise ValueError("operator runtime local date does not match request")

    manifest_source = output_dir / "publication" / "runs" / f"{radar_run_id}.json"
    manifest = _read_json(manifest_source)
    if manifest.get("radar_run_id") != radar_run_id:
        raise ValueError("publication manifest radar_run_id mismatch")
    if manifest.get("execution_mode") != "operator_requested_reacquisition":
        raise ValueError("operator publication manifest missing execution_mode")
    history_rel = str(manifest.get("history_snapshot_path") or "")
    if not history_rel:
        raise ValueError("publication manifest missing history_snapshot_path")
    snapshot_source = output_dir / "history" / history_rel
    snapshot = _read_json(snapshot_source)
    if snapshot.get("radar_run_id") != radar_run_id:
        raise ValueError("history snapshot radar_run_id mismatch")

    snapshot_target = history_dir / history_rel
    if snapshot_target.exists():
        raise FileExistsError(f"operator history snapshot already exists: {snapshot_target}")
    snapshot_target.parent.mkdir(parents=True, exist_ok=True)
    shutil.copyfile(snapshot_source, snapshot_target)
    evidence_dir = history_dir / run_evidence_repository_dir(requested_date, radar_run_id)
    if evidence_dir.exists():
        raise FileExistsError(f"operator run recovery evidence already exists: {evidence_dir}")
    evidence_dir.mkdir(parents=True, exist_ok=False)
    recovery_result = evidence_dir / "run-result.json"
    recovery_manifest = evidence_dir / "publication-manifest.json"
    shutil.copyfile(result_path, recovery_result)
    shutil.copyfile(manifest_source, recovery_manifest)
    return {
        "radar_run_id": radar_run_id,
        "history_snapshot_path": snapshot_target.relative_to(history_dir).as_posix(),
        "run_result_path": recovery_result.relative_to(history_dir).as_posix(),
        "recovery_manifest_path": recovery_manifest.relative_to(history_dir).as_posix(),
    }


def restore_operator_publication_manifest(
    *,
    history_dir: Path,
    publication_dir: Path,
    requested_date: str,
    request_id: str,
) -> Mapping[str, str]:
    state = inspect_operator_state(
        history_dir=history_dir,
        publication_dir=publication_dir,
        requested_date=requested_date,
        request_id=request_id,
    )
    if state.status == "published":
        return {
            "status": "already_published",
            "radar_run_id": state.radar_run_id or "",
            "publication_manifest_path": state.publication_manifest_path or "",
        }
    if state.status != "recover_publication":
        raise RuntimeError(f"operator publication cannot recover from state {state.status}: {state.reason}")
    assert state.recovery_manifest_path
    assert state.publication_manifest_path
    source = history_dir / state.recovery_manifest_path
    target = publication_dir / state.publication_manifest_path
    target.parent.mkdir(parents=True, exist_ok=True)
    if target.exists():
        if target.read_bytes() != source.read_bytes():
            raise ValueError("existing operator publication diverges from recovery evidence")
        status = "already_published"
    else:
        shutil.copyfile(source, target)
        status = "staged"
    return {
        "status": status,
        "radar_run_id": state.radar_run_id or "",
        "publication_manifest_path": state.publication_manifest_path,
    }


def _write_json_output(payload: Mapping[str, Any], output: str | None) -> None:
    text = json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n"
    if output:
        path = Path(output)
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(text, encoding="utf-8")
    print(text, end="")


def main(argv: Sequence[str] | None = None) -> int:
    parser = argparse.ArgumentParser(description="Explicit operator Radar acquisition guardrails")
    sub = parser.add_subparsers(dest="command", required=True)
    inspect_parser = sub.add_parser("inspect")
    inspect_parser.add_argument("--history-dir", required=True)
    inspect_parser.add_argument("--publication-dir", required=True)
    inspect_parser.add_argument("--date", required=True)
    inspect_parser.add_argument("--request-id", required=True)
    inspect_parser.add_argument("--output")
    claim_parser = sub.add_parser("claim")
    claim_parser.add_argument("--history-dir", required=True)
    claim_parser.add_argument("--date", required=True)
    claim_parser.add_argument("--request-id", required=True)
    claim_parser.add_argument("--claimed-at", required=True)
    claim_parser.add_argument("--workflow-run-id", required=True)
    claim_parser.add_argument("--workflow-run-url", required=True)
    claim_parser.add_argument("--trigger-sha", required=True)
    stage_parser = sub.add_parser("stage-success")
    stage_parser.add_argument("--output-dir", required=True)
    stage_parser.add_argument("--history-dir", required=True)
    stage_parser.add_argument("--date", required=True)
    stage_parser.add_argument("--request-id", required=True)
    stage_parser.add_argument("--output")
    restore_parser = sub.add_parser("restore-publication")
    restore_parser.add_argument("--history-dir", required=True)
    restore_parser.add_argument("--publication-dir", required=True)
    restore_parser.add_argument("--date", required=True)
    restore_parser.add_argument("--request-id", required=True)
    restore_parser.add_argument("--output")
    args = parser.parse_args(argv)
    if args.command == "inspect":
        state = inspect_operator_state(
            history_dir=Path(args.history_dir),
            publication_dir=Path(args.publication_dir),
            requested_date=args.date,
            request_id=args.request_id,
        )
        _write_json_output(asdict(state), args.output)
        return 0
    if args.command == "claim":
        path = write_operator_claim(
            history_dir=Path(args.history_dir),
            requested_date=args.date,
            request_id=args.request_id,
            claimed_at=args.claimed_at,
            workflow_run_id=args.workflow_run_id,
            workflow_run_url=args.workflow_run_url,
            trigger_sha=args.trigger_sha,
        )
        _write_json_output({"claim_path": path.as_posix()}, None)
        return 0
    if args.command == "stage-success":
        payload = stage_operator_success_evidence(
            output_dir=Path(args.output_dir),
            history_dir=Path(args.history_dir),
            requested_date=args.date,
            request_id=args.request_id,
