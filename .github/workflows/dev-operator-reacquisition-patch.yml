name: One-shot operator reacquisition patch

on:
  push:
    branches:
      - fix/operator-same-day-reacquisition-20260815
    paths:
      - ".github/workflows/dev-operator-reacquisition-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/operator-same-day-reacquisition-20260815
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply durable operator reacquisition change
        run: python .github/patch_operator.py

      - name: Install current package
        run: python -m pip install -e .

      - name: Run full Gate
        run: python -m unittest discover -s tests -v

      - name: Commit durable patch and remove scaffold
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow explicit same-day operator Radar reacquisition"
          git push origin HEAD:fix/operator-same-day-reacquisition-20260815
