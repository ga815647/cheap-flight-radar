name: FlyAI Repeat Query Research

on:
  push:
    branches:
      - research/flyai-keyless-validation-2026-08-10

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official FlyAI CLI
        run: npm install -g @fly-ai/flyai-cli@1.0.16

      - name: Run repeat-query stability probe
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          out = Path("research-output")
          out.mkdir(exist_ok=True)
          cases = {
              "J1": ("TPE", "NRT", "2026-10-13", "2026-10-17"),
              "J2": ("TSA", "HND", "2026-10-13", "2026-10-18"),
              "J3": ("RMQ", "KIX", "2026-10-13", "2026-10-17"),
              "J4": ("KHH", "FUK", "2026-10-13", "2026-10-17"),
              "K1": ("TPE", "ICN", "2026-10-13", "2026-10-17"),
              "K2": ("KHH", "PUS", "2026-10-13", "2026-10-17"),
              "C1": ("TSA", "SHA", "2026-10-13", "2026-10-17"),
              "C2": ("TPE", "XMN", "2026-10-13", "2026-10-17"),
              "S1": ("TPE", "SGN", "2026-10-13", "2026-10-17"),
              "L1": ("TPE", "LAX", "2026-10-13", "2026-10-23"),
          }

          def query(expected):
              origin, destination, out_date, back_date = expected
              args = [
                  "flyai", "search-flight",
                  "--origin", origin,
                  "--destination", destination,
                  "--dep-date", out_date,
                  "--back-date", back_date,
                  "--seat-class-name", "economy",
                  "--sort-type", "3",
              ]
              proc = subprocess.run(args, capture_output=True, text=True, timeout=120)
              payload = json.loads(proc.stdout) if proc.stdout.strip() else {}
              return proc.returncode, payload

          def exact(item, expected):
              origin, destination, out_date, back_date = expected
              journeys = item.get("journeys") or []
              if len(journeys) < 2:
                  return False
              outbound = journeys[0].get("segments") or []
              inbound = journeys[1].get("segments") or []
              if not outbound or not inbound:
                  return False
              return (
                  outbound[0].get("depStationCode") == origin
                  and outbound[-1].get("arrStationCode") == destination
                  and (outbound[0].get("depDateTime") or "")[:10] == out_date
                  and inbound[0].get("depStationCode") == destination
                  and inbound[-1].get("arrStationCode") == origin
                  and (inbound[0].get("depDateTime") or "")[:10] == back_date
              )

          def signature(item):
              return tuple(
                  tuple(
                      (
                          seg.get("depStationCode"),
                          seg.get("arrStationCode"),
                          seg.get("depDateTime"),
                          seg.get("marketingTransportNo"),
                      )
                      for seg in (journey.get("segments") or [])
                  )
                  for journey in (item.get("journeys") or [])
              )

          def price_number(item):
              try:
                  return float(item.get("ticketPrice"))
              except (TypeError, ValueError):
                  return None

          results = {}
          attempts = 0
          same_itinerary = 0
          same_price = 0
          repeat_query_ok = 0

          for case_id, expected in cases.items():
              code1, first = query(expected)
              code2, second = query(expected)
              items1 = (((first.get("data") or {}).get("itemList")) or [])
              items2 = (((second.get("data") or {}).get("itemList")) or [])
              exact1 = [item for item in items1 if exact(item, expected)]
              exact2 = [item for item in items2 if exact(item, expected)]
              numeric1 = [item for item in exact1 if price_number(item) is not None]
              selected = min(numeric1, key=price_number) if numeric1 else (exact1[0] if exact1 else None)
              matched = None
              if selected:
                  attempts += 1
                  sig = signature(selected)
                  for item in exact2:
                      if signature(item) == sig:
                          matched = item
                          break
              query_ok = code2 == 0 and second.get("status") == 0
              if query_ok:
                  repeat_query_ok += 1
              found = matched is not None
              price_stable = found and matched.get("ticketPrice") == selected.get("ticketPrice")
              if found:
                  same_itinerary += 1
              if price_stable:
                  same_price += 1
              results[case_id] = {
                  "first_command_exit": code1,
                  "first_provider_status": first.get("status"),
                  "repeat_command_exit": code2,
                  "repeat_provider_status": second.get("status"),
                  "first_exact_item_count": len(exact1),
                  "repeat_exact_item_count": len(exact2),
                  "selected_ticketPrice": selected.get("ticketPrice") if selected else None,
                  "same_selected_itinerary_in_repeat": found,
                  "repeat_ticketPrice": matched.get("ticketPrice") if matched else None,
                  "same_ticketPrice": bool(price_stable),
                  "note": "repeat-query proxy only; not provider offer refresh or checkout revalidation",
              }

          aggregate = {
              "provider": "FlyAI search-flight",
              "credential_mode": "keyless_trial",
              "method": "immediate identical exact query repeated once; compare selected exact itinerary signature and ticketPrice",
              "cases": len(cases),
              "repeat_query_provider_success": repeat_query_ok,
              "repeat_query_provider_success_rate": repeat_query_ok / len(cases),
              "selected_itinerary_attempts": attempts,
              "same_itinerary_found": same_itinerary,
              "same_itinerary_rate": same_itinerary / attempts if attempts else None,
              "same_itinerary_and_ticketPrice": same_price,
              "same_itinerary_and_ticketPrice_rate": same_price / attempts if attempts else None,
              "true_revalidation_success": None,
              "staleness_rate": None,
              "limitation": "This is a repeat-query stability proxy. FlyAI trial search does not expose a documented offer-refresh endpoint in the tested CLI schema, and ticketPrice lacks explicit currency/tax/baggage semantics in these results.",
          }
          payload = {"aggregate": aggregate, "cases": results}
          (out / "repeat-query-summary.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2))
          print(json.dumps(aggregate, ensure_ascii=False, indent=2))

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyai-repeat-query-stability
          path: research-output/
          if-no-files-found: error
