[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cheap-flight-radar"
version = "0.1.0"
description = "Policy and scoring primitives for a Taiwan-origin cheap flight radar"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "Scrapy>=2.17,<3",
]

[project.optional-dependencies]
browser = [
  "scrapy-playwright>=0.0.48,<0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
